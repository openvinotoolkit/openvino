name: Linux GPU MLIR / Graph Compiler ( Ubuntu 24.04 )

# Validates the MLIR / Graph-Compiler paths of the GPU plugin:
#   * one build with -DENABLE_GRAPH_COMPILER=ON (LLVM + Graph Compiler are built from source)
#   * all GPU unit tests with MLIR disabled (OV_GPU_ENABLE_MLIR=0) - regression guard: a
#     GC-enabled build must behave exactly like a stock GPU build when the feature is off
#   * all MLIR functional tests with MLIR enabled (OV_GPU_ENABLE_MLIR=1)
#
# `paths:` below narrows the trigger down to MLIR-related files.

on:
  workflow_dispatch:
    inputs:
      target-branch:
        description: 'Target branch for the build; taken from event context by default'
        type: string
        required: false
      graph-compiler-ref:
        description: 'Graph Compiler branch/tag/SHA to build against'
        type: string
        required: false
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - '.github/workflows/dev_gpu_linux_mlir.yml'
      - 'cmake/graph-compiler.cmake'
      - 'cmake/llvm.cmake'
      - 'src/plugins/intel_gpu/CMakeLists.txt'
      - 'src/plugins/intel_gpu/include/intel_gpu/op/mlir_op.hpp'
      - 'src/plugins/intel_gpu/include/intel_gpu/primitives/mlir_primitive.hpp'
      - 'src/plugins/intel_gpu/include/intel_gpu/runtime/options.inl'
      - 'src/plugins/intel_gpu/src/graph/impls/common/mlir_primitive.*'
      - 'src/plugins/intel_gpu/src/graph/include/mlir_primitive_inst.h'
      - 'src/plugins/intel_gpu/src/graph/mlir_primitive.cpp'
      - 'src/plugins/intel_gpu/src/graph/registry/mlir_primitive_impls.cpp'
      - 'src/plugins/intel_gpu/src/plugin/ops/mlir_op.cpp'
      - 'src/plugins/intel_gpu/src/plugin/transformations/mlir/**'
      - 'src/plugins/intel_gpu/src/plugin/transformations/op/mlir_op.cpp'
      - 'src/plugins/intel_gpu/src/plugin/transformations_pipeline.cpp'
      - 'src/plugins/intel_gpu/tests/functional/CMakeLists.txt'
      - 'src/plugins/intel_gpu/tests/functional/mlir_op/**'
  push:
    branches:
      - master
      - 'releases/**'
    paths:
      - '.github/workflows/dev_gpu_linux_mlir.yml'
      - 'cmake/graph-compiler.cmake'
      - 'cmake/llvm.cmake'
      - 'src/plugins/intel_gpu/CMakeLists.txt'
      - 'src/plugins/intel_gpu/include/intel_gpu/op/mlir_op.hpp'
      - 'src/plugins/intel_gpu/include/intel_gpu/primitives/mlir_primitive.hpp'
      - 'src/plugins/intel_gpu/include/intel_gpu/runtime/options.inl'
      - 'src/plugins/intel_gpu/src/graph/impls/common/mlir_primitive.*'
      - 'src/plugins/intel_gpu/src/graph/include/mlir_primitive_inst.h'
      - 'src/plugins/intel_gpu/src/graph/mlir_primitive.cpp'
      - 'src/plugins/intel_gpu/src/graph/registry/mlir_primitive_impls.cpp'
      - 'src/plugins/intel_gpu/src/plugin/ops/mlir_op.cpp'
      - 'src/plugins/intel_gpu/src/plugin/transformations/mlir/**'
      - 'src/plugins/intel_gpu/src/plugin/transformations/op/mlir_op.cpp'
      - 'src/plugins/intel_gpu/src/plugin/transformations_pipeline.cpp'
      - 'src/plugins/intel_gpu/tests/functional/CMakeLists.txt'
      - 'src/plugins/intel_gpu/tests/functional/mlir_op/**'

concurrency:
  # github.ref is not unique in post-commit
  group: ${{ github.event_name == 'push' && github.run_id || github.ref }}-linux-gpu-mlir-dev
  cancel-in-progress: true

permissions: read-all

env:
  GRAPH_COMPILER_URL: 'https://github.com/dchigarev/graph-compiler.git'
  GRAPH_COMPILER_REF: ${{ inputs.graph-compiler-ref || 'ov_pin/0.1.0' }}

jobs:
  Smart_CI:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.run_attempt > 1
    outputs:
      affected_components: "${{ steps.smart_ci.outputs.affected_components }}"
      changed_components: "${{ steps.smart_ci.outputs.changed_components }}"
      skip_workflow: "${{ steps.smart_ci.outputs.skip_workflow }}"
    steps:
      - name: checkout action
        uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b # cherry_pick_retries
        timeout-minutes: 15
        with:
          sparse-checkout: .github/actions/smart-ci

      - name: Get affected components
        id: smart_ci
        uses: ./.github/actions/smart-ci
        with:
          repository: ${{ github.repository }}
          pr: ${{ github.event.number }}
          commit_sha: ${{ github.sha }}
          ref_name: ${{ github.ref_name }}
          component_pattern: "category: (.*)"
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          skip_when_only_listed_labels_set: 'docs'
          skip_when_only_listed_files_changed: '*.md,*.rst,*.png,*.jpg,*.svg,*/layer_tests_summary/*,*/conformance/*,.github/workflows/ci-doctor.lock.yml,.github/workflows/ci-doctor-mq.lock.yml'

      - name: Show affected components
        run: |
          echo "${{ toJSON(steps.smart_ci.outputs.affected_components) }}"
        shell: bash

  Docker:
    needs: Smart_CI
    runs-on: aks-linux-4-cores-16gb-docker-build
    container:
      image: openvinogithubactions.azurecr.io/docker_build:0.2
      volumes:
        - /mount:/mount
    outputs:
      images: "${{ steps.handle_docker.outputs.images && steps.handle_docker.outputs.images || steps.mock_image.outputs.images }}"
    steps:
      - name: Set mock output images if pipeline should be skipped
        if: ${{ needs.smart_ci.outputs.skip_workflow == 'True' }}
        id: mock_image
        run: echo "images={\"ov_test\":{\"ubuntu_24_04_x64_dgpu\":\"mock\"},\"ov_build\":{\"ubuntu_24_04_x64\":\"mock\"}}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: ${{ needs.smart_ci.outputs.skip_workflow != 'True' }}
        uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b # cherry_pick_retries
        timeout-minutes: 15

      - uses: ./.github/actions/handle_docker
        if: ${{ needs.smart_ci.outputs.skip_workflow != 'True' }}
        id: handle_docker
        with:
          images: |
            ov_build/ubuntu_24_04_x64
            ov_test/ubuntu_24_04_x64_dgpu
          registry: 'openvinogithubactions.azurecr.io'
          dockerfiles_root_dir: '.github/dockerfiles'
          changed_components: ${{ needs.smart_ci.outputs.changed_components }}

  Build:
    name: Build (LLVM + Graph Compiler + OpenVINO)
    needs: [ Docker, Smart_CI ]
    if: "!needs.smart_ci.outputs.skip_workflow && fromJSON(needs.smart_ci.outputs.affected_components).GPU"
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    runs-on: aks-linux-16-cores-64gb
    container:
      image: ${{ fromJSON(needs.docker.outputs.images).ov_build.ubuntu_24_04_x64 }}
      volumes:
        - /mount:/mount
        - /home/runner/secrets/:/secrets:ro
        - ${{ github.workspace }}:${{ github.workspace }} # Needed as ${{ github.workspace }} is not working correctly when using Docker
      options: >-
        -e SCCACHE_AZURE_BLOB_CONTAINER
    env:
      DEBIAN_FRONTEND: noninteractive # to prevent apt-get from waiting user input
      CMAKE_BUILD_TYPE: 'Release'
      CMAKE_GENERATOR: 'Ninja'
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
      SCCACHE_IGNORE_SERVER_IO_ERROR: 1
      SCCACHE_SERVER_PORT: 35555
      SCCACHE_ERROR_LOG: ${{ github.workspace }}/sccache_log.txt
      SCCACHE_LOG: warn
      SCCACHE_AZURE_KEY_PREFIX: ubuntu_24_04_x86_64_mlir_Release
      OPENVINO_REPO: ${{ github.workspace }}/openvino
      BUILD_DIR: ${{ github.workspace }}/openvino_build
      INSTALL_DIR: ${{ github.workspace }}/openvino_install
      INSTALL_TEST_DIR: ${{ github.workspace }}/tests_install
      GC_REPO: ${{ github.workspace }}/graph-compiler
      # `scripts/compile.sh` installs LLVM into `<gc>/externals/llvm` and Graph Compiler
      # into `<gc>/build/install` when GITHUB_ACTIONS=true.
      LLVM_INSTALL_DIR: ${{ github.workspace }}/graph-compiler/externals/llvm
      GC_INSTALL_DIR: ${{ github.workspace }}/graph-compiler/build/install
      # LLVM_CACHE_DIR: /mount/caches/graph-compiler/llvm/ubuntu_24_04_x86_64_Release

    steps:
      - name: Load SCCACHE_AZURE_CONNECTION_STRING from file
        run: |
          SCCACHE_AZURE_CONNECTION_STRING="$(cat /secrets/sccache/connection-string)"
          echo "::add-mask::${SCCACHE_AZURE_CONNECTION_STRING}"
          echo "SCCACHE_AZURE_CONNECTION_STRING=${SCCACHE_AZURE_CONNECTION_STRING}" >> "$GITHUB_ENV"

      - name: Clone OpenVINO
        uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b # cherry_pick_retries
        timeout-minutes: 15
        with:
          path: ${{ env.OPENVINO_REPO }}
          submodules: 'recursive'
          ref: ${{ inputs.target-branch }}

      - name: Clone Graph Compiler
        run: |
          git clone --depth 1 --branch "${GRAPH_COMPILER_REF}" "${GRAPH_COMPILER_URL}" "${GC_REPO}"
          echo "Graph Compiler at $(git -C "${GC_REPO}" rev-parse HEAD)"

      - name: System info
        uses: ./openvino/.github/actions/system_info

      # Skip the cache for now as it can hit OV's gh-cache limit
      # - name: Compute LLVM cache key
      #   id: cache_keys
      #   working-directory: ${{ env.GC_REPO }}
      #   run: |
      #     # The key must be derived from everything that changes the LLVM install tree:
      #     # the pinned revision, the build script and the out-of-tree patches. It must not
      #     # contain the commit SHA - the cache action refuses to overwrite an existing
      #     # entry, so a per-commit key would write a new multi-GB tarball on every run.
      #     llvm_sha=$( { cat cmake/llvm-version.txt scripts/compile.sh patches/*.patch; } | sha1sum | cut -d' ' -f1 )
      #     echo "llvm-key=llvm-Release-${llvm_sha}" >> "$GITHUB_OUTPUT"
      #     # The restore action creates the target directory with a non-recursive mkdir, so
      #     # the parent must already exist or the restore silently degrades to a cache miss.
      #     mkdir -p "${LLVM_INSTALL_DIR}"
      #
      # - name: Restore LLVM from cache
      #   id: llvm_cache
      #   uses: ./openvino/.github/actions/cache/restore
      #   with:
      #     cache-path: ${{ env.LLVM_CACHE_DIR }}
      #     path: ${{ env.LLVM_INSTALL_DIR }}
      #     key: ${{ steps.cache_keys.outputs.llvm-key }}
      #     # Deliberately no `restore-keys`: a partially matching LLVM would have different
      #     # patches applied, `compile.sh` would accept it as a cache hit and the build would
      #     # fail later with unresolved mlir::* symbols. Either an exact match or a rebuild.

      - name: Install Graph Compiler build dependencies
        run: python3 -m pip install lit nanobind

      - name: Build LLVM and Graph Compiler
        working-directory: ${{ env.GC_REPO }}
        run: |
          # GITHUB_ACTIONS=true makes compile.sh install LLVM into externals/llvm and
          # short-circuit the LLVM build entirely when externals/llvm/lib/cmake/mlir
          # already exists (i.e. on a cache hit).
          ./scripts/compile.sh -r

      # Skip the cache for now as it can hit OV's gh-cache limit
      # - name: Shrink the LLVM install tree
      #   if: steps.llvm_cache.outputs.cache-hit != 'true'
      #   run: |
      #     # Everything below is unused by the OpenVINO build. Files referenced by the LLVM
      #     # cmake config are truncated rather than deleted, otherwise `find_package(LLVM)`
      #     # fails on a cache hit.
      #     rm -rf "${LLVM_INSTALL_DIR}/share" "${LLVM_INSTALL_DIR}/python_packages" "${LLVM_INSTALL_DIR}/src"
      #     find "${LLVM_INSTALL_DIR}/bin/" -type f \
      #       ! -name FileCheck ! -name llvm-lit ! -name mlir-tblgen ! -name split-file \
      #       -exec truncate -s 0 {} +
      #     du -sh "${LLVM_INSTALL_DIR}"
      #
      # - name: Save LLVM to cache
      #   if: steps.llvm_cache.outputs.cache-hit != 'true'
      #   uses: ./openvino/.github/actions/cache/save
      #   with:
      #     cache-path: ${{ env.LLVM_CACHE_DIR }}
      #     path: ${{ env.LLVM_INSTALL_DIR }}
      #     key: ${{ steps.cache_keys.outputs.llvm-key }}

      - name: Clean sccache stats
        run: ${SCCACHE_PATH} --zero-stats

      - name: CMake configure - OpenVINO
        run: |
          cmake -S "${OPENVINO_REPO}" -B "${BUILD_DIR}" \
            -DENABLE_GRAPH_COMPILER=ON \
            -DGraphCompiler_DIR="${GC_INSTALL_DIR}/lib/cmake/GraphCompiler" \
            -DMLIR_DIR="${LLVM_INSTALL_DIR}/lib/cmake/mlir" \
            -DLLVM_DIR="${LLVM_INSTALL_DIR}/lib/cmake/llvm" \
            -DENABLE_INTEL_GPU=ON \
            -DENABLE_ONEDNN_FOR_GPU=ON \
            -DENABLE_TESTS=ON \
            -DENABLE_INTEL_CPU=OFF \
            -DENABLE_INTEL_NPU=OFF \
            -DENABLE_NCC_STYLE=OFF \
            -DENABLE_STRICT_DEPENDENCIES=OFF \
            -DENABLE_SYSTEM_OPENCL=ON \
            -DCPACK_GENERATOR=TGZ \
            -DCMAKE_VERBOSE_MAKEFILE=ON

      - name: CMake build - OpenVINO
        run: cmake --build "${BUILD_DIR}" --parallel $(nproc) --config ${CMAKE_BUILD_TYPE} -- --quiet

      - name: Show sccache stats
        run: ${SCCACHE_PATH} --show-stats

      - name: CMake install - OpenVINO
        run: |
          cmake --install "${BUILD_DIR}" --config ${CMAKE_BUILD_TYPE} --prefix "${INSTALL_DIR}"
          cmake --install "${BUILD_DIR}" --config ${CMAKE_BUILD_TYPE} --prefix "${INSTALL_TEST_DIR}" --component tests

      - name: Pack openvino_package
        run: tar -cf - * | pigz > "${BUILD_DIR}/openvino_package.tar.gz"
        working-directory: ${{ env.INSTALL_DIR }}

      - name: Pack openvino_tests
        run: tar -cf - * | pigz > "${BUILD_DIR}/openvino_tests.tar.gz"
        working-directory: ${{ env.INSTALL_TEST_DIR }}

      - name: Upload openvino package
        uses: ababushk/upload-artifact@ebc7d74ace101c08868aed05dba2aaf274b9a2c7 # main
        with:
          name: openvino_package
          path: ${{ env.BUILD_DIR }}/openvino_package.tar.gz
          if-no-files-found: 'error'

      - name: Upload openvino tests package
        uses: ababushk/upload-artifact@ebc7d74ace101c08868aed05dba2aaf274b9a2c7 # main
        with:
          name: openvino_tests
          path: ${{ env.BUILD_DIR }}/openvino_tests.tar.gz
          if-no-files-found: 'error'

      - name: Upload sccache log
        if: ${{ always() }}
        uses: ababushk/upload-artifact@ebc7d74ace101c08868aed05dba2aaf274b9a2c7 # main
        with:
          name: sccache_log
          path: ${{ env.SCCACHE_ERROR_LOG }}
          if-no-files-found: 'ignore'

  # DGPU unit tests hang in CI (including nightly runs on the master branch):
  # https://github.com/openvinotoolkit/openvino/actions/runs/30676046145/job/91306500336
  # Therefore 'all-tests' run hangs in MLIR-CI as well, disabling this job for now.
  #
  # MLIR disabled mode: a Graph-Compiler-enabled build must behave exactly like a stock GPU
  # build when the feature is off. `OV_GPU_ENABLE_MLIR` defaults to 0, so the stock GPU
  # test job is reused as is.
  # MLIR_Disabled_Unit:
  #   name: Arc B50 dGPU Unit Tests (MLIR disabled)
  #   needs: [ Build, Docker, Smart_CI ]
  #   if: fromJSON(needs.smart_ci.outputs.affected_components).GPU
  #   uses: ./.github/workflows/job_gpu_tests.yml
  #   with:
  #     device: 'dgpu'
  #     test_type: 'unit'
  #     runner: "[ 'self-hosted', 'dgpu', 'Arc-B50', 'Linux' ]"
  #     runner-group: 'Intel-GPU'
  #     image: ${{ fromJSON(needs.docker.outputs.images).ov_test.ubuntu_24_04_x64_dgpu }}
  #     options: "--group-add 44 --group-add 993 --device /dev/dri/renderD129:/dev/dri/renderD129"

  MLIR_Enabled:
    name: Arc B50 dGPU MLIR Tests (MLIR enabled)
    needs: [ Build, Docker, Smart_CI ]
    if: fromJSON(needs.smart_ci.outputs.affected_components).GPU
    timeout-minutes: 80
    defaults:
      run:
        shell: bash
    runs-on:
      group: 'Intel-GPU'
      labels: [ self-hosted, dgpu, Arc-B50, Linux ]
    container:
      image: ${{ fromJSON(needs.docker.outputs.images).ov_test.ubuntu_24_04_x64_dgpu }}
      volumes:
        - /usr/local/share/ca-certificates:/usr/local/share/ca-certificates:ro # Needed to access CA certificates
        - ${{ github.workspace }}:${{ github.workspace }} # Needed as ${{ github.workspace }} is not working correctly when using Docker
      options: "--group-add 44 --group-add 993 --device /dev/dri/renderD129:/dev/dri/renderD129"
    env:
      DEBIAN_FRONTEND: noninteractive # to prevent apt-get from waiting user input
      INSTALL_DIR: ${{ github.workspace }}/install
      INSTALL_TEST_DIR: ${{ github.workspace }}/install/tests
      NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/IntelProxyRootCA-Base64.crt
      TEST_RESULTS_DIR: ${{ github.workspace }}/install/tests/dgpu_mlir_tests
    steps:
      - name: Download OpenVINO artifacts (package)
        uses: akashchi/download-artifact@d59a9c15fec3fdb7c9adf09464124d00f9c11415 # main
        with:
          name: openvino_package
          path: ${{ env.INSTALL_DIR }}

      - name: Download OpenVINO artifacts (tests)
        uses: akashchi/download-artifact@d59a9c15fec3fdb7c9adf09464124d00f9c11415 # main
        with:
          name: openvino_tests
          path: ${{ env.INSTALL_DIR }}

      - name: Extract OpenVINO packages
        run: |
          pigz -dc openvino_package.tar.gz | tar -xf -
          pigz -dc openvino_tests.tar.gz | tar -xf -
        working-directory: ${{ env.INSTALL_DIR }}

      - name: Verify devices
        timeout-minutes: 5
        run: clinfo

      - name: OpenVINO GPU MLIR Tests
        run: |
          source "${INSTALL_DIR}/setupvars.sh"
          mkdir -p "${TEST_RESULTS_DIR}"

          export OV_GPU_ENABLE_MLIR=1
          func_tests="${INSTALL_TEST_DIR}/ov_gpu_func_tests"
          filter=$(printf '%s:' \
            '*ScaledAttnLayerGPUMlirTest*' \
            'mlir_*' \
          )
          filter="${filter%:}"

          # Guard against a filter typo silently reporting success
          tests=$("$func_tests" --gtest_list_tests --gtest_filter="$filter" \
            | awk '/^  /{print suite $1} /^[^ ]/{suite=$1}')
          [ -n "$tests" ] || { echo "No MLIR tests matched the filter"; exit 1; }

          start=$SECONDS
          "$func_tests" --gtest_filter="$filter" \
            | tee "${TEST_RESULTS_DIR}/ov_gpu_mlir_tests.log"
          echo "Ran $(echo "$tests" | wc -l) tests in $((SECONDS - start))s"

      - name: OpenVINO GPU MLIR partitioning patterns
        run: |
          echo "The test is temporarily skipped because it appears to be broken."
          # source "${INSTALL_DIR}/setupvars.sh"
          # export OV_GPU_ENABLE_MLIR=1
          # Both requested patterns must be matched and lowered into their own func.func,
          # twice each (static and dynamic instantiation of the test).
          # OV_MLIR_PATTERNS='mart=MatMul,Add,Reshape,Transpose;rms=Power,ReduceMean,Add,Sqrt,Divide' \
          #   OV_MLIR_DEBUG=1 "${INSTALL_TEST_DIR}/ov_gpu_func_tests" \
          #     --gtest_filter=mlir_MatMulRmsnormConcatTest* 2>&1 \
          #   | grep -E 'func.func @(mart|rms)' | wc -l | xargs test 4 -eq \
          #   || { echo "MLIR patterns test failed" && exit 1; }

      - name: Upload Test Results
        uses: ababushk/upload-artifact@ebc7d74ace101c08868aed05dba2aaf274b9a2c7 # main
        if: ${{ always() }}
        with:
          name: test-results-mlir-dgpu
          path: ${{ env.TEST_RESULTS_DIR }}
          if-no-files-found: 'ignore'

  Overall_Status:
    name: ci/gha_overall_status_dev_gpu_linux_mlir
    needs: [ Smart_CI, Docker, Build, MLIR_Disabled_Unit, MLIR_Enabled ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check status of all jobs
        if: >-
          ${{
            contains(needs.*.result, 'failure') ||
            contains(needs.*.result, 'cancelled')
          }}
        run: exit 1
