name: GGUF Frontend x llama.cpp validation

# The GGUF frontend is consumed directly by llama.cpp's ggml-openvino backend, which has its
# own, much stricter accuracy tolerance (test-backend-ops) than genai; this job is the only
# place that exercises that path, against the frontend already built by this workflow's own
# Build job -- no separate OpenVINO build needed here.
on:
  workflow_call:
    inputs:
      runner:
        description: 'Machine on which the job would run'
        type: string
        required: true
      image:
        description: 'Docker image to use for the job'
        type: string
        required: false
        default: null
      cmake-build-parallel-level:
        description: 'Number of threads for parallel build (hard-coded; nproc and NUMBER_OF_PROCESSORS do not respect container CPU limits)'
        type: string
        required: true

permissions: read-all

env:
  # mvafin/llama.cpp@ov-frontend-swap-llamacpp-sync, pinned to the commit that carries the
  # ggml-openvino decoder/backend fixes this frontend snapshot requires. Bump alongside any
  # GGUF-frontend change that needs a matching llama.cpp-side update.
  LLAMA_CPP_REPO: mvafin/llama.cpp
  LLAMA_CPP_REF: 3d677aadec0487430ad59bd3d4a9fc7211721f0f
  INSTALL_DIR: ${{ github.workspace }}/install
  SCCACHE_DIR: ${{ github.workspace }}/.sccache

jobs:
  GGUF_LlamaCpp_Validation:
    name: Build llama.cpp and run its tests against the GGUF frontend
    timeout-minutes: 60
    runs-on: ${{ inputs.runner }}
    container:
      image: ${{ inputs.image }}
      volumes:
        - /mount:/mount
        - ${{ github.workspace }}:${{ github.workspace }} # Needed as ${{ github.workspace }} is not working correctly when using Docker
    defaults:
      run:
        shell: bash
    env:
      # Hard-coded at workflow call site; nproc and NUMBER_OF_PROCESSORS do not respect Kubernetes pod CPU limits.
      # Nested cmake --build (e.g. intel_gpu onednn_gpu ExternalProject) does not inherit --parallel from the top-level build.
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ inputs.cmake-build-parallel-level }}
    steps:
      - name: Download OpenVINO package
        uses: akashchi/download-artifact@d59a9c15fec3fdb7c9adf09464124d00f9c11415 # main
        with:
          name: openvino_package
          path: ${{ env.INSTALL_DIR }}

      - name: Extract OpenVINO package
        run: pigz -dc openvino_package.tar.gz | tar -xf - -v
        working-directory: ${{ env.INSTALL_DIR }}

      - name: Cache sccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: gguf-llamacpp-sccache-${{ runner.os }}-${{ github.base_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            gguf-llamacpp-sccache-${{ runner.os }}-${{ github.base_ref || github.ref_name }}-
            gguf-llamacpp-sccache-${{ runner.os }}-

      - name: Checkout llama.cpp
        uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b # cherry_pick_retries
        timeout-minutes: 15
        with:
          repository: ${{ env.LLAMA_CPP_REPO }}
          ref: ${{ env.LLAMA_CPP_REF }}
          path: llama.cpp

      - name: Configure llama.cpp against the OpenVINO package
        run: |
          source ${{ env.INSTALL_DIR }}/setupvars.sh
          cmake -G Ninja -S llama.cpp -B llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DGGML_OPENVINO=ON

      - name: Build llama.cpp
        run: cmake --build llama.cpp/build --parallel ${CMAKE_BUILD_PARALLEL_LEVEL}

      - name: Show sccache stats
        run: sccache --show-stats

      - name: Run llama.cpp tests against the ggml-openvino backend
        env:
          # The production Q4_K path requantizes weights to OpenVINO u4 and is necessarily lossy.
          # llama.cpp's test-backend-ops uses a strict f32-oracle tolerance, so validate the
          # frontend's faithful Q4_K decode path here. The requantized path has dedicated tests.
          OV_GGUF_Q4_K_ZP_F16: "1"
        run: |
          source ${{ env.INSTALL_DIR }}/setupvars.sh
          # Keep the operator suite enabled. The pinned llama.cpp revision also labels its
          # all-architecture state suite and multi-sequence recurrent rollback tests as main.
          # Those exercise unsupported backend layouts (Qwen3.5 multi-sequence replay,
          # Nemotron-H packed SSM state, and DeepSeek V4); validate supported state paths below.
          ctest --test-dir llama.cpp/build -L main \
            -E '^test-(opt|llama-archs|recurrent-state-rollback(-nemotron-h|-dsv4)?|save-load-state)$' \
            --output-on-failure --timeout 2000

      - name: Validate state save/load on supported llama.cpp models
        env:
          OV_GGUF_Q4_K_ZP_F16: "1"
        run: |
          source ${{ env.INSTALL_DIR }}/setupvars.sh
          # Generated by test-generate-models above. Run every state scenario in single-model
          # mode instead of sweeping architectures the ggml-openvino backend cannot execute.
          for model in llama-dense qwen2-dense qwen3-dense; do
            timeout 2000 llama.cpp/build/bin/test-save-load-state \
              -m "llama.cpp/build/tests/test-models/${model}.gguf"
          done
