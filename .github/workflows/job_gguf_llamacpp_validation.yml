name: GGUF Frontend x llama.cpp validation

# Exercise the ggml-openvino backend against the OpenVINO package built by this workflow.
on:
  workflow_call:
    inputs:
      runner:
        description: 'Machine on which the job would run'
        type: string
        required: true
      image:
        description: 'Docker image to use for the job'
        type: string
        required: false
        default: null
      cmake-build-parallel-level:
        description: 'Number of threads for parallel build (hard-coded; nproc and NUMBER_OF_PROCESSORS do not respect container CPU limits)'
        type: string
        required: true

permissions: read-all

env:
  # mvafin/llama.cpp@ov-pr342-rebased, the head of ravi9/llama.cpp#399 (ravi9/llama.cpp#342 rebased).
  LLAMA_CPP_REPO: mvafin/llama.cpp
  LLAMA_CPP_REF: 980e0a21d070b3af4cf1fac713e854245facd216
  LLAMA_CPP_DIR: ${{ github.workspace }}/llama.cpp
  LLAMA_CPP_BUILD_DIR: ${{ github.workspace }}/llama.cpp/build
  LLAMA_MODEL_DIR: ${{ github.workspace }}/llama.cpp/build/gguf-test-models
  OPENVINO_SOURCE_DIR: ${{ github.workspace }}/openvino-src
  INSTALL_DIR: ${{ github.workspace }}/install
  SCCACHE_DIR: ${{ github.workspace }}/.sccache

jobs:
  GGUF_LlamaCpp_Validation:
    name: Build llama.cpp and run its tests against the GGUF frontend
    timeout-minutes: 60
    runs-on: ${{ inputs.runner }}
    container:
      image: ${{ inputs.image }}
      volumes:
        - /mount:/mount
        - ${{ github.workspace }}:${{ github.workspace }} # Needed as ${{ github.workspace }} is not working correctly when using Docker
    defaults:
      run:
        shell: bash
    env:
      # Hard-coded at workflow call site; nproc and NUMBER_OF_PROCESSORS do not respect Kubernetes pod CPU limits.
      # Nested cmake --build (e.g. intel_gpu onednn_gpu ExternalProject) does not inherit --parallel from the top-level build.
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ inputs.cmake-build-parallel-level }}
      GGML_OPENVINO_DEVICE: CPU
      # Use the faithful Q4_K decode path for llama.cpp's strict f32-oracle comparisons.
      OV_GGUF_Q4_K_ZP_F16: "1"
    steps:
      - name: Checkout OpenVINO
        uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b # cherry_pick_retries
        with:
          path: openvino-src

      - name: Download OpenVINO package
        uses: akashchi/download-artifact@d59a9c15fec3fdb7c9adf09464124d00f9c11415 # main
        with:
          name: openvino_package
          path: ${{ env.INSTALL_DIR }}

      - name: Extract OpenVINO package
        run: pigz -dc openvino_package.tar.gz | tar -xf - -v
        working-directory: ${{ env.INSTALL_DIR }}

      - name: Cache sccache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.SCCACHE_DIR }}
          key: gguf-llamacpp-sccache-${{ runner.os }}-${{ github.base_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            gguf-llamacpp-sccache-${{ runner.os }}-${{ github.base_ref || github.ref_name }}-
            gguf-llamacpp-sccache-${{ runner.os }}-

      - name: Checkout llama.cpp
        uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b # cherry_pick_retries
        timeout-minutes: 15
        with:
          repository: ${{ env.LLAMA_CPP_REPO }}
          ref: ${{ env.LLAMA_CPP_REF }}
          path: llama.cpp

      - name: Configure llama.cpp against the OpenVINO package
        run: |
          source "${INSTALL_DIR}/setupvars.sh"
          cmake -G Ninja -S "${LLAMA_CPP_DIR}" -B "${LLAMA_CPP_BUILD_DIR}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=sccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache \
            -DGGML_OPENVINO=ON \
            -DLLAMA_BUILD_TESTS=ON

      - name: Build llama.cpp
        run: cmake --build "${LLAMA_CPP_BUILD_DIR}" --parallel "${CMAKE_BUILD_PARALLEL_LEVEL}"

      - name: Show sccache stats
        run: sccache --show-stats

      - name: Verify the packaged GGUF frontend is linked
        run: |
          source "${INSTALL_DIR}/setupvars.sh"
          linked_frontend=$(ldd "${LLAMA_CPP_BUILD_DIR}/bin/libggml-openvino.so" |
            awk '$1 ~ /^libopenvino_gguf_frontend/ {print $3}')
          test -n "${linked_frontend}"
          test "$(realpath "${linked_frontend}")" = \
            "$(realpath "${INSTALL_DIR}/runtime/lib/intel64/libopenvino_gguf_frontend.so")"
          echo "Linked GGUF frontend: ${linked_frontend}"

      - name: Run portable llama.cpp tests
        run: |
          source "${INSTALL_DIR}/setupvars.sh"
          ctest --test-dir "${LLAMA_CPP_BUILD_DIR}" --no-tests=error \
            -R '^test-(generate-models|tiled-mulmat|barrier|quantize-fns|quantize-perf|rope|col2im-1d)$' \
            --output-on-failure --timeout 300

      - name: Compare selected backend operators with ggml CPU
        run: |
          source "${INSTALL_DIR}/setupvars.sh"
          run_backend_test() {
            local op="$1" filter="$2" log="${RUNNER_TEMP}/gguf-backend-${1}.log"
            timeout 300 "${LLAMA_CPP_BUILD_DIR}/bin/test-backend-ops" test \
              -b OPENVINO0 -o "${op}" -p "${filter}" | tee "${log}"
            grep -Fq 'GGML_OPENVINO_DEVICE=CPU (selected)' "${log}"
            grep -Eq '^  [1-9][0-9]*/[1-9][0-9]* tests passed$' "${log}"
          }
          run_backend_test ADD \
            '^type=f32,ne=.*nr=\[1,1,1,1\],nf=1,perm1=0,src_overlap=0$'
          run_backend_test MUL_MAT \
            '^type_a=(f32|f16|q4_0|q4_K),type_b=f32,m=16,n=(1|2|4),k=256,bs=\[1,1\],nr=\[1,1\],per=\[0,1,2,3\],k_v=0,o=1,src_overlap=0,m_v=0,pad=0$'
          run_backend_test SOFT_MAX \
            '^type=f32,ne=\[16,16,1,1\],mask=(0|1),sinks=0,m_prec=f(16|32),nr23=\[1,1\],scale=(0\.100000|1\.000000),max_bias=(0\.000000|8\.000000),inplace=0$'
          run_backend_test ROPE \
            '^type=f32,ne_a=\[(128,32|64,8),2,1\],n_dims=(128|64),mode=(0|2),n_ctx=512,fs=1\.000000,ef=0\.000000,af=1\.000000,ff=0,v=0,inplace=0,n_offs=0(,.*)?$'

      - name: Generate deterministic llama.cpp models
        run: |
          source "${INSTALL_DIR}/setupvars.sh"
          mkdir -p "${LLAMA_MODEL_DIR}"
          "${LLAMA_CPP_BUILD_DIR}/bin/test-llama-archs" \
            -a '^(llama|qwen2|qwen3)$' -s 1234 -o "${LLAMA_MODEL_DIR}"
          for model in llama qwen2 qwen3; do
            test -s "${LLAMA_MODEL_DIR}/${model}-dense.gguf"
          done

      - name: Run llama.cpp thread-safety test
        run: |
          source "${INSTALL_DIR}/setupvars.sh"
          log="${RUNNER_TEMP}/gguf-thread-safety.log"
          timeout 300 "${LLAMA_CPP_BUILD_DIR}/bin/test-thread-safety" \
            -m "${LLAMA_MODEL_DIR}/llama-dense.gguf" -dev OPENVINO0 -ngl all \
            -p 'The meaning of life is' -n 16 -c 256 -ub 32 -np 4 -t 2 2>&1 | tee "${log}"
          grep -Eq 'Creating context [0-9]+/4 for model 1/3' "${log}"
          grep -Fq 'All threads finished without errors.' "${log}"

      - name: Build llama.cpp model integration test
        run: |
          source "${INSTALL_DIR}/setupvars.sh"
          g++ -std=c++17 -O2 -Wall -Wextra -Werror \
            -I "${LLAMA_CPP_DIR}/include" -I "${LLAMA_CPP_DIR}/ggml/include" \
            -isystem "${INSTALL_DIR}/runtime/include" \
            "${OPENVINO_SOURCE_DIR}/src/frontends/gguf/tests/llamacpp_integration.cpp" \
            -L "${LLAMA_CPP_BUILD_DIR}/bin" -L "${INSTALL_DIR}/runtime/lib/intel64" \
            -Wl,-rpath,"${LLAMA_CPP_BUILD_DIR}/bin" -Wl,-rpath,"${INSTALL_DIR}/runtime/lib/intel64" \
            -lggml-openvino -lllama -lggml -lggml-base -lopenvino \
            -o "${LLAMA_CPP_BUILD_DIR}/bin/gguf-llamacpp-integration"

      - name: Compare model logits and restored state
        run: |
          source "${INSTALL_DIR}/setupvars.sh"
          for model in llama qwen2 qwen3; do
            for attention in flash noflash; do
              for first_seq in 0 1; do
                echo "Testing ${model}, ${attention}, first sequence ${first_seq}"
                timeout 300 "${LLAMA_CPP_BUILD_DIR}/bin/gguf-llamacpp-integration" \
                  "${LLAMA_MODEL_DIR}/${model}-dense.gguf" "${attention}" "${first_seq}"
              done
            done
          done
