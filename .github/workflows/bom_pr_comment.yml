name: BOM PR comments

on:
  workflow_run:
    workflows:
      - 'Linux ARM64 (Ubuntu 22.04, Python 3.11)'
      - 'macOS ARM64 (mac-15, Python 3.11)'
      - 'Manylinux 2_28'
      - 'Linux (Ubuntu 22.04, Python 3.11)'
      - 'Linux (Ubuntu 22.04, ARM64 cross-compilation, Python 3.11)'
      - 'Linux (Ubuntu 24.04, Python 3.12)'
      - 'Linux (Ubuntu 26.04, Python 3.14)'
      - 'Windows (VS 2022, Python 3.11, Debug)'
      - 'Windows (VS 2022, Python 3.11, Release)'
      - 'Windows (VS 2026, Python 3.11, Release)'
    types: [completed]

permissions: {}

# Serialize updates, including reruns, without cancelling a comment being written.
concurrency:
  group: bom-pr-comment-${{ github.event.workflow_run.workflow_id }}-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: write
    steps:
      # workflow_run and this checkout use trusted default-branch code, never PR code.
      # This notifier starts working only after it is merged to the default branch.
      - name: Checkout trusted notifier
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts/bom_comments

      - name: Update platform BOM comment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const notify = require('./.github/scripts/bom_comments/comment.js');
            await notify({github, context, core});
