name: GPU

on:
  workflow_call:
    inputs:
      test_type:
        description: 'Type of tests to execute (unit or func)'
        type: string
        required: true
      device:
        description: 'Device name (igpu or dgpu)'
        type: string
        required: true
      runner:
        description: 'Runner labels by which the runner will be chosen. Example: [ "self-hosted", "igpu" ]'
        type: string
        required: true
      runner-group:
        description: 'Runner group from which the runner will be chosen'
        type: string
        required: true
      image:
        description: 'Docker image in which the tests would run'
        type: string
        required: false
        default: null
      options:
        description: 'Docker options to use for the job'
        type: string
        required: false
        default: ''
      test_filter:
        description: 'Custom gtest filter, overrides the default unit/func filter'
        type: string
        required: false
        default: ''

permissions: read-all

jobs:
  GPU:
    timeout-minutes: 80
    runs-on:
      group: ${{ inputs.runner-group }}
      labels: ${{ fromJSON(inputs.runner) }}
    container:
      image: ${{ inputs.image }}
      volumes:
        - /usr/local/share/ca-certificates:/usr/local/share/ca-certificates:ro # Needed to access CA certificates
        - ${{ github.workspace }}:${{ github.workspace }} # Needed as ${{ github.workspace }} is not working correctly when using Docker
        - /opt/home/actions_runner/.cache/neo_compiler_cache:/root/.cache/neo_compiler_cache # Persistent cl_cache across runs
      options: ${{ inputs.options }}
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive # to prevent apt-get from waiting user input
      INSTALL_DIR: ${{ github.workspace }}/install
      INSTALL_TEST_DIR: ${{ github.workspace }}/install/tests
      BUILD_DIR: ${{ github.workspace }}/build
      MODELS_PATH: ${{ github.workspace }}/testdata
      PARALLEL_TEST_SCRIPT: ${{ github.workspace }}/install/tests/functional_test_utils/layer_tests_summary/run_parallel.py
      PARALLEL_TEST_CACHE: ${{ github.workspace }}/install/tests/test_cache_gpu_${{ inputs.test_type }}_${{ inputs.device }}.lst
      NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/IntelProxyRootCA-Base64.crt
      NEO_CACHE_DIR: /root/.cache/neo_compiler_cache 
      NEO_CACHE_MAX_SIZE: 10737418240 # 10GB
    steps:

      - name: Validate test type
        if: ${{ inputs.test_type != 'unit' && inputs.test_type != 'func' }}
        run: |
          echo "::error::Unsupported GPU test type"
          exit 1

      - name: Download OpenVINO artifacts (package)
        uses: akashchi/download-artifact@d59a9c15fec3fdb7c9adf09464124d00f9c11415 # main
        with:
          name: openvino_package
          path: ${{ env.INSTALL_DIR }}
      
      - name: Download OpenVINO artifacts (tests)
        uses: akashchi/download-artifact@d59a9c15fec3fdb7c9adf09464124d00f9c11415 # main
        with:
          name: openvino_tests
          path: ${{ env.INSTALL_DIR }}

      - name: Extract OpenVINO packages
        run: |
            pigz -dc openvino_package.tar.gz | tar -xf - -v
            pigz -dc openvino_tests.tar.gz | tar -xf - -v
        working-directory: ${{ env.INSTALL_DIR }}

      - name: Verify devices
        timeout-minutes: 5
        run: clinfo

      #
      # Samples
      #

      # Samples are built in the Build job and reused from openvino_package
      # git and pip use the system CA bundle, so add the proxy root CA (mounted at
      # /usr/local/share/ca-certificates) to it before accessing HTTPS endpoints,
      # otherwise they fail with certificate verification errors.
      - name: Add proxy CA certificate to system trust store
        run: update-ca-certificates

      - name: Clone test models
        if: ${{ inputs.test_type == 'unit' }}
        uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b # cherry_pick_retries
        timeout-minutes: 15
        with:
          repository: 'openvinotoolkit/testdata'
          path: ${{ env.MODELS_PATH }}
          lfs: 'true'
          ref: ${{ github.base_ref || github.event.merge_group.base_ref || github.ref_name }}

      - name: Run hello_query_device sample
        if: ${{ inputs.test_type == 'unit' }}
        run: |
          source ${INSTALL_DIR}/setupvars.sh
          $INSTALL_DIR/samples_bin/hello_query_device
      
      - name: Run benchmark_app sample
        if: ${{ inputs.test_type == 'unit' }}
        run: |
          source ${INSTALL_DIR}/setupvars.sh
          $INSTALL_DIR/samples_bin/benchmark_app -niter 1 -nireq 1 -m ${MODELS_PATH}/models/test_model/test_model_fp32.xml -d GPU

      #
      # Tests
      #

      - name: Install python dependencies for run_parallel.py
        env:
          # System bundle includes the proxy root CA added by update-ca-certificates above
          PIP_CERT: /etc/ssl/certs/ca-certificates.crt
        run: python3 -m pip install -r ${INSTALL_TEST_DIR}/functional_test_utils/layer_tests_summary/requirements.txt

      - name: Test parallel runner filters
        run: |
          python3 -m unittest discover -s ${INSTALL_TEST_DIR}/functional_test_utils/layer_tests_summary -p test_run_parallel.py
          python3 -m unittest discover -s ${INSTALL_TEST_DIR}/functional_test_utils/layer_tests_summary/tests -p test_run_parallel_filters.py

      - name: Restore tests execution time
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.PARALLEL_TEST_CACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-tests-gpu-${{ inputs.test_type }}-${{ inputs.device }}-stamp-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-tests-gpu-${{ inputs.test_type }}-${{ inputs.device }}-stamp

      - name: OpenVINO GPU unit Tests
        id: run_unit_tests
        if: ${{ inputs.test_type == 'unit' }}
        env:
          DEVICE: ${{ inputs.device }}
          CUSTOM_TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          source ${INSTALL_DIR}/setupvars.sh
          TEST_RESULTS_DIR="${DEVICE}"_unit_tests
          echo "test_results_dir=$TEST_RESULTS_DIR" >> $GITHUB_OUTPUT

          rm -rf ${INSTALL_TEST_DIR}/${TEST_RESULTS_DIR} && mkdir -p ${INSTALL_TEST_DIR}/${TEST_RESULTS_DIR}

          if [[ -n "${CUSTOM_TEST_FILTER}" ]]; then
            test_filter="${CUSTOM_TEST_FILTER}"
          else
            test_filter='-*scatter_nd_update_gpu.dynamic_padded_output*:*border_gpu.basic_zero_input*:*bicubic_zeros_no_align_data1x1*:*bicubic_border_align_batches*:*bilinear_zeros_no_align_data1x1*:*non_zero_gpu.empty_input*:*mark_shape_of_subgraphs.concat_with_empty_tensor_inputs*:*concat_cpu_impl.dynamic_4d_f*:*border_gpu.basic_zero_input_dynamic*:*network_test.model_with_empty_input_is_not_dynamic*:*bicubic_zeros_align_data1x1*'
          fi
          # An existing (even empty) cache file makes run_parallel.py save timings to this path
          touch "${PARALLEL_TEST_CACHE}"
          python3 ${PARALLEL_TEST_SCRIPT} -e ${INSTALL_TEST_DIR}/ov_gpu_unit_tests -c "${PARALLEL_TEST_CACHE}" -w ${INSTALL_TEST_DIR}/${TEST_RESULTS_DIR} -s suite -rf 1 -- --gtest_print_time=1 --report_unique_name "--gtest_filter=${test_filter}"

      - name: OpenVINO GPU func Tests (parallel)
        if: ${{ inputs.test_type == 'func' }}
        env:
          CUSTOM_TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          source ${INSTALL_DIR}/setupvars.sh

          test_filter='*smoke*'
          if [[ -n "${CUSTOM_TEST_FILTER}" ]]; then
            test_filter="${CUSTOM_TEST_FILTER}"
          fi
          touch "${PARALLEL_TEST_CACHE}"
          python3 "${PARALLEL_TEST_SCRIPT}" -e "${INSTALL_TEST_DIR}/ov_gpu_func_tests" -c "${PARALLEL_TEST_CACHE}" -w "${INSTALL_TEST_DIR}" -s suite -rf 0 -- --gtest_print_time=1 "--gtest_filter=${test_filter}"

      - name: Save tests execution time
        if: ${{ github.ref_name == 'master' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.PARALLEL_TEST_CACHE }}
          key: ${{ runner.os }}-${{ runner.arch }}-tests-gpu-${{ inputs.test_type }}-${{ inputs.device }}-stamp-${{ github.sha }}

      - name: Upload Test Results
        uses: ababushk/upload-artifact@ebc7d74ace101c08868aed05dba2aaf274b9a2c7 # main
        if: ${{ always() && inputs.test_type == 'unit' }}
        with:
          name: test-results-${{ inputs.test_type }}-${{ inputs.device }}
          path: ${{ env.INSTALL_TEST_DIR }}/${{ steps.run_unit_tests.outputs.test_results_dir }}
          if-no-files-found: 'error'

      - name: Upload Test Results
        uses: ababushk/upload-artifact@ebc7d74ace101c08868aed05dba2aaf274b9a2c7 # main
        if: ${{ always() && inputs.test_type == 'func' }}
        with:
          name: test-results-${{ inputs.test_type }}-${{ inputs.device }}
          path: |
            ${{ env.INSTALL_TEST_DIR }}/temp/*.log
            ${{ env.INSTALL_TEST_DIR }}/logs/*.log
            ${{ env.INSTALL_TEST_DIR }}/logs/failed/*.log
            ${{ env.INSTALL_TEST_DIR }}/logs/crashed/*.log
            ${{ env.INSTALL_TEST_DIR }}/logs/hanged/*.log
            ${{ env.INSTALL_TEST_DIR }}/logs/interapted/*.log
            ${{ env.INSTALL_TEST_DIR }}/logs/hash_table.csv
            ${{ env.PARALLEL_TEST_CACHE }}
          if-no-files-found: 'error'
