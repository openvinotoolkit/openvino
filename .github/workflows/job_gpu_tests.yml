name: GPU

on:
  workflow_call:
    inputs:
      test_type:
        description: 'Type of tests to execute'
        type: string
        required: true
      device:
        description: 'Device name (igpu or dgpu)'
        type: string
        required: true
      runner:
        description: 'Runner labels by which the runner will be chosen. Example: [ "self-hosted", "igpu" ]'
        type: string
        required: true
      runner-group:
        description: 'Runner group from which the runner will be chosen'
        type: string
        required: true
      image:
        description: 'Docker image in which the tests would run'
        type: string
        required: false
        default: null
      options:
        description: 'Docker options to use for the job'
        type: string
        required: false
        default: ''
      test_filter:
        description: 'Custom gtest filter, overrides the default unit/func filter'
        type: string
        required: false
        default: ''
      shard_index:
        description: 'GTest shard index'
        type: number
        required: false
        default: 0
      total_shards:
        description: 'Total number of GTest shards'
        type: number
        required: false
        default: 1

permissions: read-all

jobs:
  GPU:
    timeout-minutes: 80
    runs-on:
      group: ${{ inputs.runner-group }}
      labels: ${{ fromJSON(inputs.runner) }}
    container:
      image: ${{ inputs.image }}
      volumes:
        - /usr/local/share/ca-certificates:/usr/local/share/ca-certificates:ro # Needed to access CA certificates
        - ${{ github.workspace }}:${{ github.workspace }} # Needed as ${{ github.workspace }} is not working correctly when using Docker
        - /opt/home/actions_runner/.cache/neo_compiler_cache:/root/.cache/neo_compiler_cache # Persistent cl_cache across runs
      options: ${{ inputs.options }}
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive # to prevent apt-get from waiting user input
      INSTALL_DIR: ${{ github.workspace }}/install
      INSTALL_TEST_DIR: ${{ github.workspace }}/install/tests
      BUILD_DIR: ${{ github.workspace }}/build
      MODELS_PATH: ${{ github.workspace }}/testdata
      NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/IntelProxyRootCA-Base64.crt
      NEO_CACHE_DIR: /root/.cache/neo_compiler_cache 
      NEO_CACHE_MAX_SIZE: 10737418240 # 10GB
    steps:

      - name: Download OpenVINO artifacts (package)
        uses: akashchi/download-artifact@d59a9c15fec3fdb7c9adf09464124d00f9c11415 # main
        with:
          name: openvino_package
          path: ${{ env.INSTALL_DIR }}
      
      - name: Download OpenVINO artifacts (tests)
        uses: akashchi/download-artifact@d59a9c15fec3fdb7c9adf09464124d00f9c11415 # main
        with:
          name: openvino_tests
          path: ${{ env.INSTALL_DIR }}

      - name: Extract OpenVINO packages
        run: |
            pigz -dc openvino_package.tar.gz | tar -xf - -v
            pigz -dc openvino_tests.tar.gz | tar -xf - -v
        working-directory: ${{ env.INSTALL_DIR }}

      - name: Install python dependencies for run_parallel.py
        run: python3 -m pip install -r ${INSTALL_TEST_DIR}/functional_test_utils/layer_tests_summary/requirements.txt

      - name: Verify devices
        timeout-minutes: 5
        run: clinfo

      #
      # Samples
      #

      # Samples are built in the Build job and reused from openvino_package
      # git uses the system CA bundle, so add the proxy root CA (mounted at
      # /usr/local/share/ca-certificates) to it before cloning over HTTPS,
      # otherwise git fails with "server certificate verification failed".
      - name: Add proxy CA certificate to system trust store
        if: ${{ inputs.test_type == 'unit' }}
        run: update-ca-certificates

      - name: Clone test models
        if: ${{ inputs.test_type == 'unit' }}
        uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b # cherry_pick_retries
        timeout-minutes: 15
        with:
          repository: 'openvinotoolkit/testdata'
          path: ${{ env.MODELS_PATH }}
          lfs: 'true'
          ref: ${{ github.base_ref || github.event.merge_group.base_ref || github.ref_name }}

      - name: Run hello_query_device sample
        if: ${{ inputs.test_type == 'unit' }}
        run: |
          source ${INSTALL_DIR}/setupvars.sh
          $INSTALL_DIR/samples_bin/hello_query_device
      
      - name: Run benchmark_app sample
        if: ${{ inputs.test_type == 'unit' }}
        run: |
          source ${INSTALL_DIR}/setupvars.sh
          $INSTALL_DIR/samples_bin/benchmark_app -niter 1 -nireq 1 -m ${MODELS_PATH}/models/test_model/test_model_fp32.xml -d GPU

      #
      # Tests
      #

      - name: OpenVINO GPU ${{ inputs.test_type }} Tests
        id: run_tests
        env:
          TEST_TYPE: ${{ inputs.test_type }}
          DEVICE: ${{ inputs.device }}
          CUSTOM_TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          source ${INSTALL_DIR}/setupvars.sh
          TEST_RESULTS_DIR="${DEVICE}"_"${TEST_TYPE}"_tests
          echo "test_results_dir=$TEST_RESULTS_DIR" >> $GITHUB_OUTPUT

          rm -rf ${INSTALL_TEST_DIR}/${TEST_RESULTS_DIR} && mkdir -p ${INSTALL_TEST_DIR}/${TEST_RESULTS_DIR}

          test_filter=''
          if [[ -n "${CUSTOM_TEST_FILTER}" ]]; then
            test_filter="${CUSTOM_TEST_FILTER}"
          elif [[ "${TEST_TYPE}" == 'unit' ]]; then
            test_filter='-*scatter_nd_update_gpu.dynamic_padded_output*:*border_gpu.basic_zero_input*:*bicubic_zeros_no_align_data1x1*:*bicubic_border_align_batches*:*bilinear_zeros_no_align_data1x1*:*non_zero_gpu.empty_input*:*mark_shape_of_subgraphs.concat_with_empty_tensor_inputs*:*concat_cpu_impl.dynamic_4d_f*:*border_gpu.basic_zero_input_dynamic*:*network_test.model_with_empty_input_is_not_dynamic*:*bicubic_zeros_align_data1x1*:*scatter_elements_update*'
          else
            test_filter='*smoke*'
          fi

          if [[ "${TEST_TYPE}" == 'unit' ]]; then
            log="shard_${{ inputs.shard_index }}_$(date +%Y%m%d_%H%M%S).log"
            set +e
            /usr/bin/time -v env \
              GTEST_TOTAL_SHARDS=${{ inputs.total_shards }} \
              GTEST_SHARD_INDEX=${{ inputs.shard_index }} \
              LD_PRELOAD=/lib/x86_64-linux-gnu/libze_loader.so.1 \
              LD_LIBRARY_PATH="$PWD:/opt/home/sys_ovwindev/openvino/temp/Linux_x86_64/tbb/lib" \
              ${INSTALL_TEST_DIR}/ov_gpu_"${TEST_TYPE}"_tests \
                --report_unique_name \
                --gtest_print_time=1 \
                --gtest_filter="${test_filter}" \
              2>&1 | tee "$log"
            test_status=${PIPESTATUS[0]}
            set -e

            echo
            echo "Res:"
            grep -E '^\[==========\]|^\[  PASSED|^\[  FAILED|Elapsed \(wall clock\)|Maximum resident set size|User time|System time' "$log" || true
            echo "Log: $PWD/$log"
            exit "$test_status"
          fi

          ${INSTALL_TEST_DIR}/ov_gpu_"${TEST_TYPE}"_tests --report_unique_name --gtest_filter="${test_filter}"

      - name: Upload Test Results
        uses: ababushk/upload-artifact@ebc7d74ace101c08868aed05dba2aaf274b9a2c7 # main
        if: always()
        with:
          name: test-results-${{ inputs.test_type }}-${{ inputs.device }}
          path: ${{ env.INSTALL_TEST_DIR }}/${{ steps.run_tests.outputs.test_results_dir }}
          if-no-files-found: 'error'
