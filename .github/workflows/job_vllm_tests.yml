name: vLLM tests

on:
  workflow_call:
    inputs:
      runner:
        description: 'Machine on which the tests would run'
        type: string
        required: true
      image:
        description: 'Docker image to use for the job'
        type: string
        required: false
        default: null
      affected-components:
        description: 'Components that are affected by changes in the commit defined by the Smart CI Action'
        type: string
        required: true
      python-version:
        description: 'Python version to setup. E.g., "3.11"'
        type: string
        required: true

permissions: read-all

env:
  HF_HUB_CACHE_LIN: /mount/caches/huggingface
  HF_TOKEN_PATH_LIN: /secrets/huggingface/token-secondary

jobs:
  vLLM_Tests:
    name: vLLM tests
    timeout-minutes: 60
    runs-on: ${{ inputs.runner }}
    container:
      image: ${{ inputs.image }}
      # vLLM's CPU platform forces the multiproc executor (it rewrites
      # distributed_executor_backend="uni" to "mp"), whose ShmRingBuffer
      # needs 160 MiB of /dev/shm -- more than Docker's 64 MiB default.
      options: --shm-size=2g
      volumes:
        - /mount:/mount
        - /home/runner/secrets/:/secrets:ro
        - ${{ github.workspace }}:${{ github.workspace }} # Needed as ${{ github.workspace }} is not working correctly when using Docker
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive # to prevent apt-get from waiting user input
      INSTALL_DIR: ${{ github.workspace }}/install
      INSTALL_TEST_DIR: ${{ github.workspace }}/install/tests
      VLLM_TESTS_INSTALL_DIR: ${{ github.workspace }}/install/tests/vllm_tests
      USE_SYSTEM_CACHE: False # Using remote HuggingFace cache
      HF_HUB_VERBOSITY: debug
    steps:
      - name: Fetch setup_python and install wheels actions
        uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b # cherry_pick_retries
        timeout-minutes: 15
        with:
          sparse-checkout: |
            .github/actions
          sparse-checkout-cone-mode: false
          submodules: 'false'

      - name: Download OpenVINO artifacts (wheels)
        uses: akashchi/download-artifact@d59a9c15fec3fdb7c9adf09464124d00f9c11415 # main
        with:
          name: openvino_wheels
          path: ${{ env.INSTALL_DIR }}

      - name: Download OpenVINO artifacts (tests)
        uses: akashchi/download-artifact@d59a9c15fec3fdb7c9adf09464124d00f9c11415 # main
        with:
          name: openvino_tests
          path: ${{ env.INSTALL_DIR }}

      - name: Setup Variables
        run: |
          echo "HF_HUB_CACHE=${{ env.HF_HUB_CACHE_LIN }}" >> "$GITHUB_ENV"
          echo "HUGGINGFACE_HUB_CACHE=${{ env.HF_HUB_CACHE_LIN }}" >> "$GITHUB_ENV"
          echo "HF_TOKEN_PATH=${{ env.HF_TOKEN_PATH_LIN }}" >> "$GITHUB_ENV"

      - name: Extract OpenVINO artifacts
        run: pigz -dc openvino_tests.tar.gz | tar -xf - -v
        working-directory: ${{ env.INSTALL_DIR }}

      - name: Setup Python ${{ inputs.python-version }}
        uses: ./.github/actions/setup_python
        with:
          version: ${{ inputs.python-version }}
          set-pip-install-path: 'false'
          self-hosted-runner: ${{ contains(inputs.runner, 'aks') }}
          use-pip-proxy: ${{ contains(inputs.runner, 'aks') }}

      - name: Install OpenVINO Python wheels
        uses: ./.github/actions/install_ov_wheels
        with:
          wheels-dir-path: ${{ env.INSTALL_DIR }}
          wheels-to-install: 'openvino'

      - name: Install system dependencies for vllm-cpu
        if: ${{ fromJSON(inputs.affected-components).PyTorch_FE.test }}
        # Passed via env rather than interpolated into run: directly -- github
        # context data in a shell script is a script-injection vector.
        env:
          PYTHON_VERSION: ${{ inputs.python-version }}
        # libnuma1: vllm._C_AVX512 links against it, and cpu_worker calls
        # torch.ops._C.init_cpu_memory_env at startup, so a missing libnuma
        # fails the whole engine rather than degrading.
        # python*-dev: vLLM decorates its own CPU sampling helper
        # (v1/sample/ops/topk_topp_sampler.py::compiled_random_sample) with a
        # bare @torch.compile, which uses Inductor regardless of the OpenVINO
        # backend we select for the model. Inductor codegens a C++ extension,
        # so it needs Python.h at test time.
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libnuma1
          # Fall back to the unversioned package if this image's Python did not
          # come from a versioned apt package.
          apt-get install -y --no-install-recommends "python${PYTHON_VERSION}-dev" \
            || apt-get install -y --no-install-recommends python3-dev
          python3 -c 'import sysconfig, pathlib; p = pathlib.Path(sysconfig.get_path("include")) / "Python.h"; print(f"Python.h: {p} exists={p.exists()}")'

      - name: Install vLLM tests requirements
        if: ${{ fromJSON(inputs.affected-components).PyTorch_FE.test }}
        run: |
          python3 -m pip install -r ${VLLM_TESTS_INSTALL_DIR}/requirements.txt

      - name: vLLM Tests
        if: ${{ fromJSON(inputs.affected-components).PyTorch_FE.test }}
        run: |
          export PYTHONPATH=${VLLM_TESTS_INSTALL_DIR}:$PYTHONPATH
          python3 -m pytest ${VLLM_TESTS_INSTALL_DIR} -m precommit --html=${INSTALL_TEST_DIR}/TEST-vllm_tests.html --self-contained-html -v
        env:
          TEST_DEVICE: CPU
          # Allocate the KV pool lazily instead of zero-filling it up front.
          # Without this the suite OOM-kills the 32 GB runner, which surfaces as
          # "self-hosted runner lost communication with the server".
          OV_LAZY_KVCACHE: "1"

      - name: Upload Test Results
        uses: ababushk/upload-artifact@ebc7d74ace101c08868aed05dba2aaf274b9a2c7 # main
        if: ${{ !cancelled() }}
        with:
          name: test-results-vllm
          path: |
            ${{ env.INSTALL_TEST_DIR }}/TEST-vllm*
          if-no-files-found: 'warn'
