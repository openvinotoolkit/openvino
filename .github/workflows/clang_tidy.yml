name: Clang-tidy static analysis
on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  merge_group:
  push:
    branches:
      - master
      - 'releases/**'

concurrency:
  # github.ref is not unique in post-commit
  group: ${{ github.event_name == 'push' && github.run_id || github.ref }}-clang-tidy
  cancel-in-progress: true

permissions: read-all

env:
  RISCV_TOOLCHAIN_ROOT: /opt/riscv

jobs:
  Smart_CI:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.run_attempt > 1
    outputs:
      affected_components: "${{ steps.smart_ci.outputs.affected_components }}"
      changed_components: "${{ steps.smart_ci.outputs.changed_components }}"
      skip_workflow: "${{ steps.smart_ci.outputs.skip_workflow }}"
    steps:
      - name: checkout action
        uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b # cherry_pick_retries
        timeout-minutes: 15
        with:
          sparse-checkout: .github/actions/smart-ci

      - name: Get affected components
        id: smart_ci
        uses: ./.github/actions/smart-ci
        with:
          repository: ${{ github.repository }}
          pr: ${{ github.event.number }}
          commit_sha: ${{ github.sha }}
          ref_name: ${{ github.ref_name }}
          component_pattern: "category: (.*)"
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          skip_when_only_listed_labels_set: 'docs'
          skip_when_only_listed_files_changed: '*.md,*.rst,*.png,*.jpg,*.svg,*/layer_tests_summary/*,*/conformance/*'

      - name: Show affected components
        run: |
          echo "${{ toJSON(steps.smart_ci.outputs.affected_components) }}"
        shell: bash

  Docker:
    needs: Smart_CI
    runs-on: aks-linux-4-cores-16gb-docker-build
    container:
      image: openvinogithubactions.azurecr.io/docker_build:0.2
      volumes:
        - /mount:/mount
    outputs:
      images: "${{ steps.handle_docker.outputs.images }}"
    steps:
      - name: Set mock output images if pipeline should be skipped
        if: ${{ needs.smart_ci.outputs.skip_workflow == 'True' }}
        id: mock_image
        run: echo "images={\"ov_build\":{\"ubuntu_24_04_x64\":\"mock\", \"ubuntu_24_04_x64_sycl\":\"mock\", \"ubuntu_22_04_arm64\":\"mock\", \"ubuntu_24_04_riscv\":\"mock\"}}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: ${{ needs.smart_ci.outputs.skip_workflow != 'True' }}
        uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b # cherry_pick_retries
        timeout-minutes: 15

      - uses: ./.github/actions/handle_docker
        if: ${{ needs.smart_ci.outputs.skip_workflow != 'True' }}
        id: handle_docker
        with:
          images: |
            ov_build/ubuntu_24_04_x64
            ov_build/ubuntu_24_04_x64_sycl
            ov_build/ubuntu_24_04_riscv
          registry: 'openvinogithubactions.azurecr.io'
          dockerfiles_root_dir: '.github/dockerfiles'
          changed_components: ${{ needs.smart_ci.outputs.changed_components }}

  Docker_Arm:
    needs: Smart_CI
    runs-on: aks-linux-4-cores-8gb-arm-docker-build
    container:
      image: openvinogithubactions.azurecr.io/docker_build:0.2
      volumes:
        - /mount:/mount
    outputs:
      images: "${{ steps.handle_docker.outputs.images }}"
    steps:
      - name: Set mock output images if pipeline should be skipped
        if: ${{ needs.smart_ci.outputs.skip_workflow == 'True' }}
        id: mock_image
        run: echo "images={\"ov_build\":{\"ubuntu_22_04_arm64\":\"mock\"}}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: ${{ needs.smart_ci.outputs.skip_workflow != 'True' }}
        uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b # cherry_pick_retries
        timeout-minutes: 15

      - uses: ./.github/actions/handle_docker
        if: ${{ needs.smart_ci.outputs.skip_workflow != 'True' }}
        id: handle_docker
        with:
          images: |
            ov_build/ubuntu_22_04_arm64
          registry: 'openvinogithubactions.azurecr.io'
          dockerfiles_root_dir: '.github/dockerfiles'
          changed_components: ${{ needs.smart_ci.outputs.changed_components }}

  Build-x86_64:
    needs: [Docker, Smart_CI]
    if: fromJSON(needs.smart_ci.outputs.affected_components).CPU && !needs.smart_ci.outputs.skip_workflow
    uses: ./.github/workflows/job_clang_tidy.yml
    with:
      runner: aks-linux-16-cores-32gb
      cmake-build-parallel-level: '15'
      image: ${{ fromJSON(needs.docker.outputs.images).ov_build.ubuntu_24_04_x64 }}
      cmake-generator: 'Ninja Multi-Config'
      sccache-prefix: ubuntu24_x86_64_Release_itt_faster_build_clang_tidy
      build-target: openvino_intel_cpu_plugin
      compile-commands-artifact: compile_commands_clang_tidy_x86_64
      build-extra-args: '--quiet -k 0'

  Build-aarch64:
    needs: [Docker_Arm, Smart_CI]
    if: fromJSON(needs.smart_ci.outputs.affected_components).CPU && !needs.smart_ci.outputs.skip_workflow
    uses: ./.github/workflows/job_clang_tidy.yml
    with:
      runner: aks-linux-16-cores-32gb-arm
      cmake-build-parallel-level: '15'
      image: ${{ fromJSON(needs.docker_arm.outputs.images).ov_build.ubuntu_22_04_arm64 }}
      cmake-generator: 'Unix Makefiles'
      sccache-prefix: ubuntu24_x86_64_Release_itt_faster_build_clang_tidy_aarch64
      build-target: openvino_intel_cpu_plugin
      compile-commands-artifact: compile_commands_clang_tidy_aarch64
      # Unix Makefiles generator; keep going on errors (no --quiet until Ubuntu 24.04+).
      cmake-extra-args: '-DCMAKE_RULE_MESSAGES=OFF'
      build-extra-args: '-k'

  Build-riscv64:
    needs: [Docker, Smart_CI]
    if: fromJSON(needs.smart_ci.outputs.affected_components).CPU && !needs.smart_ci.outputs.skip_workflow
    uses: ./.github/workflows/job_clang_tidy.yml
    with:
      runner: aks-linux-16-cores-32gb
      cmake-build-parallel-level: '15'
      image: ${{ fromJSON(needs.docker.outputs.images).ov_build.ubuntu_24_04_riscv }}
      cmake-generator: 'Unix Makefiles'
      sccache-prefix: ubuntu24_x86_64_Release_itt_faster_build_clang_tidy_riscv64
      build-target: openvino_intel_cpu_plugin
      compile-commands-artifact: compile_commands_clang_tidy_riscv64
      # RISC-V cross toolchain, sequential threading, Unix Makefiles generator.
      cmake-extra-args: '-DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/riscv64.linux.toolchain.cmake -DCMAKE_RULE_MESSAGES=OFF -DTHREADING=SEQ'
      build-extra-args: '-k'
      show-sccache-stats: false

  Build-gpu:
    name: Build-gpu-${{ matrix.name }}
    needs: [Docker, Smart_CI]
    if: fromJSON(needs.smart_ci.outputs.affected_components).GPU && !needs.smart_ci.outputs.skip_workflow
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: COMBINED-OCL, mode: COMBINED, target: openvino_intel_gpu_plugin_ocl}
          - {name: COMBINED-ZE, mode: COMBINED, target: openvino_intel_gpu_plugin}
          - {name: ZE-no-oneDNN, mode: ZE-no-oneDNN, target: openvino_intel_gpu_plugin}
    uses: ./.github/workflows/job_clang_tidy.yml
    with:
      runner: aks-linux-16-cores-32gb
      cmake-build-parallel-level: '15'
      image: ${{ fromJSON(needs.docker.outputs.images).ov_build.ubuntu_24_04_x64 }}
      cmake-generator: 'Ninja Multi-Config'
      sccache-prefix: ubuntu24_x86_64_Release_itt_faster_build_clang_tidy_gpu_${{ matrix.mode }}
      build-target: ${{ matrix.target }}
      compile-commands-artifact: compile_commands_clang_tidy_gpu_x86_64_${{ matrix.name }}
      cmake-extra-args: >-
        -DENABLE_INTEL_GPU=ON
        -DGPU_RT_TYPE=${{ matrix.mode == 'ZE-no-oneDNN' && 'ZE' || matrix.mode }}
        -DENABLE_ONEDNN_FOR_GPU=${{ matrix.mode == 'ZE-no-oneDNN' && 'OFF' || 'ON' }}
      build-extra-args: '--quiet -k 0'

  Prepare-gpu-SYCL:
    name: Prepare-gpu-SYCL
    needs: [Docker, Smart_CI]
    if: fromJSON(needs.smart_ci.outputs.affected_components).GPU && !needs.smart_ci.outputs.skip_workflow
    uses: ./.github/workflows/job_clang_tidy.yml
    with:
      runner: aks-linux-16-cores-32gb
      cmake-build-parallel-level: '15'
      image: ${{ fromJSON(needs.docker.outputs.images).ov_build.ubuntu_24_04_x64_sycl }}
      cmake-generator: 'Ninja Multi-Config'
      sccache-prefix: ubuntu24_x86_64_Release_itt_faster_build_clang_tidy_gpu_SYCL
      build-target: openvino_intel_gpu_plugin
      compile-commands-artifact: compile_commands_clang_tidy_gpu_x86_64_SYCL_prepare
      prepare-only: true
      prepared-build-artifact: clang_tidy_gpu_SYCL_prepared
      cmake-extra-args: >-
        -DENABLE_INTEL_GPU=ON -DGPU_RT_TYPE=SYCL -DENABLE_ONEDNN_FOR_GPU=ON
        -DCLANG_TIDY=/usr/local/bin/clang-tidy-sycl -DCLANG_TIDY_REQUIRED_VERSION=19
        -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DENABLE_STRICT_DEPENDENCIES=OFF
        -DENABLE_SYSTEM_OPENCL=ON -DENABLE_SYSTEM_FLATBUFFERS=OFF
        -DENABLE_INTEL_CPU=OFF -DENABLE_INTEL_NPU=OFF
      build-extra-args: '--quiet -k 0'

  Build-gpu-SYCL:
    name: Build-gpu-SYCL-${{ matrix.analysis }}
    needs: [Docker, Smart_CI, Prepare-gpu-SYCL]
    if: fromJSON(needs.smart_ci.outputs.affected_components).GPU && !needs.smart_ci.outputs.skip_workflow
    strategy:
      fail-fast: false
      matrix:
        analysis: [host, device]
    uses: ./.github/workflows/job_clang_tidy.yml
    with:
      runner: aks-linux-16-cores-32gb
      cmake-build-parallel-level: '15'
      image: ${{ fromJSON(needs.docker.outputs.images).ov_build.ubuntu_24_04_x64_sycl }}
      cmake-generator: 'Ninja Multi-Config'
      sccache-prefix: ubuntu24_x86_64_Release_itt_faster_build_clang_tidy_gpu_SYCL
      build-target: openvino_intel_gpu_plugin
      compile-commands-artifact: compile_commands_clang_tidy_gpu_x86_64_SYCL_${{ matrix.analysis }}
      prepared-build-artifact: clang_tidy_gpu_SYCL_prepared
      clang-tidy-binary: /usr/local/bin/clang-tidy-sycl-${{ matrix.analysis }}
      cmake-extra-args: >-
        -DENABLE_INTEL_GPU=ON -DGPU_RT_TYPE=SYCL -DENABLE_ONEDNN_FOR_GPU=ON
        -DCLANG_TIDY=/usr/local/bin/clang-tidy-sycl-${{ matrix.analysis }} -DCLANG_TIDY_REQUIRED_VERSION=19
        -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DENABLE_STRICT_DEPENDENCIES=OFF
        -DENABLE_SYSTEM_OPENCL=ON -DENABLE_SYSTEM_FLATBUFFERS=OFF
        -DENABLE_INTEL_CPU=OFF -DENABLE_INTEL_NPU=OFF
      build-extra-args: '--quiet -k 0'

  Overall_Status:
    name: ci/gha_overall_status_clang_tidy
    needs: [Smart_CI, Build-x86_64, Build-aarch64, Build-riscv64, Build-gpu, Prepare-gpu-SYCL, Build-gpu-SYCL]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check status of all jobs
        if: >-
          ${{
            contains(needs.*.result, 'failure') ||
            contains(needs.*.result, 'cancelled')
          }}
        run: exit 1
