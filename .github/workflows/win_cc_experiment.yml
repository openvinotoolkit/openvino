name: win_cc_experiment
on:
  workflow_dispatch:
    inputs:
      target-branch:
        description: 'Target branch for the build; taken from event context by default'
        type: string
        required: false
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

concurrency:
  group: ${{ github.ref }}-win-cc-experiment
  cancel-in-progress: true

permissions: read-all

jobs:
  old_baseline:
    uses: ./.github/workflows/old_baseline.yml
    with:
      target-branch: ${{ inputs.target-branch }}

  msbuild:
    uses: ./.github/workflows/msbuild.yml
    with:
      target-branch: ${{ inputs.target-branch }}

  ninja_maxnick_pr:
    uses: ./.github/workflows/ninja_maxnick_pr.yml
    with:
      target-branch: ${{ inputs.target-branch }}

  Overall_Status:
    name: ci/gha_overall_status_windows_cc
    needs: [old_baseline, msbuild, ninja_maxnick_pr]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check status of all jobs
        if: >-
          ${{
            contains(needs.*.result, 'failure') ||
            contains(needs.*.result, 'cancelled')
          }}
        run: exit 1
