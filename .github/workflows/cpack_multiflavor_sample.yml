# Sample pipeline that demonstrates two ways of producing OpenVINO distribution
# archives from a single build:
#
#   * package_cpack_flavors (new approach) - a single CPack-driven build emits
#     two monolithic tarballs: the full OpenVINO archive and a reduced "winget"
#     archive without samples and Python. Both come from one build; the flavor is
#     chosen at packaging time via -D OV_CPACK_ARCHIVE_FLAVOR=full|winget.
#
#   * package_legacy_merge (old approach, runs in parallel) - CPack emits one
#     archive per component ("all targets"), which are then extracted and merged
#     into a single common openvino.tar.gz.
name: CPack multi-flavor packaging (sample)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'cmake/packaging/archive.cmake'
      - 'cmake/packaging/archive_flavors.cmake'
      - '.github/workflows/cpack_multiflavor_sample.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

env:
  CMAKE_BUILD_TYPE: Release
  # keep the build light while still registering samples + Python components,
  # so the "winget" flavor has something meaningful to exclude
  COMMON_CMAKE_OPTIONS: >-
    -G Ninja
    -DENABLE_PYTHON=ON
    -DENABLE_SAMPLES=ON
    -DENABLE_WHEEL=OFF
    -DENABLE_TESTS=OFF
    -DENABLE_INTEL_GPU=OFF
    -DENABLE_INTEL_NPU=OFF
    -DENABLE_NCC_STYLE=OFF
    -DCPACK_GENERATOR=TGZ

jobs:
  # New approach: two flavors from a single build via CPack.
  package_cpack_flavors:
    name: CPack flavors (full + winget)
    runs-on: ubuntu-22.04
    env:
      BUILD_DIR: ${{ github.workspace }}/build
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build python3-dev python3-pip patchelf
          python3 -m pip install --upgrade pip
          python3 -m pip install -r src/bindings/python/requirements.txt

      - name: Configure (enable multi-flavor archives)
        run: |
          cmake -S . -B "${BUILD_DIR}" \
            ${COMMON_CMAKE_OPTIONS} \
            -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE} \
            -DOV_CPACK_ARCHIVE_FLAVORS=ON

      - name: Build
        run: cmake --build "${BUILD_DIR}" --parallel "$(nproc)" --config "${CMAKE_BUILD_TYPE}"

      - name: Package full OpenVINO archive
        working-directory: ${{ env.BUILD_DIR }}
        run: cpack -G TGZ -C "${CMAKE_BUILD_TYPE}" -D OV_CPACK_ARCHIVE_FLAVOR=full

      - name: Package winget OpenVINO archive (no samples, no Python)
        working-directory: ${{ env.BUILD_DIR }}
        run: cpack -G TGZ -C "${CMAKE_BUILD_TYPE}" -D OV_CPACK_ARCHIVE_FLAVOR=winget

      - name: Show archive contents
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          echo "::group::openvino.tar.gz"
          tar -tzf openvino.tar.gz | sort | head -n 100
          echo "::endgroup::"
          echo "::group::openvino_winget.tar.gz"
          tar -tzf openvino_winget.tar.gz | sort | head -n 100
          echo "::endgroup::"

      - name: Upload full OpenVINO archive
        uses: actions/upload-artifact@v4
        with:
          name: openvino_package
          path: ${{ env.BUILD_DIR }}/openvino.tar.gz
          if-no-files-found: error

      - name: Upload winget OpenVINO archive
        uses: actions/upload-artifact@v4
        with:
          name: openvino_winget_package
          path: ${{ env.BUILD_DIR }}/openvino_winget.tar.gz
          if-no-files-found: error

  # Old approach (runs in parallel): per-component archives merged into one.
  package_legacy_merge:
    name: Legacy per-component archives + merge
    runs-on: ubuntu-22.04
    env:
      BUILD_DIR: ${{ github.workspace }}/build
      MERGE_DIR: ${{ github.workspace }}/merge
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build python3-dev python3-pip patchelf
          python3 -m pip install --upgrade pip
          python3 -m pip install -r src/bindings/python/requirements.txt

      - name: Configure (per-component archives)
        run: |
          cmake -S . -B "${BUILD_DIR}" \
            ${COMMON_CMAKE_OPTIONS} \
            -DCMAKE_BUILD_TYPE=${CMAKE_BUILD_TYPE}

      - name: Build
        run: cmake --build "${BUILD_DIR}" --parallel "$(nproc)" --config "${CMAKE_BUILD_TYPE}"

      - name: Package all targets (one archive per component)
        working-directory: ${{ env.BUILD_DIR }}
        run: cpack -G TGZ -C "${CMAKE_BUILD_TYPE}"

      - name: Merge per-component archives into the common archive
        working-directory: ${{ env.BUILD_DIR }}
        run: |
          rm -rf "${MERGE_DIR}"
          mkdir -p "${MERGE_DIR}"
          shopt -s nullglob
          component_archives=(inference-engine-*.tar.gz)
          if [ ${#component_archives[@]} -eq 0 ]; then
            echo "No per-component archives were produced" >&2
            exit 1
          fi
          for archive in "${component_archives[@]}"; do
            echo "Merging ${archive}"
            tar -xzf "${archive}" -C "${MERGE_DIR}"
          done
          tar -czf openvino.tar.gz -C "${MERGE_DIR}" .

      - name: Show merged archive contents
        working-directory: ${{ env.BUILD_DIR }}
        run: tar -tzf openvino.tar.gz | sort | head -n 100

      - name: Upload merged OpenVINO archive
        uses: actions/upload-artifact@v4
        with:
          name: openvino_package_legacy_merge
          path: ${{ env.BUILD_DIR }}/openvino.tar.gz
          if-no-files-found: error
