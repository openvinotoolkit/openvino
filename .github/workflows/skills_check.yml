name: Skills Check

on:
  pull_request:
    paths:
      - '.github/skills/**'
  push:
    paths:
      - '.github/skills/**'
    branches:
      - master
      - 'releases/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  validate:
    name: Validate skills
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b # cherry_pick_retries
        with:
          submodules: 'false'
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.10'

      - name: Install validation dependencies
        run: python -m pip install -r .github/scripts/skills/requirements.txt

      - name: Test validator
        run: python -m unittest discover -s .github/scripts/skills -p 'test_*.py'

      - name: Validate skill metadata and local links
        run: python .github/scripts/skills/validate.py
