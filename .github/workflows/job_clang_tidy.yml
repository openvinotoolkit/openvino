name: Clang-tidy build

on:
  workflow_call:
    inputs:
      runner:
        description: 'Machine on which the clang-tidy build runs'
        type: string
        required: true
      image:
        description: 'Docker image in which the build runs'
        type: string
        required: false
        default: null
      cmake-generator:
        description: 'CMake generator, e.g. "Ninja Multi-Config" or "Unix Makefiles"'
        type: string
        required: true
      sccache-prefix:
        description: 'SCCACHE_AZURE_KEY_PREFIX value for this build'
        type: string
        required: true
      build-target:
        description: 'CMake targets to build under clang-tidy, separated by spaces'
        type: string
        required: true
      compile-commands-artifact:
        description: 'Name of the uploaded compile_commands.json artifact'
        type: string
        required: true
      cmake-extra-args:
        description: 'Extra -D flags appended to the CMake configure command (single line)'
        type: string
        required: false
        default: ''
      build-extra-args:
        description: 'Arguments passed to the native build tool after the -- separator'
        type: string
        required: false
        default: '-k'
      show-sccache-stats:
        description: 'Whether to print sccache statistics after the build'
        type: boolean
        required: false
        default: true
      cmake-build-parallel-level:
        description: 'Number of threads for parallel build (hard-coded; nproc and NUMBER_OF_PROCESSORS do not respect container CPU limits)'
        type: string
        required: true
      prepare-only:
        description: 'Compile the shared build before running separate clang-tidy analyses'
        type: boolean
        default: false
      prepared-build-artifact:
        description: 'Artifact to upload during preparation or restore before analysis'
        type: string
        default: ''
      clang-tidy-binary:
        description: 'Run standalone analysis with this binary instead of recompiling the prepared build'
        type: string
        default: ''

permissions: read-all

jobs:
  Build:
    name: Build
    timeout-minutes: 60
    runs-on: ${{ inputs.runner }}
    container:
      image: ${{ inputs.image }}
      volumes:
        - /mount:/mount
        - /home/runner/secrets/:/secrets:ro
      options: -e SCCACHE_AZURE_BLOB_CONTAINER
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive # to prevent apt-get from waiting user input
      CMAKE_BUILD_TYPE: 'Release'
      CMAKE_GENERATOR: ${{ inputs.cmake-generator }}
      CMAKE_CXX_COMPILER_LAUNCHER: sccache
      CMAKE_C_COMPILER_LAUNCHER: sccache
      CMAKE_COMPILE_WARNING_AS_ERROR: 'ON'
      SCCACHE_IGNORE_SERVER_IO_ERROR: 1
      SCCACHE_SERVER_PORT: 35555
      SCCACHE_ERROR_LOG: /__w/openvino/sccache_log.txt
      SCCACHE_LOG: warn
      GITHUB_WORKSPACE: '/__w/openvino/openvino'
      OPENVINO_REPO: /__w/openvino/openvino/openvino
      BUILD_DIR: /__w/openvino/openvino/openvino_build
      SCCACHE_AZURE_KEY_PREFIX: ${{ inputs.sccache-prefix }}
      # Hard-coded at workflow call site; nproc and NUMBER_OF_PROCESSORS do not respect Kubernetes pod CPU limits.
      # Nested cmake --build (e.g. intel_gpu onednn_gpu ExternalProject) does not inherit --parallel from the top-level build.
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ inputs.cmake-build-parallel-level }}

    steps:
      - name: Append the environment variable - load SCCACHE_AZURE_CONNECTION_STRING from file
        run: |
          SCCACHE_AZURE_CONNECTION_STRING="$(cat /secrets/sccache/connection-string)"
          # OpenDAL 0.58.1 that is used by sccache 0.18.0 no longer trims BlobEndpoint trailing slashes, producing invalid Azure URLs.
          SCCACHE_AZURE_CONNECTION_STRING="$(sed -E 's#(^|;)(BlobEndpoint=[^;]*[^/;])/+(;|$)#\1\2\3#g' <<< "$SCCACHE_AZURE_CONNECTION_STRING")"
          # nosemgrep: yaml.github-actions.security.audit.unsafe-add-mask-workflow-command.unsafe-add-mask-workflow-command
          echo "::add-mask::${SCCACHE_AZURE_CONNECTION_STRING}"
          echo "SCCACHE_AZURE_CONNECTION_STRING=${SCCACHE_AZURE_CONNECTION_STRING}" >> $GITHUB_ENV
          echo "✓ Connection string loaded and masked"

      - name: Clone OpenVINO
        if: inputs.prepare-only || inputs.prepared-build-artifact == ''
        uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b # cherry_pick_retries
        timeout-minutes: 15
        with:
          path: ${{ env.OPENVINO_REPO }}
          submodules: 'recursive'
          persist-credentials: ${{ inputs.prepared-build-artifact == '' }}

      - name: Download prepared build
        if: ${{ !inputs.prepare-only && inputs.prepared-build-artifact != '' }}
        uses: akashchi/download-artifact@d59a9c15fec3fdb7c9adf09464124d00f9c11415 # main
        with:
          name: ${{ inputs.prepared-build-artifact }}
          path: ${{ runner.temp }}

      - name: Restore prepared build
        if: ${{ !inputs.prepare-only && inputs.prepared-build-artifact != '' }}
        run: tar -xpf "${RUNNER_TEMP}/prepared-build.tar.gz" -C "${GITHUB_WORKSPACE}"

      - name: Use the preprocessor compiler cache for shared builds
        if: inputs.prepared-build-artifact != ''
        run: echo 'SCCACHE_DIRECT=false' >> "$GITHUB_ENV"

      - name: CMake configure
        env:
          CMAKE_EXTRA_ARGS: ${{ inputs.cmake-extra-args }}
          ENABLE_CLANG_TIDY: ${{ inputs.prepare-only && 'OFF' || 'ON' }}
        run: |
          cmake \
            -G "${CMAKE_GENERATOR}" \
            -DENABLE_CLANG_TIDY="${ENABLE_CLANG_TIDY}" \
            -DENABLE_PROFILING_ITT=FULL \
            -DENABLE_DEBUG_CAPS=ON \
            -DSELECTIVE_BUILD=COLLECT \
            -DENABLE_PYTHON=OFF \
            -DENABLE_TESTS=OFF \
            -DENABLE_NCC_STYLE=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            ${CMAKE_EXTRA_ARGS} \
            -DCMAKE_C_COMPILER_LAUNCHER="${CMAKE_C_COMPILER_LAUNCHER}" \
            -DCMAKE_CXX_COMPILER_LAUNCHER="${CMAKE_CXX_COMPILER_LAUNCHER}" \
            -S "${OPENVINO_REPO}" \
            -B "${BUILD_DIR}"

      - name: CMake build
        if: inputs.clang-tidy-binary == ''
        env:
          BUILD_TARGET: ${{ inputs.build-target }}
          BUILD_EXTRA_ARGS: ${{ inputs.build-extra-args }}
        run: |
          read -r -a build_targets <<< "${BUILD_TARGET}"
          cmake \
            --build "${BUILD_DIR}" \
            --parallel "${CMAKE_BUILD_PARALLEL_LEVEL}" \
            --config "${CMAKE_BUILD_TYPE}" \
            --target "${build_targets[@]}" \
            -- ${BUILD_EXTRA_ARGS}

      - name: Run clang-tidy
        if: inputs.clang-tidy-binary != ''
        env:
          BUILD_TARGET: ${{ inputs.build-target }}
          CLANG_TIDY: ${{ inputs.clang-tidy-binary }}
        run: |
          read -r -a build_targets <<< "${BUILD_TARGET}"
          database="${BUILD_DIR}/clang-tidy"
          mkdir -p "$database"
          ninja -C "${BUILD_DIR}" -f "build-${CMAKE_BUILD_TYPE}.ninja" \
            -t compdb-targets "${build_targets[@]}" > "$database/targets.json"
          python3 - "$database" <<'PYTHON'
          import json
          import os
          import shlex
          import sys

          database = sys.argv[1]
          commands = []
          for command in json.load(open(os.path.join(database, "targets.json"))):
              argv = shlex.split(command["command"])
              tidy = next((arg for arg in argv if arg.startswith("--tidy=")), None)
              if tidy is not None:
                  command["arguments"] = argv[argv.index("--") + 1:]
                  command["tidy_args"] = tidy.split("=", 1)[1].split(";")[1:]
                  del command["command"]
                  commands.append(command)
          if not commands:
              sys.exit("No clang-tidy commands in the selected target")
          with open(os.path.join(database, "compile_commands.json"), "w") as stream:
              json.dump(commands, stream)
          print(f"Analyzing {len(commands)} commands")
          PYTHON
          /opt/intel/oneapi/compiler/2024.2/bin/run-clang-tidy \
            -clang-tidy-binary "$CLANG_TIDY" -p "$database" -j "$CMAKE_BUILD_PARALLEL_LEVEL"

      - name: Package prepared build
        if: inputs.prepare-only
        run: |
          tar -I 'pigz -p 4' -cf "${RUNNER_TEMP}/prepared-build.tar.gz" \
            -C "${GITHUB_WORKSPACE}" openvino openvino_build

      - name: Upload prepared build
        if: inputs.prepare-only
        uses: ababushk/upload-artifact@ebc7d74ace101c08868aed05dba2aaf274b9a2c7 # main
        with:
          name: ${{ inputs.prepared-build-artifact }}
          path: ${{ runner.temp }}/prepared-build.tar.gz
          retention-days: 1
          if-no-files-found: error

      - name: Upload compile_commands
        uses: ababushk/upload-artifact@ebc7d74ace101c08868aed05dba2aaf274b9a2c7 # main
        if: always()
        with:
          name: ${{ inputs.compile-commands-artifact }}
          path: ${{ env.BUILD_DIR }}/compile_commands.json
          if-no-files-found: 'ignore'

      - name: Show sccache stats
        if: ${{ inputs.show-sccache-stats }}
        run: ${SCCACHE_PATH} --show-stats
