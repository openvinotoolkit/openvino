name: Cleanup caches
on:
  workflow_dispatch:
  schedule:
    # at 00:00 on the 1st day of every month
    - cron: '0 0 1 * *'

permissions: read-all

jobs:
  Cleanup_PIP:
    name: Cleanup PIP cache
    runs-on: aks-linux-medium
    if: ${{ github.repository_owner == 'openvinotoolkit' }}
    container:
      image: openvinogithubactions.azurecr.io/dockerhub/ubuntu:24.04
      volumes:
        - /mount:/mount
    env:
      PIP_CACHE_PATH: /mount/caches/pip

    steps:
      - name: Pre-Collecting Cache Info
        run: |
          echo "Cache info: "
          du -h -d2 ${PIP_CACHE_PATH}

      - name: Cleanup cache
        run: |
          echo "Delete cache files if they have not been used in over 30 days"
          [ ! -z "${PIP_CACHE_PATH}" ] && find ${PIP_CACHE_PATH} ! -type d -atime +30 -delete

      - name: Post-Collecting Cache Info
        run: |
          echo "Cache info: "
          du -h -d2 ${PIP_CACHE_PATH}

  Cleanup_HF_Cache_Linux:
    name: Cleanup HuggingFace cache
    runs-on: aks-linux-medium
    if: ${{ github.repository_owner == 'openvinotoolkit' }}
    container:
      image: openvinogithubactions.azurecr.io/dockerhub/ubuntu:24.04
      volumes:
        - /mount:/mount
    env:
      HF_CACHE_PATH: /mount/caches/huggingface
    steps:
      - name: Pre-Collecting Cache Info
        run: |
          echo "Cache info: "
          du -h -d2 ${HF_CACHE_PATH}

      - name: Cleanup cache
        run: |
          echo "Delete cache files if they have not been used in over 30 days"
          [ ! -z "${HF_CACHE_PATH}" ] && find ${HF_CACHE_PATH} ! -type d -atime +30 -delete

      - name: Post-Collecting Cache Info
        run: |
          echo "Cache info: "
          du -h -d2 ${HF_CACHE_PATH}

  Cleanup_HF_Cache_HRZ_iGPU:
    name: Cleanup HuggingFace cache (HRZ)
    runs-on:
      group: Intel-GPU
      labels: [ 'self-hosted', 'igpu', 'Linux' ]
    if: ${{ github.repository_owner == 'openvinotoolkit' }}
    container:
      image: openvinogithubactions.azurecr.io/dockerhub/ubuntu:24.04
      volumes:
        - /mnt/caches:/mnt/caches
    env:
      HF_CACHE_PATH: /mnt/caches/huggingface
    steps:
      - name: Pre-Collecting Cache Info
        run: |
          echo "Cache info: "
          du -h -d2 ${HF_CACHE_PATH}

      - name: Cleanup cache
        run: |
          echo "Delete cache files if they have not been used in over 30 days"
          [ ! -z "${HF_CACHE_PATH}" ] && find ${HF_CACHE_PATH} ! -type d -atime +30 -delete

      - name: Post-Collecting Cache Info
        run: |
          echo "Cache info: "
          du -h -d2 ${HF_CACHE_PATH}

  Cleanup_HF_Cache_Windows:
    name: Cleanup Windows HuggingFace cache
    timeout-minutes: 540
    if: ${{ github.repository_owner == 'openvinotoolkit' }}
    runs-on: 'aks-win-4-cores-8gb-test'
    defaults:
      run:
        shell: pwsh
    env:
      HF_CACHE_PATH: "C:\\mount\\caches\\huggingface"

    steps:
      - name: Pre-Collecting Cache Info
        run: |
          Write-Host "Cache info: "
          "{0:N2}" -f ((Get-ChildItem -path "$env:HF_CACHE_PATH" -recurse | Measure-Object -property length -sum ).sum /1MB) + " MB"

      - name: Cleanup cache
        run: |
          Write-Host "Delete cache files if they have not been used in over 30 days"
          $cutoff = (Get-Date).AddDays(-30)
          Get-ChildItem -Path "$env:HF_CACHE_PATH" -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.LastAccessTime -lt $cutoff } |
            Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Post-Collecting Cache Info
        run: |
          Write-Host "Cache info: "
          "{0:N2}" -f ((Get-ChildItem -path "$env:HF_CACHE_PATH" -recurse | Measure-Object -property length -sum ).sum /1MB) + " MB"

  Cleanup_ccache_lin:
    name: Cleanup Linux ccache
    runs-on: aks-linux-medium
    if: ${{ github.repository_owner == 'openvinotoolkit' }}
    container:
      image: openvinogithubactions.azurecr.io/dockerhub/ubuntu:24.04
      volumes:
        - /mount:/mount
    env:
      CCACHE_PATH: /mount/caches/ccache

    steps:
      - name: Checkout cache action
        uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b # cherry_pick_retries
        timeout-minutes: 15
        with:
          sparse-checkout: .github/actions/cache

      - name: Cleanup ccache
        uses: ./.github/actions/cache/cleanup
        with:
          cache-size: 300
          max-cache-size: 750
          cache-path: ${{ env.CCACHE_PATH }}
          recursive: true
          key: '.'


  Cleanup_ccache_win:
    name: Cleanup Windows ccache
    runs-on: 'aks-win-4-cores-8gb-test'
    env:
      CCACHE_PATH: C:\\mount\\caches\\ccache

    steps:
      - name: Checkout cache action
        uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b # cherry_pick_retries
        timeout-minutes: 15
        with:
          sparse-checkout: .github/actions/cache

      - name: Cleanup ccache
        uses: ./.github/actions/cache/cleanup
        with:
          cache-size: 300
          max-cache-size: 750
          cache-path: C:\\mount\\caches\\ccache
          recursive: true
          key: '.'

  Docker:
    name: Docker
    runs-on: aks-linux-4-cores-16gb-docker-build
    if: ${{ github.repository_owner == 'openvinotoolkit' }}
    container:
      image: openvinogithubactions.azurecr.io/docker_build:0.2
      volumes:
        - /mount:/mount
    outputs:
      images: "${{ steps.handle_docker.outputs.images }}"
    steps:
      - name: Checkout
        uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b # cherry_pick_retries
        timeout-minutes: 15

      - uses: ./.github/actions/handle_docker
        id: handle_docker
        with:
          images: |
            ov_build/ubuntu_24_04_x64
          registry: 'openvinogithubactions.azurecr.io'
          dockerfiles_root_dir: '.github/dockerfiles'
          changed_components: '{"docker_env": false, "dockerfiles": false}'

  # Remote ccache entries are hash-named files without the ".cache" suffix used by the cache
  # action, so they are trimmed by ccache itself: least recently used entries (by modification
  # time, refreshed on hits via update-mtime=true) are evicted down to CCACHE_REMOTE_MAX_SIZE.
  Cleanup_remote_ccache_lin:
    name: Cleanup Linux remote ccache
    needs: Docker
    runs-on: aks-linux-medium
    timeout-minutes: 60
    if: ${{ github.repository_owner == 'openvinotoolkit' }}
    container:
      image: ${{ fromJSON(needs.docker.outputs.images).ov_build.ubuntu_24_04_x64 }}
      volumes:
        - /mount:/mount
    env:
      CCACHE_REMOTE_PATH: /mount/caches/ccache/shared
      CCACHE_REMOTE_MAX_SIZE: 500Gi

    steps:
      - name: Cleanup remote ccache
        shell: bash
        run: ccache --trim-dir "${CCACHE_REMOTE_PATH}" --trim-max-size "${CCACHE_REMOTE_MAX_SIZE}" --trim-method mtime

  Cleanup_remote_ccache_win:
    name: Cleanup Windows remote ccache
    runs-on: 'aks-win-4-cores-8gb-build'
    timeout-minutes: 60
    if: ${{ github.repository_owner == 'openvinotoolkit' }}
    env:
      CCACHE_REMOTE_PATH: "C:\\mount\\caches\\ccache\\shared"
      CCACHE_REMOTE_MAX_SIZE: 500Gi

    steps:
      - name: Cleanup remote ccache
        shell: pwsh
        run: |
          ccache --trim-dir $env:CCACHE_REMOTE_PATH --trim-max-size $env:CCACHE_REMOTE_MAX_SIZE --trim-method mtime
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
