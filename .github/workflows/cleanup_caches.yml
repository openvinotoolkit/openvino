name: Cleanup caches
on:
  workflow_dispatch:
  schedule:
    # at 00:00 on the 1st day of every month
    - cron: '0 0 1 * *'

permissions: read-all

jobs:
  Cleanup_PIP:
    name: Cleanup PIP cache
    runs-on: aks-linux-medium
    if: ${{ github.repository_owner == 'openvinotoolkit' }}
    container:
      image: openvinogithubactions.azurecr.io/dockerhub/ubuntu:24.04
      volumes:
        - /mount:/mount
    env:
      PIP_CACHE_PATH: /mount/caches/pip

    steps:
      - name: Pre-Collecting Cache Info
        run: |
          echo "Cache info: "
          du -h -d2 ${PIP_CACHE_PATH}

      - name: Cleanup cache
        run: |
          echo "Delete cache files if they have not been used in over 30 days"
          [ ! -z "${PIP_CACHE_PATH}" ] && find ${PIP_CACHE_PATH} ! -type d -atime +30 -delete

      - name: Post-Collecting Cache Info
        run: |
          echo "Cache info: "
          du -h -d2 ${PIP_CACHE_PATH}

  Cleanup_HF_Cache_Linux:
    name: Cleanup HuggingFace cache
    runs-on: aks-linux-medium
    if: ${{ github.repository_owner == 'openvinotoolkit' }}
    container:
      image: openvinogithubactions.azurecr.io/dockerhub/ubuntu:24.04
      volumes:
        - /mount:/mount
    env:
      HF_CACHE_PATH: /mount/caches/huggingface
    steps:
      - name: Pre-Collecting Cache Info
        run: |
          echo "Cache info: "
          du -h -d2 ${HF_CACHE_PATH}

      - name: Cleanup cache
        run: |
          echo "Delete cache files if they have not been used in over 30 days"
          [ ! -z "${HF_CACHE_PATH}" ] && find ${HF_CACHE_PATH} ! -type d -atime +30 -delete

      - name: Post-Collecting Cache Info
        run: |
          echo "Cache info: "
          du -h -d2 ${HF_CACHE_PATH}

  Cleanup_HF_Cache_HRZ_iGPU:
    name: Cleanup HuggingFace cache (HRZ)
    runs-on:
      group: Intel-GPU
      labels: [ 'self-hosted', 'igpu', 'Linux' ]
    if: ${{ github.repository_owner == 'openvinotoolkit' }}
    container:
      image: openvinogithubactions.azurecr.io/dockerhub/ubuntu:24.04
      volumes:
        - /mnt/caches:/mnt/caches
    env:
      HF_CACHE_PATH: /mnt/caches/huggingface
    steps:
      - name: Pre-Collecting Cache Info
        run: |
          echo "Cache info: "
          du -h -d2 ${HF_CACHE_PATH}

      - name: Cleanup cache
        run: |
          echo "Delete cache files if they have not been used in over 30 days"
          [ ! -z "${HF_CACHE_PATH}" ] && find ${HF_CACHE_PATH} ! -type d -atime +30 -delete

      - name: Post-Collecting Cache Info
        run: |
          echo "Cache info: "
          du -h -d2 ${HF_CACHE_PATH}

  Cleanup_HF_Cache_Windows:
    name: Cleanup Windows HuggingFace cache
    timeout-minutes: 540
    if: ${{ github.repository_owner == 'openvinotoolkit' }}
    runs-on: 'aks-win-4-cores-8gb-test'
    defaults:
      run:
        shell: pwsh
    env:
      HF_CACHE_PATH: "C:\\mount\\caches\\huggingface"

    steps:
      - name: Pre-Collecting Cache Info
        run: |
          Write-Host "Cache info: "
          "{0:N2}" -f ((Get-ChildItem -path "$env:HF_CACHE_PATH" -recurse | Measure-Object -property length -sum ).sum /1MB) + " MB"

      - name: Cleanup cache
        run: |
          Write-Host "Delete cache files if they have not been used in over 30 days"
          $cutoff = (Get-Date).AddDays(-30)
          Get-ChildItem -Path "$env:HF_CACHE_PATH" -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.LastAccessTime -lt $cutoff } |
            Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Post-Collecting Cache Info
        run: |
          Write-Host "Cache info: "
          "{0:N2}" -f ((Get-ChildItem -path "$env:HF_CACHE_PATH" -recurse | Measure-Object -property length -sum ).sum /1MB) + " MB"

  Cleanup_ccache_lin:
    name: Cleanup Linux ccache
    runs-on: aks-linux-medium
    if: ${{ github.repository_owner == 'openvinotoolkit' }}
    container:
      image: openvinogithubactions.azurecr.io/dockerhub/ubuntu:24.04
      volumes:
        - /mount:/mount
    env:
      CCACHE_PATH: /mount/caches/ccache

    steps:
      - name: Checkout cache action
        uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b # cherry_pick_retries
        timeout-minutes: 15
        with:
          sparse-checkout: .github/actions/cache

      - name: Cleanup ccache
        uses: ./.github/actions/cache/cleanup
        with:
          cache-size: 300
          max-cache-size: 750
          cache-path: ${{ env.CCACHE_PATH }}
          recursive: true
          key: '.'


  Cleanup_ccache_win:
    name: Cleanup Windows ccache
    runs-on: 'aks-win-4-cores-8gb-test'
    env:
      CCACHE_PATH: 'C:\mount\caches\ccache'

    steps:
      - name: Checkout cache action
        uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b # cherry_pick_retries
        timeout-minutes: 15
        with:
          sparse-checkout: .github/actions/cache

      - name: Cleanup ccache
        uses: ./.github/actions/cache/cleanup
        with:
          cache-size: 300
          max-cache-size: 750
          cache-path: ${{ env.CCACHE_PATH }}
          recursive: true
          key: '.'

      # ccache 4.9.1 ignores --trim-method mtime.
      - name: Install ccache for remote trimming
        shell: pwsh
        run: |
          $archivePath = Join-Path $env:RUNNER_TEMP 'ccache-4.14.3-windows-x86_64.zip'
          Invoke-WebRequest -Uri 'https://github.com/ccache/ccache/releases/download/v4.14.3/ccache-4.14.3-windows-x86_64.zip' -OutFile $archivePath -TimeoutSec 120
          $expectedSha256 = 'c845c3d65be81954c75659145a522a793a27586bf940c5dcfe18af33fa1a67dd'
          if ((Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash -ne $expectedSha256) {
            throw 'ccache archive checksum mismatch'
          }
          Expand-Archive -LiteralPath $archivePath -DestinationPath $env:RUNNER_TEMP -Force

      - name: Trim Windows remote ccache
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath $env:CCACHE_PATH -PathType Container)) {
            throw "Windows ccache root is not accessible: $env:CCACHE_PATH"
          }
          $remoteCachePath = Join-Path $env:CCACHE_PATH 'shared/windows'
          if (Test-Path -LiteralPath $remoteCachePath) {
            if (-not (Test-Path -LiteralPath $remoteCachePath -PathType Container)) {
              throw "Windows remote ccache is not a directory: $remoteCachePath"
            }
            $ccache = Join-Path $env:RUNNER_TEMP 'ccache-4.14.3-windows-x86_64/ccache.exe'
            & $ccache --trim-dir "$remoteCachePath" --trim-max-size 300GiB --trim-method mtime
            if ($LASTEXITCODE -ne 0) {
              throw "ccache trim failed with exit code $LASTEXITCODE"
            }
          } else {
            Write-Host "Windows remote ccache has not been created: $remoteCachePath"
          }
