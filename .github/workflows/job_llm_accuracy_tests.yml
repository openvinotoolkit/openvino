name: LLM accuracy tests
on:
  workflow_call:
    inputs:
      runner:
        description: 'Machine on which the tests would run'
        type: string
        required: true
      image:
        description: 'Docker image to use for the job'
        type: string
        required: true
      container-options:
        description: 'Additional docker container options (e.g. GPU device mounts)'
        type: string
        required: false
        default: ''
      device:
        description: 'Device filter passed to pytest -k (CPU or GPU)'
        type: string
        required: true
      timeout-minutes:
        description: 'Job timeout in minutes'
        type: number
        required: false
        default: 90

permissions: read-all

env:
  HF_HUB_CACHE_LIN: /mnt/caches/huggingface
  HF_TOKEN_PATH_LIN: /secrets/huggingface/token-secondary

jobs:
  LLM_Accuracy_Tests:
    name: LLM accuracy ${{ inputs.device }} tests
    timeout-minutes: ${{ inputs.timeout-minutes }}
    runs-on: ${{ fromJSON(inputs.runner) }}
    container:
      image: ${{ inputs.image }}
      volumes:
        - /mnt/caches:/mnt/caches
        - /home/runner/secrets/:/secrets:ro
        - ${{ github.workspace }}:${{ github.workspace }}
      options: ${{ inputs.container-options }}
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      INSTALL_DIR: ${{ github.workspace }}/install
      LLM_TEST_DIR: ${{ github.workspace }}/tests/llm
      HF_HUB_CACHE: ${{ env.HF_HUB_CACHE_LIN }}
      HUGGINGFACE_HUB_CACHE: ${{ env.HF_HUB_CACHE_LIN }}
      HF_TOKEN_PATH: ${{ env.HF_TOKEN_PATH_LIN }}
    steps:
      - name: Checkout
        uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b # cherry_pick_retries
        timeout-minutes: 15
        with:
          sparse-checkout: |
            .github/actions
            tests/llm
            tests/constraints.txt
          sparse-checkout-cone-mode: false
          submodules: 'false'

      - name: Download OpenVINO artifacts (wheels)
        uses: akashchi/download-artifact@d59a9c15fec3fdb7c9adf09464124d00f9c11415 # main
        with:
          name: openvino_wheels
          path: ${{ env.INSTALL_DIR }}

      - name: Download OpenVINO artifacts (tokenizers_wheel)
        uses: akashchi/download-artifact@d59a9c15fec3fdb7c9adf09464124d00f9c11415 # main
        with:
          name: openvino_tokenizers_wheel
          path: ${{ env.INSTALL_DIR }}

      - name: Setup Python 3.12
        uses: ./.github/actions/setup_python
        with:
          version: '3.12'
          set-pip-install-path: 'false'
          self-hosted-runner: true
          use-pip-proxy: true

      - name: Install OpenVINO Python wheels
        uses: ./.github/actions/install_ov_wheels
        with:
          wheels-dir-path: ${{ env.INSTALL_DIR }}
          wheels-to-install: 'openvino openvino_tokenizers'

      - name: Install LLM accuracy test requirements
        run: |
          python3 -m pip install -r ${LLM_TEST_DIR}/requirements.txt
          python3 -m pip install pytest-html

      - name: LLM accuracy ${{ inputs.device }} tests
        run: |
          python3 -m pytest ${LLM_TEST_DIR}/accuracy_conformance.py \
            -k ${{ inputs.device }} \
            --tb native \
            --log-level INFO \
            --log-cli-level ERROR \
            --junitxml=${LLM_TEST_DIR}/llm_accuracy.xml \
            --html=${LLM_TEST_DIR}/llm_accuracy.html \
            --self-contained-html

      - name: Upload LLM accuracy test results
        uses: ababushk/upload-artifact@ebc7d74ace101c08868aed05dba2aaf274b9a2c7 # main
        if: always()
        with:
          name: test-results-llm-accuracy-${{ inputs.device }}
          path: |
            ${{ env.LLM_TEST_DIR }}/llm_accuracy.xml
            ${{ env.LLM_TEST_DIR }}/llm_accuracy.html
          if-no-files-found: 'ignore'
