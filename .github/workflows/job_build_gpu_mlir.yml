name: Build GPU MLIR (LLVM + Graph Compiler + OpenVINO)

on:
  workflow_call:
    inputs:
      runner:
        description: 'Machine on which the build runs'
        type: string
        required: true
      image:
        description: 'Docker image for the build; empty means no container (Windows)'
        type: string
        required: false
      artifacts-suffix:
        description: 'Suffix appended to the artifact names'
        type: string
        required: false
        default: ''
      target-branch:
        description: 'Target branch for the build; taken from event context by default'
        type: string
        required: false
      graph-compiler-ref:
        description: 'Graph Compiler branch/tag/SHA; GRAPH_COMPILER_TAG from graph-compiler.cmake by default'
        type: string
        required: false
      timeout-minutes:
        description: 'Build job timeout'
        type: number
        required: false
        default: 120

permissions: read-all

jobs:
  Build:
    timeout-minutes: ${{ inputs.timeout-minutes }}
    defaults:
      run:
        shell: bash
    runs-on: ${{ inputs.runner }}
    container:
      image: ${{ inputs.image }}
      volumes:
        - /mount:/mount
        - /home/runner/secrets/:/secrets:ro
        - ${{ github.workspace }}:${{ github.workspace }} # Needed as ${{ github.workspace }} is not working correctly when using Docker
      options: >-
        -e SCCACHE_AZURE_BLOB_CONTAINER
    env:
      CMAKE_BUILD_TYPE: 'Release'
      CMAKE_GENERATOR: 'Ninja'
      SCCACHE_IGNORE_SERVER_IO_ERROR: 1
      SCCACHE_SERVER_PORT: 35555
      SCCACHE_LOG: warn
      # nproc does not respect Kubernetes pod CPU limits
      CMAKE_BUILD_PARALLEL_LEVEL: '15'
      PYTHON_VERSION: '3.11'
      # Graph Compiler `scripts/build.sh` inputs. With GITHUB_ACTIONS=true and
      # LLVM_BUILD_TARGET=install it skips the LLVM build when LLVM_INSTALL_DIR already
      # contains lib/cmake/mlir/MLIRConfig.cmake (i.e. on a cache hit).
      GC_BUILD_TYPE: 'Release'
      LLVM_BUILD_TYPE: 'Release'
      GC_DYLINK: 'OFF'
      LLVM_CMAKE_ARGS: '-DMLIR_ENABLE_BINDINGS_PYTHON=OFF'
      GC_CMAKE_ARGS: '-DGC_ENABLE_TEST=OFF -DGC_ENABLE_TOOLS=OFF -DGC_ENABLE_ZE=OFF'
      LLVM_BUILD_TARGET: install

    steps:
      - name: Set up environment
        env:
          TARGET_BRANCH: ${{ inputs.target-branch || github.base_ref || github.ref_name }}
        run: |
          # The runner context and github.workspace (backslashes on Windows) are unusable in job-level env
          if [ "${RUNNER_OS}" = "Windows" ]; then ws="$(cygpath -m "${GITHUB_WORKSPACE}")"; else ws="${GITHUB_WORKSPACE}"; fi
          {
            echo "OPENVINO_REPO=${ws}/openvino"
            echo "BUILD_DIR=${ws}/openvino_build"
            echo "INSTALL_DIR=${ws}/openvino_install"
            echo "INSTALL_TEST_DIR=${ws}/openvino_tests"
            echo "GC_REPO=${ws}/graph-compiler"
            echo "LLVM_INSTALL_DIR=${ws}/graph-compiler/externals/llvm/Release"
            echo "GC_INSTALL_DIR=${ws}/graph-compiler/build/Release/install"
            echo "SCCACHE_ERROR_LOG=${ws}/sccache_log.txt"
            if [ "${RUNNER_OS}" = "Windows" ]; then
              echo "CC=cl"
              echo "CXX=cl"
              echo "CMAKE_C_COMPILER_LAUNCHER=ccache"
              echo "CMAKE_CXX_COMPILER_LAUNCHER=ccache"
              echo "CACHE_TOOL=ccache"
              echo "CCACHE_DIR=${ws}/ccache"
              echo "CCACHE_MAXSIZE=3G"
              echo "CCACHE_SLOPPINESS=pch_defines,time_macros"
              echo "CCACHE_REMOTE_DIR=C:/mount/caches/ccache/windows_mlir_x86_64_Release/${TARGET_BRANCH}"
              echo "LLVM_CACHE_DIR=C:/mount/caches/ccache/graph-compiler/llvm/windows_x86_64_Release"
              echo "OV_CMAKE_ARGS="
            else
              echo "CMAKE_C_COMPILER_LAUNCHER=sccache"
              echo "CMAKE_CXX_COMPILER_LAUNCHER=sccache"
              echo "CACHE_TOOL=${SCCACHE_PATH}"
              echo "SCCACHE_AZURE_KEY_PREFIX=ubuntu_24_04_x86_64_mlir_Release"
              # TODO: move to a dedicated shared mount once the runners provide one.
              echo "LLVM_CACHE_DIR=/mount/caches/ccache/graph-compiler/llvm/ubuntu_24_04_x86_64_Release"
              echo "OV_CMAKE_ARGS=-DENABLE_SYSTEM_OPENCL=ON"
            fi
          } >> "$GITHUB_ENV"

      - name: Load SCCACHE_AZURE_CONNECTION_STRING from file
        if: runner.os == 'Linux'
        run: |
          SCCACHE_AZURE_CONNECTION_STRING="$(cat /secrets/sccache/connection-string)"
          # OpenDAL 0.58.1 that is used by sccache 0.18.0 no longer trims BlobEndpoint trailing slashes, producing invalid Azure URLs.
          SCCACHE_AZURE_CONNECTION_STRING="$(sed -E 's#(^|;)(BlobEndpoint=[^;]*[^/;])/+(;|$)#\1\2\3#g' <<< "$SCCACHE_AZURE_CONNECTION_STRING")"
          # nosemgrep: yaml.github-actions.security.audit.unsafe-add-mask-workflow-command.unsafe-add-mask-workflow-command
          echo "::add-mask::${SCCACHE_AZURE_CONNECTION_STRING}"
          echo "SCCACHE_AZURE_CONNECTION_STRING=${SCCACHE_AZURE_CONNECTION_STRING}" >> "$GITHUB_ENV"
          echo "✓ Connection string loaded and masked"

      - name: Clone OpenVINO
        uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b # cherry_pick_retries
        timeout-minutes: 15
        with:
          path: 'openvino'
          submodules: 'recursive'
          ref: ${{ inputs.target-branch }}

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        if: runner.os == 'Windows'
        uses: ./openvino/.github/actions/setup_python
        with:
          version: ${{ env.PYTHON_VERSION }}
          use-pip-proxy: 'true'
          self-hosted-runner: 'true'

      - name: Configure Developer Command Prompt for Microsoft Visual C++
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          toolset: "14.42" # v2022

      - name: Setup ccache
        if: runner.os == 'Windows'
        uses: ./openvino/.github/actions/cache
        with:
          save-always: ${{ github.event_name == 'push' && 'true' || 'false' }}
          cleanup-always: ${{ github.event_name == 'push' && 'true' || 'false' }}
          cache-path: ${{ env.CCACHE_REMOTE_DIR }}
          path: ${{ env.CCACHE_DIR }}
          key: ${{ runner.os }}-${{ runner.arch }}-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ccache

      - name: Clone Graph Compiler
        env:
          GRAPH_COMPILER_REF: ${{ inputs.graph-compiler-ref }}
        run: |
          cmake_file="${OPENVINO_REPO}/src/plugins/intel_gpu/thirdparty/cmake/graph-compiler.cmake"
          ref="${GRAPH_COMPILER_REF:-$(sed -nE 's/.*GRAPH_COMPILER_TAG "([^"]+)".*/\1/p' "$cmake_file")}"
          repo="$(sed -nE 's/.*GRAPH_COMPILER_REPO "([^"]+)".*/\1/p' "$cmake_file")"
          [ -n "$ref" ] || { echo "Failed to resolve Graph Compiler ref"; exit 1; }
          [ -n "$repo" ] || { echo "Failed to resolve Graph Compiler repository"; exit 1; }
          git init "${GC_REPO}"
          git -C "${GC_REPO}" fetch --depth 1 "${repo}" "$ref"
          git -C "${GC_REPO}" checkout FETCH_HEAD
          echo "Graph Compiler $ref at $(git -C "${GC_REPO}" rev-parse HEAD)"

      - name: Compute LLVM cache key
        id: cache_keys
        working-directory: ${{ env.GC_REPO }}
        run: |
          # cl prints its banner to stderr and exits non-zero
          llvm_sha=$({ cat cmake/llvm-* scripts/build.sh scripts/utils.sh patches/*.patch; "${CXX:-c++}" --version 2>&1 || true; echo "${LLVM_CMAKE_ARGS}"; } \
            | sha1sum | cut -d' ' -f1)
          echo "llvm-key=llvm-${LLVM_BUILD_TYPE}-dylink${GC_DYLINK}-${llvm_sha}" >> "$GITHUB_OUTPUT"
          # The restore action creates the target directory with a non-recursive mkdir
          mkdir -p "$(dirname "${LLVM_INSTALL_DIR}")"

      - name: Setup LLVM cache
        id: llvm_cache
        uses: ./openvino/.github/actions/cache
        with:
          # workflow_dispatch can seed the cache, PR runs cannot
          save-always: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'true' || 'false' }}
          cache-path: ${{ env.LLVM_CACHE_DIR }}
          path: ${{ env.LLVM_INSTALL_DIR }}
          key: ${{ steps.cache_keys.outputs.llvm-key }}

      - name: Clean up old LLVM caches
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: ./openvino/.github/actions/cache/cleanup
        with:
          cache-path: ${{ env.LLVM_CACHE_DIR }}
          key: ${{ steps.cache_keys.outputs.llvm-key }}
          restore-keys: llvm-${{ env.LLVM_BUILD_TYPE }}-dylink${{ env.GC_DYLINK }}-
          cache-size: 3
          max-cache-size: 6

      - name: Clean compiler cache stats
        run: ${CACHE_TOOL} --zero-stats

      - name: Build LLVM and Graph Compiler
        working-directory: ${{ env.GC_REPO }}
        run: ./scripts/build.sh

      - name: Show and clean compiler cache stats (LLVM + Graph Compiler)
        run: |
          ${CACHE_TOOL} --show-stats
          ${CACHE_TOOL} --zero-stats

      - name: Shrink the LLVM install tree
        if: steps.llvm_cache.outputs.cache-hit != 'true'
        run: |
          # Unused by the GC and OV builds. Files referenced by the LLVM cmake config are
          # truncated rather than deleted, otherwise `find_package(LLVM)` fails on a cache hit.
          # lib/*.a / lib/*.lib must be kept: GC and OV link LLVM/MLIR statically.
          rm -rf "${LLVM_INSTALL_DIR}/share" "${LLVM_INSTALL_DIR}/python_packages" "${LLVM_INSTALL_DIR}/src"
          # Absolute path: on Windows, System32\find.exe precedes Git's GNU find in PATH
          /usr/bin/find "${LLVM_INSTALL_DIR}/bin/" -type f \
            ! -name '*tblgen*' ! -name 'mlir-linalg-ods-yaml-gen*' ! -name 'mlir-pdll*' ! -name 'mlir-src-sharder*' \
            ! -name 'FileCheck*' ! -name 'llvm-lit*' \
            -exec truncate -s 0 {} +
          du -sh "${LLVM_INSTALL_DIR}"

      - name: Build OpenVINO
        run: |
          # ENABLE_DEBUG_CAPS is required: OV_GPU_ENABLE_MLIR is a debug-only option
          # shellcheck disable=SC2086 # OV_CMAKE_ARGS is intentionally word-split
          cmake -S "${OPENVINO_REPO}" -B "${BUILD_DIR}" \
            -DENABLE_MLIR_FOR_GPU=ON \
            -DENABLE_DEBUG_CAPS=ON \
            -DCMAKE_PREFIX_PATH="${GC_INSTALL_DIR};${LLVM_INSTALL_DIR}" \
            -DENABLE_ONEDNN_FOR_GPU=OFF \
            -DENABLE_TESTS=ON \
            -DENABLE_INTEL_CPU=OFF \
            -DENABLE_INTEL_NPU=OFF \
            -DENABLE_NCC_STYLE=OFF \
            -DENABLE_OV_ONNX_FRONTEND=OFF -DENABLE_OV_PADDLE_FRONTEND=OFF \
            -DENABLE_OV_TF_FRONTEND=OFF -DENABLE_OV_TF_LITE_FRONTEND=OFF \
            -DENABLE_OV_PYTORCH_FRONTEND=OFF -DENABLE_OV_JAX_FRONTEND=OFF \
            -DENABLE_PYTHON=OFF -DENABLE_SAMPLES=OFF \
            -DENABLE_STRICT_DEPENDENCIES=OFF \
            ${OV_CMAKE_ARGS} \
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build "${BUILD_DIR}" --parallel "${CMAKE_BUILD_PARALLEL_LEVEL}" -- --quiet

      - name: Show compiler cache stats (OpenVINO)
        run: ${CACHE_TOOL} --show-stats

      - name: Upload sccache log
        if: always() && runner.os == 'Linux'
        uses: ababushk/upload-artifact@ebc7d74ace101c08868aed05dba2aaf274b9a2c7 # main
        with:
          name: sccache_log
          path: ${{ env.SCCACHE_ERROR_LOG }}
          if-no-files-found: 'ignore'

      - name: CMake install - OpenVINO
        run: |
          cmake --install "${BUILD_DIR}" --prefix "${INSTALL_DIR}"
          cmake --install "${BUILD_DIR}" --prefix "${INSTALL_TEST_DIR}" --component tests

      - name: Pack openvino_package and openvino_tests
        run: |
          # Pipe to stdout: portable across GNU tar and bsdtar (Windows System32)
          gz="$(command -v pigz || echo gzip)"
          tar -cf - -C "${INSTALL_DIR}" . | "$gz" -c > "${BUILD_DIR}/openvino_package.tar.gz"
          tar -cf - -C "${INSTALL_TEST_DIR}" . | "$gz" -c > "${BUILD_DIR}/openvino_tests.tar.gz"

      - name: Upload openvino package
        uses: ababushk/upload-artifact@ebc7d74ace101c08868aed05dba2aaf274b9a2c7 # main
        with:
          name: openvino_package${{ inputs.artifacts-suffix }}
          path: ${{ env.BUILD_DIR }}/openvino_package.tar.gz
          if-no-files-found: 'error'

      - name: Upload openvino tests
        uses: ababushk/upload-artifact@ebc7d74ace101c08868aed05dba2aaf274b9a2c7 # main
        with:
          name: openvino_tests${{ inputs.artifacts-suffix }}
          path: ${{ env.BUILD_DIR }}/openvino_tests.tar.gz
          if-no-files-found: 'error'
