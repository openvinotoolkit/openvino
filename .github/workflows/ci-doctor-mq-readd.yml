name: CI Doctor MQ Re-add

on:
  pull_request_target:
    types: [dequeued]
  workflow_run:
    workflows: ["CI Failure Doctor — Merge Queue"]
    types: [completed]

concurrency:
  group: ci-doctor-mq-readd-${{ github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  readd:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'workflow_run' &&
      (github.event.workflow_run.conclusion == 'success' ||
      github.event.workflow_run.conclusion == 'failure'))
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Checkout trusted workflow scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts/agentic-workflows
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install PyGithub
        run: python -m pip install --quiet PyGithub==2.9.1

      - name: Validate marker and re-add PR if eligible
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MERGE_QUEUE_TOKEN: ${{ secrets.MERGE_QUEUE_TOKEN }}
        run: |
          export PYTHONPATH=.github/scripts/agentic-workflows/:${PYTHONPATH}
          python .github/scripts/agentic-workflows/readd_transient_failure.py

      - name: Re-add to merge queue was triggered
        if: ${{ env.READDED_TO_MQ == 'true' }}
        run: echo "CI Doctor re-added the transient PR to the merge queue."
