name: Windows (VS 2026, Clang-CL, Python 3.14, Release)
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    branches: [ master, main ]

env:
  PYTHON_VERSION: '3.14'

permissions: read-all

jobs:
  build:
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: recursive

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: ./.github/actions/setup_python
        with:
          version: ${{ env.PYTHON_VERSION }}
          allow-prereleases: 'true'
          use-pip-proxy: 'true'
          self-hosted-runner: 'false'

      - name: Install python dependencies
        run: |
          python3 -m pip install -r .\src\bindings\python\wheel\requirements-dev.txt

      - name: Configure CMake
        run: |
          cmake -S . -B build-clang-cl -G "Visual Studio 18 2026" `
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON `
            -T ClangCL
      - name: Build
        run: cmake --build build-clang-cl --config Release --parallel 4
