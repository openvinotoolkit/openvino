name: Code coverage
run-name: ${{ github.event_name == 'schedule' && 'Code coverage - Nightly' || 'Code coverage' }}
on:
  pull_request:
  schedule:
    # run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      run-cpu-tests:
        description: 'Run the standard CPU coverage lanes'
        type: boolean
        required: false
        default: true
      run-gpu-tests:
        description: 'Build with GPU support and run the GPU coverage lanes'
        type: boolean
        required: false
        default: true
      run-npu-tests:
        description: 'Build Windows VS2022 coverage and run NPU unit tests (hardware and offline)'
        type: boolean
        required: false
        default: true

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.run_id || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: false

permissions: read-all

env:
  ENABLE_BRANCH_COVERAGE: 'false'
  LCOV_CAPTURE_TIMEOUT_SECONDS: '3600'
  NODE_VERSION: '22'
  NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/IntelProxyRootCA-Base64.crt
  IGPU_DRIVER_PACKAGES: |-
    https://github.com/intel/intel-graphics-compiler/releases/download/igc-1.0.15985.7/intel-igc-core_1.0.15985.7_amd64.deb
    https://github.com/intel/intel-graphics-compiler/releases/download/igc-1.0.15985.7/intel-igc-opencl_1.0.15985.7_amd64.deb
    https://github.com/intel/compute-runtime/releases/download/24.05.28454.6/intel-level-zero-gpu_1.3.28454.6_amd64.deb
    https://github.com/intel/compute-runtime/releases/download/24.05.28454.6/intel-opencl-icd_24.05.28454.6_amd64.deb
    https://github.com/intel/compute-runtime/releases/download/24.05.28454.6/libigdgmm12_22.3.11_amd64.deb
  DGPU_DRIVER_PACKAGES: |-
    https://github.com/intel/intel-graphics-compiler/releases/download/igc-1.0.17791.9/intel-igc-core_1.0.17791.9_amd64.deb
    https://github.com/intel/intel-graphics-compiler/releases/download/igc-1.0.17791.9/intel-igc-opencl_1.0.17791.9_amd64.deb
    https://github.com/intel/compute-runtime/releases/download/24.39.31294.12/intel-level-zero-gpu_1.6.31294.12_amd64.deb
    https://github.com/intel/compute-runtime/releases/download/24.39.31294.12/intel-opencl-icd_24.39.31294.12_amd64.deb
    https://github.com/intel/compute-runtime/releases/download/24.39.31294.12/libigdgmm12_22.5.2_amd64.deb

jobs:
  Docker:
    name: Coverage Docker Images
    if: ${{ github.event_name == 'schedule' || github.event.inputs.run-cpu-tests == 'true' || github.event.inputs.run-gpu-tests == 'true' }}
    runs-on: aks-linux-4-cores-16gb-docker-build
    container:
      image: openvinogithubactions.azurecr.io/docker_build:0.2
      volumes:
        - /mount:/mount
    outputs:
      images: ${{ steps.handle_docker.outputs.images }}
    steps:
      - name: Checkout
        uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b # cherry_pick_retries
        timeout-minutes: 15

      - uses: ./.github/actions/handle_docker
        id: handle_docker
        with:
          images: |
            ov_build/ubuntu_22_04_x64
            ov_test/ubuntu_22_04_x64
            ov_test/ubuntu_22_04_x64_igpu
          registry: 'openvinogithubactions.azurecr.io'
          dockerfiles_root_dir: '.github/dockerfiles'
          changed_components: '{"docker_env":false,"dockerfiles":false}'

  Build:
    name: Coverage Build Artifacts
    needs: Docker
    if: ${{ github.event_name == 'schedule' || github.event.inputs.run-cpu-tests == 'true' || github.event.inputs.run-gpu-tests == 'true' }}
    uses: ./.github/workflows/job_build_linux.yml
    with:
      runner: 'aks-linux-16-cores-32gb'
      cmake-build-parallel-level: '15'
      image: ${{ fromJSON(needs.Docker.outputs.images).ov_build.ubuntu_22_04_x64 }}
      affected-components: '{"JS_API":true}'
      event-name: ${{ github.event_name }}
      os: 'ubuntu_22_04'
      build-js: true
      build-additional-python-packages: false
      build-debian-packages: false
      upload-coverage-notes: true
      use_latest_onednn: false
      cmake-options: >-
        -G 'Ninja Multi-Config'
        -DENABLE_NCC_STYLE=OFF
        -DENABLE_TESTS=ON
        -DENABLE_FUNCTIONAL_TESTS=ON
        -DENABLE_STRICT_DEPENDENCIES=OFF
        -DENABLE_SYSTEM_OPENCL=ON
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        -DCPACK_GENERATOR=TGZ
        -DENABLE_WHEEL=ON
        -DENABLE_PYTHON=ON
        -DENABLE_JS=ON
        -DENABLE_COVERAGE=ON
        -DENABLE_OV_ONNX_FRONTEND=ON
        -DENABLE_OV_PADDLE_FRONTEND=ON
        -DENABLE_OV_PYTORCH_FRONTEND=ON
        -DENABLE_OV_TF_FRONTEND=ON
        -DENABLE_OV_TF_LITE_FRONTEND=ON
        -DENABLE_INTEL_NPU=OFF
        ${{ (github.event_name == 'schedule' || github.event.inputs.run-gpu-tests == 'true') && '-DENABLE_INTEL_GPU=ON' || '-DENABLE_INTEL_GPU=OFF' }}
        ${{ (github.event_name == 'schedule' || github.event.inputs.run-gpu-tests == 'true') && '-DENABLE_ONEDNN_FOR_GPU=ON' || '-DENABLE_ONEDNN_FOR_GPU=OFF' }}

  BuildWindows:
    name: Coverage Windows Build Artifacts
    if: ${{ github.event_name == 'schedule' || github.event_name == 'pull_request' || inputs.run-npu-tests }}
    uses: ./.github/workflows/job_build_windows.yml
    with:
      runner: 'aks-win-16-cores-32gb-build'
      cmake-build-parallel-level: '15'
      affected-components: '{"JS_API":false}'
      build-type: 'Release'
      target-branch: ${{ github.base_ref || github.ref_name }}
      build-variant: 'vs2022'
      build-additional-python-wheels: false
      enable-coverage: true
      save-cache: >-
        ${{ github.event_name == 'pull_request' ||
            ((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
             github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) }}
      cmake-options: >-
        -G 'Ninja Multi-Config'
        -DENABLE_PYTHON=ON
        -DENABLE_WHEEL=OFF
        -DENABLE_TESTS=ON
        -DENABLE_INTEL_NPU=ON
        -DENABLE_INTEL_CPU=ON
        -DENABLE_INTEL_GPU=OFF
        -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
        -DENABLE_STRICT_DEPENDENCIES=OFF
        -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON
        -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        -DFETCHCONTENT_BASE_DIR="C:\fcc\ninja_multi_config"

  CoverageWindows:
    name: Coverage Windows (${{ matrix.lane }})
    needs: BuildWindows
    if: ${{ github.event_name == 'schedule' || github.event_name == 'pull_request' || inputs.run-npu-tests }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: npu
            runner: '["self-hosted", "Windows", "npu", "coverage"]'
            ca-bundle: 'C:\certs\IntelProxyRootCA.crt'
          - lane: npu-offline
            runner: '["aks-win-4-cores-8gb-test"]'
            ca-bundle: ''
    runs-on: ${{ fromJSON(matrix.runner) }}
    defaults:
      run:
        shell: pwsh
    env:
      INSTALL_DIR: ${{ github.workspace }}/.tmp/windows-package-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
      WINDOWS_ARTIFACT_DIR: ${{ github.workspace }}/.tmp/windows-results-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.lane }}
      COVERAGE_LANE: ${{ matrix.lane }}
      CA_CERTS: ${{ matrix.ca-bundle }}
      NODE_EXTRA_CA_CERTS: ''
      PYTHONUTF8: '1'
    steps:
      - name: Configure corporate proxy certificates
        if: ${{ env.CA_CERTS != '' }}
        run: |
          if (!(Test-Path -LiteralPath $env:CA_CERTS -PathType Leaf)) {
            throw "Corporate proxy CA bundle not found: $env:CA_CERTS"
          }
          foreach ($variable in @('SSL_CERT_FILE', 'CURL_CA_BUNDLE', 'REQUESTS_CA_BUNDLE', 'NODE_EXTRA_CA_CERTS')) {
            "$variable=$env:CA_CERTS" >> $env:GITHUB_ENV
          }

      - name: Checkout sources
        uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b # cherry_pick_retries
        timeout-minutes: 15

      - name: Setup Python 3.11
        uses: ./.github/actions/setup_python
        with:
          version: '3.11'
          self-hosted-runner: 'true'
          use-pip-proxy: ${{ matrix.lane == 'npu-offline' }}

      - name: Prepare Windows coverage tools
        run: |
          python -m pip install -r .github/actions/coverage_toolkit/requirements-ci.txt
          if ($LASTEXITCODE -ne 0) { throw "Cannot install coverage reporting dependencies" }
          if (Test-Path "$env:INSTALL_DIR") { throw "Coverage package directory already exists: $env:INSTALL_DIR" }
          New-Item -ItemType Directory -Path "$env:INSTALL_DIR" | Out-Null
          New-Item -ItemType Directory -Force -Path .tmp/windows-coverage | Out-Null

          $collector = Get-Command Microsoft.CodeCoverage.Console.exe -ErrorAction SilentlyContinue
          if ($collector) {
            $collectorPath = $collector.Source
          } else {
            $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
            if (!(Test-Path $vswhere)) { throw "Install Microsoft.CodeCoverage.Console on this runner" }
            $candidates = @(& $vswhere -latest -products '*' -find 'Common7\IDE\Extensions\Microsoft\CodeCoverage.Console\Microsoft.CodeCoverage.Console.exe')
            if ($LASTEXITCODE -ne 0 -or $candidates.Count -ne 1) {
              throw "Cannot locate Microsoft.CodeCoverage.Console in Visual Studio"
            }
            $collectorPath = $candidates[0]
          }
          "COVERAGE_COLLECTOR=$collectorPath" >> $env:GITHUB_ENV

      - name: Download Windows package
        uses: akashchi/download-artifact@d59a9c15fec3fdb7c9adf09464124d00f9c11415 # main
        with:
          name: openvino_package_windows_coverage
          path: ${{ env.INSTALL_DIR }}

      - name: Download Windows tests
        uses: akashchi/download-artifact@d59a9c15fec3fdb7c9adf09464124d00f9c11415 # main
        with:
          name: openvino_tests_windows_coverage
          path: ${{ env.INSTALL_DIR }}

      - name: Download Windows symbols
        uses: akashchi/download-artifact@d59a9c15fec3fdb7c9adf09464124d00f9c11415 # main
        with:
          name: openvino_pdb_windows_coverage
          path: ${{ env.INSTALL_DIR }}

      - name: Download coverage build identity
        uses: akashchi/download-artifact@d59a9c15fec3fdb7c9adf09464124d00f9c11415 # main
        with:
          name: coverage_build_windows
          path: ${{ env.INSTALL_DIR }}

      - name: Run Windows NPU coverage
        run: |
          foreach ($archive in @('openvino_package.zip', 'openvino_tests.zip', 'openvino_pdb.zip')) {
            Expand-Archive -LiteralPath "$env:INSTALL_DIR/$archive" -DestinationPath "$env:INSTALL_DIR" -Force
          }
          . "$env:INSTALL_DIR/setupvars.ps1" -python_version 3.11
          Get-CimInstance Win32_PnPSignedDriver |
            Where-Object { $_.DeviceName -match 'NPU|Neural' } |
            Select-Object DeviceName, DriverVersion, DriverProviderName |
            ConvertTo-Json | Set-Content .tmp/windows-coverage/drivers.json
          python .github/actions/coverage_toolkit/windows_coverage.py `
            --workspace "$env:GITHUB_WORKSPACE" --install-dir "$env:INSTALL_DIR" `
            --collector "$env:COVERAGE_COLLECTOR" --lane "$env:COVERAGE_LANE"
          if ($LASTEXITCODE -ne 0) { throw "Windows coverage failed" }

      - name: Verify Windows coverage outputs
        run: |
          foreach ($file in @('windows-coverage.xml', 'windows-coverage-stats.env', 'windows-test-durations.csv')) {
            if (!(Test-Path -LiteralPath $file)) { throw "Missing Windows coverage output: $file" }
          }
          if (!(Select-String -Path windows-coverage-stats.env -Pattern '^CXX_TESTS_PASSED=1$' -Quiet)) {
            throw "Windows coverage did not complete successfully"
          }

      - name: Collect Windows results
        id: windows_artifact
        if: ${{ always() }}
        run: |
          python .github/actions/coverage_toolkit/ci_reports.py collect-suite-results `
            --workspace "$env:GITHUB_WORKSPACE" --suite windows `
            --profile "$env:COVERAGE_LANE" --lane "$env:COVERAGE_LANE" `
            --artifact-dir "$env:WINDOWS_ARTIFACT_DIR" `
            --outputs-file "$env:GITHUB_OUTPUT"
          if ($LASTEXITCODE -ne 0) { throw "Cannot collect Windows coverage results" }

      - name: Upload Windows results
        if: ${{ always() && steps.windows_artifact.outcome == 'success' }}
        uses: ababushk/upload-artifact@ebc7d74ace101c08868aed05dba2aaf274b9a2c7 # main
        with:
          name: ${{ steps.windows_artifact.outputs['artifact-name'] }}
          path: ${{ steps.windows_artifact.outputs.dir }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          overwrite: true

      - name: Remove working copy of instrumented package
        if: ${{ always() }}
        run: |
          if (Test-Path -LiteralPath "$env:INSTALL_DIR") {
            Remove-Item -LiteralPath "$env:INSTALL_DIR" -Recurse -Force
          }

  CoverageCpp:
    name: Coverage C++ (CPU)
    needs: [Docker, Build]
    if: ${{ github.event_name == 'schedule' || github.event.inputs.run-cpu-tests == 'true' }}
    runs-on: aks-linux-16-cores-32gb
    container:
      image: ${{ fromJSON(needs.Docker.outputs.images).ov_test.ubuntu_22_04_x64 }}
      volumes:
        - /usr/local/share/ca-certificates:/usr/local/share/ca-certificates:ro
        - /mount:/mount
        - ${{ github.workspace }}:${{ github.workspace }}
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    env:
      TEST_PROFILE: cpu
      OV_WORKSPACE: ${{ github.workspace }}
      INSTALL_DIR: ${{ github.workspace }}/install
      INSTALL_TEST_DIR: ${{ github.workspace }}/install/tests
      INSTALL_PKG_DIR: ${{ github.workspace }}/install
      BIN_DIR: ${{ github.workspace }}/install/tests
      BUILD_DIR: ${{ github.workspace }}/openvino/openvino_build
      BUILD_JS_DIR: ${{ github.workspace }}/openvino/openvino_build_js
      COVERAGE_WRITE_STEP_SUMMARY: 'false'
    steps:
      - name: Checkout sources
        uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b # cherry_pick_retries
        timeout-minutes: 15
        with:
          submodules: 'true'

      - name: Download OpenVINO package
        uses: akashchi/download-artifact@d59a9c15fec3fdb7c9adf09464124d00f9c11415 # main
        with:
          name: openvino_package
          path: ${{ env.INSTALL_DIR }}

      - name: Download OpenVINO tests
        uses: akashchi/download-artifact@d59a9c15fec3fdb7c9adf09464124d00f9c11415 # main
        with:
          name: openvino_tests
          path: ${{ env.INSTALL_DIR }}

      - name: Download coverage build notes
        uses: akashchi/download-artifact@d59a9c15fec3fdb7c9adf09464124d00f9c11415 # main
        with:
          name: coverage_build_notes
          path: ${{ github.workspace }}/coverage_notes

      - name: Extract OpenVINO packages
        run: |
          pigz -dc openvino_package.tar.gz | tar -xf - -C "${INSTALL_DIR}"
          pigz -dc openvino_tests.tar.gz | tar -xf - -C "${INSTALL_DIR}"
        working-directory: ${{ env.INSTALL_DIR }}

      - name: Restore coverage notes
        run: |
          set -euo pipefail
          notes_root="${{ github.workspace }}/coverage_notes"
          if [[ -d "${notes_root}/coverage_build_notes" ]]; then
            notes_root="${notes_root}/coverage_build_notes"
          fi
          rm -rf "${BUILD_DIR}" "${BUILD_JS_DIR}"
          mkdir -p "${BUILD_DIR}" "${BUILD_JS_DIR}"
          cp -a "${notes_root}/main-build/." "${BUILD_DIR}/"
          if [[ -d "${notes_root}/js-build" ]]; then
            cp -a "${notes_root}/js-build/." "${BUILD_JS_DIR}/"
          fi

      - name: Setup Python 3.11
        uses: ./.github/actions/setup_python
        with:
          version: '3.11'
          use-pip-proxy: 'true'
          set-pip-install-path: 'true'
          self-hosted-runner: 'true'

      - name: Install coverage Python dependencies
        uses: ./.github/actions/coverage_toolkit
        with:
          command: install-requirements

      - name: Run CPU C++ coverage tests
        uses: ./.github/actions/coverage_toolkit
        with:
          command: run-suite
          suite: cpp
          profile: cpu
          lane: cpu

      - name: Generate CPU native C/C++ coverage report
        uses: ./.github/actions/coverage_toolkit
        with:
          command: collect-native
          profile: cpu

      - name: Collect C++ CPU results
        id: cpu_artifact
        if: ${{ always() }}
        uses: ./.github/actions/coverage_toolkit
        with:
          command: collect-results
          suite: cpp
          profile: cpu
          lane: cpu

      - name: Upload C++ CPU artifact
        if: ${{ always() }}
        uses: ababushk/upload-artifact@ebc7d74ace101c08868aed05dba2aaf274b9a2c7 # main
        with:
          name: ${{ steps.cpu_artifact.outputs['artifact-name'] }}
          path: ${{ steps.cpu_artifact.outputs.dir }}
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
          overwrite: true

  CoverageCppGpu:
    name: Coverage C++ (${{ matrix.gpu.name }}, ${{ matrix.lane.name }})
    needs: [ Build, Docker ]
    if: ${{ github.event_name == 'schedule' || github.event.inputs.run-gpu-tests == 'true' }}
    runs-on: ${{ fromJSON(matrix.gpu.runs_on) }}
    container:
      image: ${{ fromJSON(needs.docker.outputs.images).ov_test.ubuntu_22_04_x64_igpu }}
      volumes:
        - /usr/local/share/ca-certificates:/usr/local/share/ca-certificates:ro
        - /mount:/mount
        - ${{ github.workspace }}:${{ github.workspace }}
      options: ${{ matrix.gpu.container_options }}
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        gpu:
          - id: igpu
            name: iGPU
            runs_on: '["self-hosted","igpu","Linux"]'
            container_options: "--group-add 44 --group-add 993 --device /dev/dri/renderD128:/dev/dri/renderD128"
          - id: dgpu
            name: dGPU Arc A770
            runs_on: '["self-hosted","dgpu","Arc-A770","Linux"]'
            container_options: "--group-add 44 --group-add 993 --device /dev/dri/renderD129:/dev/dri/renderD129"
        lane:
          - id: unit
            name: GPU Unit Tests
            test_names: ov_onnx_frontend_tests,ov_onnx_frontend_tests (ONNX_ITERATOR=0),ov_gpu_unit_tests,test_inference_async,test_inference_sync
          - id: func
            name: GPU Functional Tests
            test_names: ov_gpu_func_tests
    defaults:
      run:
        shell: bash
        working-directory: ${{ github.workspace }}
    env:
      TEST_PROFILE: gpu
      CXX_TEST_NAMES: ${{ matrix.lane.test_names }}
      OV_WORKSPACE: ${{ github.workspace }}
      INSTALL_DIR: ${{ github.workspace }}/install
      INSTALL_TEST_DIR: ${{ github.workspace }}/install/tests
      INSTALL_PKG_DIR: ${{ github.workspace }}/install
      BIN_DIR: ${{ github.workspace }}/install/tests
      BUILD_DIR: ${{ github.workspace }}/openvino/openvino_build
      BUILD_JS_DIR: ${{ github.workspace }}/openvino/openvino_build_js
      COVERAGE_WRITE_STEP_SUMMARY: 'false'
      PYTHONDONTWRITEBYTECODE: '1'
      PIP_CERT: /usr/local/share/ca-certificates/IntelProxyRootCA-Base64.crt
      REQUESTS_CA_BUNDLE: /usr/local/share/ca-certificates/IntelProxyRootCA-Base64.crt
    steps:
      - name: Prepare ${{ matrix.gpu.name }} test container
        run: |
          apt-get update && update-ca-certificates
        env:
          DEBIAN_FRONTEND: noninteractive
          TZ: "Europe/London"

      - name: Checkout sources
        uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b # cherry_pick_retries
        timeout-minutes: 15
        with:
          submodules: 'true'

      - name: Download OpenVINO package
        uses: akashchi/download-artifact@d59a9c15fec3fdb7c9adf09464124d00f9c11415 # main
        with:
          name: openvino_package
          path: ${{ env.INSTALL_DIR }}

      - name: Download OpenVINO tests
        uses: akashchi/download-artifact@d59a9c15fec3fdb7c9adf09464124d00f9c11415 # main
        with:
          name: openvino_tests
          path: ${{ env.INSTALL_DIR }}

      - name: Download coverage build notes
        uses: akashchi/download-artifact@d59a9c15fec3fdb7c9adf09464124d00f9c11415 # main
        with:
          name: coverage_build_notes
          path: ${{ github.workspace }}/coverage_notes

      - name: Extract OpenVINO packages
        run: |
          pigz -dc openvino_package.tar.gz | tar -xf - -C "${INSTALL_DIR}"
          pigz -dc openvino_tests.tar.gz | tar -xf - -C "${INSTALL_DIR}"
        working-directory: ${{ env.INSTALL_DIR }}

      - name: Install GPU driver dependencies
        run: |
          set -euo pipefail
          "${INSTALL_DIR}/install_dependencies/install_openvino_dependencies.sh" -c=core -c=dev -c=gpu -y

          case "${{ matrix.gpu.id }}" in
            igpu)
              driver_packages="${IGPU_DRIVER_PACKAGES}"
              ;;
            dgpu)
              driver_packages="${DGPU_DRIVER_PACKAGES}"
              ;;
            *)
              echo "Unsupported GPU device '${{ matrix.gpu.id }}'"
              exit 1
              ;;
          esac

          tmp_dir="$(mktemp -d)"
          trap 'rm -rf "${tmp_dir}"' EXIT
          pushd "${tmp_dir}"
          while IFS= read -r package_url; do
            [[ -n "${package_url}" ]] || continue
            wget "${package_url}"
          done <<< "${driver_packages}"
          dpkg -i *.deb
          popd

      - name: Verify GPU device availability
        timeout-minutes: 5
        run: clinfo

      - name: Restore coverage notes
        run: |
          set -euo pipefail
          notes_root="${{ github.workspace }}/coverage_notes"
          if [[ -d "${notes_root}/coverage_build_notes" ]]; then
            notes_root="${notes_root}/coverage_build_notes"
          fi
          rm -rf "${BUILD_DIR}" "${BUILD_JS_DIR}"
          mkdir -p "${BUILD_DIR}" "${BUILD_JS_DIR}"
          cp -a "${notes_root}/main-build/." "${BUILD_DIR}/"
          if [[ -d "${notes_root}/js-build" ]]; then
            cp -a "${notes_root}/js-build/." "${BUILD_JS_DIR}/"
          fi

      - name: Setup Python 3.11
        uses: ./.github/actions/setup_python
        with:
          version: '3.11'
          use-pip-proxy: 'false'
          set-pip-install-path: 'true'
          self-hosted-runner: 'true'

      - name: Install coverage Python dependencies
        uses: ./.github/actions/coverage_toolkit
        with:
          command: install-requirements

      - name: Run ${{ matrix.gpu.name }} ${{ matrix.lane.name }} C++ coverage tests
        uses: ./.github/actions/coverage_toolkit
        with:
          command: run-suite
          suite: cpp
          profile: gpu
          lane: ${{ matrix.gpu.id }}-${{ matrix.lane.id }}
          test-names: ${{ matrix.lane.test_names }}

      - name: Generate ${{ matrix.gpu.name }} ${{ matrix.lane.name }} native C/C++ coverage report
        uses: ./.github/actions/coverage_toolkit
        with:
          command: collect-native
          profile: gpu

      - name: Collect C++ ${{ matrix.gpu.name }} ${{ matrix.lane.name }} results
        id: lane_artifact
        if: ${{ always() }}
        uses: ./.github/actions/coverage_toolkit
        with:
          command: collect-results
          suite: cpp
          profile: gpu
