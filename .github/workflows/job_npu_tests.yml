name: NPU tests

on:
  workflow_call:
    inputs:
      runner:
        description: 'JSON runs-on value: list of labels or {"group": ..., "labels": [...]}. e.g. ["aks-win-4-cores-8gb-test"]'
        type: string
        required: true
      mode:
        description: 'compile: offline compilation for each NPU platform, no device needed. infer: compile, infer and compare on a host with a real NPU of that platform'
        type: string
        required: false
        default: 'compile'
      affected-components:
        description: 'Components that are affected by changes in the commit defined by the Smart CI Action'
        type: string
        required: false
        default: '{"NPU":{"test":true},"TF_FE":{"test":true},"JAX_FE":{"test":true},"PyTorch_FE":{"test":true}}'
      changed-components:
        description: 'Components that have changed in the commit defined by the Smart CI Action'
        type: string
        required: false
        default: '{}'
      npu-platforms:
        description: 'JSON list of NPU platforms, each runs on its own runner. In infer mode the runner must have that NPU. e.g. ["3720","4000","5010","5020","6010"]'
        type: string
        required: false
        default: '["3720","4000","5010","5020","6010"]'
      model-scope:
        description: 'Scope of models for testing (pytest marker)'
        type: string
        required: false
        default: 'precommit'

permissions: read-all

env:
  PYTHON_VERSION: '3.11'
  HF_HUB_CACHE_WIN: "C:\\mount\\caches\\huggingface"
  HF_TOKEN_PATH_WIN: "C:\\mount\\secrets\\huggingface\\token-secondary"
  # To debug NPU compiler, set OV_NPU_LOG_LEVEL=LOG_INFO or higher
  # OV_NPU_LOG_LEVEL: 'LOG_INFO'

jobs:
  NPU_Models_Tests:
    name: ${{ matrix.npu-platform }}
    timeout-minutes: ${{ inputs.mode == 'infer' && 90 || 40 }}
    strategy:
      # one runner per NPU platform; keep going even if one platform fails.
      fail-fast: false
      matrix:
        npu-platform: ${{ fromJSON(inputs.npu-platforms) }}
    defaults:
      run:
        # the NPU hosts have no pwsh
        shell: powershell
    runs-on: ${{ fromJSON(inputs.runner) }}
    env:
      INSTALL_DIR: "${{ github.workspace }}\\install"
      INSTALL_TEST_DIR: "${{ github.workspace }}\\install\\tests"
      INSTALL_WHEELS_DIR: "${{ github.workspace }}\\install\\wheels"
      TEST_DEVICE: 'NPU'
      NPU_PLATFORM: ${{ matrix.npu-platform }}
      NPU_TEST_MODE: ${{ inputs.mode }}
      MODEL_SCOPE: ${{ inputs.model-scope }}
      # Force UTF-8 stdio so third-party progress bars (e.g. easyocr's block
      # glyph) don't crash on the cp1252 Windows console.
      PYTHONUTF8: '1'
      # the NPU hosts are behind a TLS-intercepting proxy
      PROXY_CA: ${{ !contains(inputs.runner, 'aks') && 'C:\certs\IntelProxyRootCA.crt' || '' }}
      NODE_EXTRA_CA_CERTS: ${{ !contains(inputs.runner, 'aks') && 'C:\certs\IntelProxyRootCA.crt' || '' }}
    steps:
      # the work dir cleanup hook on the NPU hosts is not reliable
      - name: Remove leftovers of previous jobs
        run: |
          Get-Process python* -ErrorAction SilentlyContinue | Format-Table -AutoSize Id, ProcessName, StartTime, Path
          Get-ChildItem -Force -Path "${{ github.workspace }}" | Remove-Item -Recurse -Force

      # RUNNER_TEMP is emptied by the runner after every job, the user profile is not
      - name: Keep temp files and caches inside the job
        if: ${{ !contains(inputs.runner, 'aks') }}
        run: |
          $cache = "$env:RUNNER_TEMP\cache"
          $dirs = [ordered]@{
            TEMP = "$env:RUNNER_TEMP\tmp"
            TMP = "$env:RUNNER_TEMP\tmp"
            XDG_CACHE_HOME = $cache
            PIP_CACHE_DIR = "$cache\pip"
            HF_HOME = "$cache\huggingface"
            HF_HUB_CACHE = "$cache\huggingface\hub"
            HUGGINGFACE_HUB_CACHE = "$cache\huggingface\hub"
            TFHUB_CACHE_DIR = "$cache\tfhub_modules"
            KAGGLEHUB_CACHE = "$cache\kagglehub"
            TORCH_HOME = "$cache\torch"
            EASYOCR_MODULE_PATH = "$cache\easyocr"
          }
          foreach ($var in $dirs.Keys) {
            New-Item -ItemType Directory -Force -Path $dirs[$var] | Out-Null
            Add-Content -Path $env:GITHUB_ENV -Value "$var=$($dirs[$var])"
          }

      - name: Download OpenVINO artifacts (tests)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openvino_tests
          path: ${{ env.INSTALL_DIR }}
          merge-multiple: true

      - name: Download OpenVINO artifacts (wheels)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openvino_wheels
          path: ${{ env.INSTALL_WHEELS_DIR }}
          merge-multiple: true

      - name: Setup Variables
        run: |
          if (Test-Path "${{ env.HF_HUB_CACHE_WIN }}") {
            Add-Content -Path $env:GITHUB_ENV -Value "HF_HUB_CACHE=${{ env.HF_HUB_CACHE_WIN }}"
            Add-Content -Path $env:GITHUB_ENV -Value "HUGGINGFACE_HUB_CACHE=${{ env.HF_HUB_CACHE_WIN }}"
          }
          if (Test-Path "${{ env.HF_TOKEN_PATH_WIN }}") {
            Add-Content -Path $env:GITHUB_ENV -Value "HF_TOKEN_PATH=${{ env.HF_TOKEN_PATH_WIN }}"
          } else {
            Write-Host "::warning::No HF token at ${{ env.HF_TOKEN_PATH_WIN }}, downloading anonymously (rate limited)"
          }

      - name: Extract OpenVINO tests package
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Expand-Archive openvino_tests.zip -DestinationPath .
        working-directory: ${{ env.INSTALL_DIR }}

      # the NPU hosts have no git, so checkout would download and fail to extract the whole repo
      - name: Fetch setup_python action
        if: ${{ contains(inputs.runner, 'aks') }}
        uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b # cherry_pick_retries
        timeout-minutes: 15
        with:
          sparse-checkout: |
            .github/actions/setup_python/action.yml
          sparse-checkout-cone-mode: false
          path: 'openvino'

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        if: ${{ contains(inputs.runner, 'aks') }}
        uses: ./openvino/.github/actions/setup_python
        with:
          version: ${{ env.PYTHON_VERSION }}
          set-pip-install-path: 'false'
          self-hosted-runner: 'true'
          use-pip-proxy: 'true'

      - name: Setup Python ${{ env.PYTHON_VERSION }} (NPU hosts)
        if: ${{ !contains(inputs.runner, 'aks') }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        env:
          SSL_CERT_FILE: ${{ env.PROXY_CA }}
          REQUESTS_CA_BUNDLE: ${{ env.PROXY_CA }}
          CURL_CA_BUNDLE: ${{ env.PROXY_CA }}
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Trust the proxy root CA in Python
        if: ${{ env.PROXY_CA != '' }}
        run: |
          $bundle = Join-Path $env:RUNNER_TEMP 'ca-bundle.pem'
          $publicCa = python3 -c "import pip._vendor.certifi as c; print(c.where())"
          Get-Content $publicCa, $env:PROXY_CA | Set-Content -Encoding ascii $bundle
          foreach ($var in 'SSL_CERT_FILE', 'REQUESTS_CA_BUNDLE', 'CURL_CA_BUNDLE', 'PIP_CERT') {
            Add-Content -Path $env:GITHUB_ENV -Value "$var=$bundle"
          }

      - name: Create Python virtual environment
        run: |
          $venv = Join-Path $env:RUNNER_TEMP 'venv'
          python3 -m venv $venv
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Copy-Item "$venv\Scripts\python.exe" "$venv\Scripts\python3.exe"
          Add-Content -Path $env:GITHUB_PATH -Value "$venv\Scripts"
          Add-Content -Path $env:GITHUB_ENV -Value "VIRTUAL_ENV=$venv"

      - name: Install OpenVINO Python wheel
        run: |
          $py = python3 -c "import sys; print(f'cp{sys.version_info.major}{sys.version_info.minor}')"
          $wheel = Get-ChildItem -Path $env:INSTALL_WHEELS_DIR -Filter "openvino-*-$py-*.whl" | Select-Object -First 1
          if (-not $wheel) { throw "No openvino wheel for $py in $env:INSTALL_WHEELS_DIR" }
          python3 -m pip install $wheel.FullName

      - name: Install certifi and set SSL_CERT_FILE for model downloading
        if: ${{ env.SSL_CERT_FILE == '' }}
        run: |
          python3 -m pip install certifi
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_ENV -Value "SSL_CERT_FILE=$(python3 -m certifi)"

      # --- Diagnostics on the NPU hosts, while the job is being brought up ----
      - name: 'Diagnostics: environment'
        if: ${{ inputs.mode == 'infer' }}
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "DIAG_JOB_START=$(Get-Date -Format o)"
          Add-Content -Path $env:GITHUB_ENV -Value "OV_NPU_LOG_LEVEL=LOG_WARNING"
          Add-Content -Path $env:GITHUB_ENV -Value "PYTHONFAULTHANDLER=1"
          Add-Content -Path $env:GITHUB_ENV -Value "PYTEST_ADDOPTS=--durations=30"

          $os = Get-CimInstance Win32_OperatingSystem
          "{0} (build {1})" -f $os.Caption, $os.BuildNumber
          "RAM: {0:N1} GB, free {1:N1} GB" -f ($os.TotalVisibleMemorySize / 1MB), ($os.FreePhysicalMemory / 1MB)
          "Disk C: free {0:N1} GB" -f ((Get-PSDrive C).Free / 1GB)
          "Runner user: $env:USERNAME, profile: $env:USERPROFILE"

          "--- proxy variables"
          Get-ChildItem env: | Where-Object Name -match 'proxy' | Format-Table -AutoSize Name, Value

          "--- Python"
          (Get-Command python3).Source
          python3 -c "import sys; print(sys.version); print('venv' if sys.prefix != sys.base_prefix else 'NOT A VENV', sys.prefix)"
          python3 -m pip --version
          python3 -m pip config list

          "--- temp and cache locations"
          foreach ($var in 'TEMP', 'XDG_CACHE_HOME', 'PIP_CACHE_DIR', 'HF_HOME', 'HF_HUB_CACHE', 'TFHUB_CACHE_DIR', 'KAGGLEHUB_CACHE', 'TORCH_HOME', 'EASYOCR_MODULE_PATH', 'HF_TOKEN_PATH') {
            "{0,-20} {1}" -f $var, [Environment]::GetEnvironmentVariable($var)
          }

      - name: 'Diagnostics: network'
        if: ${{ inputs.mode == 'infer' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          @'
          import time
          import urllib.error
          import urllib.request

          # pip, model hubs and weight downloads used by the TF, JAX and PyTorch NPU suites
          urls = [
              "https://pypi.org/simple/pip/",
              "https://files.pythonhosted.org/",
              "https://huggingface.co/api/models/bert-base-uncased",
              "https://cas-bridge.xethub.hf.co/",
              "https://cdn-lfs.hf.co/",
              "https://www.kaggle.com/",
              "https://storage.googleapis.com/",
              "https://tfhub.dev/",
              "https://storage.openvinotoolkit.org/",
              "https://download.pytorch.org/models/",
              "https://github.com/JaidedAI/EasyOCR/releases",
              "https://objects.githubusercontent.com/",
              "https://release-assets.githubusercontent.com/",
          ]
          for url in urls:
              start = time.time()
              try:
                  request = urllib.request.Request(url, method="HEAD", headers={"User-Agent": "openvino-ci"})
                  with urllib.request.urlopen(request, timeout=20) as response:
                      result = f"OK   {response.status}"
              except urllib.error.HTTPError as e:
                  result = f"HTTP {e.code}"
              except Exception as e:
                  result = f"FAIL {e!r}"
              print(f"{time.time() - start:5.1f}s  {url}  {result}")
          '@ | python3 -

      - name: Check NPU device
        if: ${{ inputs.mode == 'infer' }}
        timeout-minutes: 5
        env:
          PYTHONUNBUFFERED: '1'
          OV_NPU_LOG_LEVEL: 'LOG_INFO'
        run: |
          (Get-CimInstance Win32_Processor).Name
          Get-PnpDevice -PresentOnly -Class ComputeAccelerator -ErrorAction SilentlyContinue | Format-List Status, FriendlyName, InstanceId
          Get-CimInstance Win32_PnPSignedDriver -Filter "DeviceClass = 'COMPUTEACCELERATOR'" | Format-List DeviceName, DriverVersion, DriverDate
          @'
          import os
          import openvino as ov
          print("OpenVINO", ov.get_version())
          core = ov.Core()
          # NPU only: core.available_devices initializes every plugin
          devices = core.get_property("NPU", "AVAILABLE_DEVICES")
          print("NPU devices:", devices)
          print("CPU capabilities:", core.get_property("CPU", "OPTIMIZATION_CAPABILITIES"))
          assert devices, "NPU plugin sees no device: Level Zero backend failed to initialize"
          arch = core.get_property("NPU", "DEVICE_ARCHITECTURE")
          print("NPU:", core.get_property("NPU", "FULL_DEVICE_NAME"), arch)
          assert os.environ["NPU_PLATFORM"] in arch, f"runner labels promise NPU {os.environ['NPU_PLATFORM']}, device is {arch}"
          '@ | python3 -

      # --- TensorFlow (off in infer mode: proxy-dmz blocks storage.googleapis.com and tfhub.dev) ---
      - name: Install TF Models tests requirements
        if: ${{ inputs.mode != 'infer' && (fromJSON(inputs.affected-components).NPU.test || fromJSON(inputs.changed-components).TF_FE) }}
        run: python3 -m pip install -r ${{ env.INSTALL_TEST_DIR }}\requirements_tensorflow

      - name: TensorFlow Models Tests - NPU ${{ inputs.mode }} (convert_model)
        if: ${{ inputs.mode != 'infer' && (fromJSON(inputs.affected-components).NPU.test || fromJSON(inputs.changed-components).TF_FE) }}
        shell: cmd
        run: |
          set PYTHONPATH=${{ env.INSTALL_TEST_DIR }}\model_hub_tests;%PYTHONPATH%
          python3 -m pytest ${{ env.INSTALL_TEST_DIR }}\model_hub_tests\tensorflow\test_tf_convert_model.py -m "%MODEL_SCOPE%" ^
            --html=${{ env.INSTALL_TEST_DIR }}\TEST-tf_fe_npu_convert_model_%NPU_PLATFORM%_%MODEL_SCOPE%.html --self-contained-html -v -s

      - name: TensorFlow Models Tests - NPU ${{ inputs.mode }} (read_model)
        if: ${{ !cancelled() && inputs.mode != 'infer' && (fromJSON(inputs.affected-components).NPU.test || fromJSON(inputs.changed-components).TF_FE) }}
        shell: cmd
        run: |
          set PYTHONPATH=${{ env.INSTALL_TEST_DIR }}\model_hub_tests;%PYTHONPATH%
          python3 -m pytest ${{ env.INSTALL_TEST_DIR }}\model_hub_tests\tensorflow\test_tf_read_model.py -m "%MODEL_SCOPE%" ^
            --html=${{ env.INSTALL_TEST_DIR }}\TEST-tf_fe_npu_read_model_%NPU_PLATFORM%_%MODEL_SCOPE%.html --self-contained-html -v -s

      # --- JAX (off in infer mode, like TensorFlow) ---------------------------
      - name: Install JAX Models tests requirements
        if: ${{ !cancelled() && inputs.mode != 'infer' && (fromJSON(inputs.affected-components).NPU.test || fromJSON(inputs.changed-components).JAX_FE) }}
        run: python3 -m pip install -r ${{ env.INSTALL_TEST_DIR }}\requirements_jax

      - name: JAX/Flax Models Tests - NPU ${{ inputs.mode }}
        if: ${{ !cancelled() && inputs.mode != 'infer' && (fromJSON(inputs.affected-components).NPU.test || fromJSON(inputs.changed-components).JAX_FE) }}
        shell: cmd
        run: |
          set PYTHONPATH=${{ env.INSTALL_TEST_DIR }}\model_hub_tests;%PYTHONPATH%
          python3 -m pytest ${{ env.INSTALL_TEST_DIR }}\model_hub_tests\jax\test_hf_transformers.py -m "%MODEL_SCOPE%" ^
            --html=${{ env.INSTALL_TEST_DIR }}\TEST-jax_npu_model_%NPU_PLATFORM%_%MODEL_SCOPE%.html --self-contained-html -v -s

      # --- PyTorch (runs after TF/JAX within the same leg) --------------------
      - name: Install PyTorch tests requirements
        if: ${{ !cancelled() && (fromJSON(inputs.affected-components).NPU.test || fromJSON(inputs.changed-components).PyTorch_FE) }}
        run: |
          python3 -m pip install -r ${{ env.INSTALL_TEST_DIR }}\requirements_pytorch `
            -r ${{ env.INSTALL_TEST_DIR }}\model_hub_tests\pytorch\envs\npu_models.txt

      - name: PyTorch Models Tests - NPU ${{ inputs.mode }}
        if: ${{ !cancelled() && (fromJSON(inputs.affected-components).NPU.test || fromJSON(inputs.changed-components).PyTorch_FE) }}
        shell: cmd
        env:
          OP_REPORT_FILE: "${{ env.INSTALL_TEST_DIR }}\\TEST-pt_npu_unsupported_ops_${{ matrix.npu-platform }}.log"
          # TEMP: each model also runs on CPU in f16, to tell NPU fp16 error from a systematic mismatch
          TEST_DEVICE: ${{ inputs.mode == 'infer' && 'NPU;CPU' || 'NPU' }}
          CPU_INFERENCE_PRECISION: ${{ inputs.mode == 'infer' && 'f16' || '' }}
        run: |
          set PYTHONPATH=${{ env.INSTALL_TEST_DIR }}\model_hub_tests;%PYTHONPATH%
          python3 -m pytest ${{ env.INSTALL_TEST_DIR }}\model_hub_tests\pytorch\test_npu_models.py -m "%MODEL_SCOPE%" ^
            --html=${{ env.INSTALL_TEST_DIR }}\TEST-pt_npu_models_%NPU_PLATFORM%_%MODEL_SCOPE%.html --self-contained-html -v -s

      - name: 'Diagnostics: after tests'
        if: ${{ always() && inputs.mode == 'infer' }}
        continue-on-error: true
        run: |
          "--- NPU device"
          Get-PnpDevice -PresentOnly -Class ComputeAccelerator -ErrorAction SilentlyContinue | Format-List Status, Problem, FriendlyName
          "--- System log errors and warnings since the job started"
          if ($env:DIAG_JOB_START) {
            Get-WinEvent -FilterHashtable @{ LogName = 'System'; Level = 1, 2, 3; StartTime = [datetime]::Parse($env:DIAG_JOB_START) } -MaxEvents 50 -ErrorAction SilentlyContinue |
              Format-Table -AutoSize -Wrap TimeCreated, LevelDisplayName, ProviderName, Id, Message
          }
          "--- Python processes left behind"
          Get-Process python* -ErrorAction SilentlyContinue | Format-Table -AutoSize Id, ProcessName, StartTime, Path
          "--- disk"
          "Disk C: free {0:N1} GB" -f ((Get-PSDrive C).Free / 1GB)
          "Job caches in RUNNER_TEMP: {0:N1} GB" -f ((Get-ChildItem -Recurse -Force -File "$env:RUNNER_TEMP\cache" -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum / 1GB)
          "--- files written to the user profile since the job started (left behind after the job)"
          if ($env:DIAG_JOB_START) {
            $since = [datetime]::Parse($env:DIAG_JOB_START)
            Get-ChildItem -Recurse -Force -File $env:USERPROFILE -ErrorAction SilentlyContinue |
              Where-Object { $_.LastWriteTime -gt $since } |
              Group-Object { ($_.DirectoryName.Substring($env:USERPROFILE.Length).TrimStart('\') -split '\\')[0..2] -join '\' } |
              ForEach-Object { [pscustomobject]@{ Dir = $_.Name; Files = $_.Count; MB = [math]::Round(($_.Group | Measure-Object Length -Sum).Sum / 1MB, 1) } } |
              Sort-Object MB -Descending | Select-Object -First 20 | Format-Table -AutoSize
          }
          "--- caches left in the user profile by earlier runs"
          foreach ($dir in "$env:LOCALAPPDATA\Temp\hugging_face", "$env:LOCALAPPDATA\Temp\tfhub_modules", "$env:USERPROFILE\.cache", "$env:LOCALAPPDATA\pip\Cache", "$env:USERPROFILE\.EasyOCR") {
            if (Test-Path $dir) {
              "{0}: {1:N1} GB" -f $dir, ((Get-ChildItem -Recurse -Force -File $dir -ErrorAction SilentlyContinue | Measure-Object Length -Sum).Sum / 1GB)
            }
          }
          "--- test reports"
          Get-ChildItem "${{ env.INSTALL_TEST_DIR }}\TEST*" -ErrorAction SilentlyContinue | Format-Table -AutoSize Name, Length

      - name: Upload Test Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-results-npu-models-${{ matrix.npu-platform }}-${{ inputs.mode }}-${{ inputs.model-scope }}
          path: |
            ${{ env.INSTALL_TEST_DIR }}\TEST*.html
            ${{ env.INSTALL_TEST_DIR }}\TEST-pt_npu_unsupported_ops_*.log
          if-no-files-found: 'error'
