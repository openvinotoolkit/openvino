name: NPU tests

on:
  workflow_call:
    inputs:
      runner:
        description: 'JSON runs-on value: list of labels or {"group": ..., "labels": [...]}. e.g. ["aks-win-4-cores-8gb-test"]'
        type: string
        required: true
      mode:
        description: 'compile: offline compilation for each NPU platform, no device needed. infer: compile, infer and compare on a host with a real NPU of that platform'
        type: string
        required: false
        default: 'compile'
      affected-components:
        description: 'Components that are affected by changes in the commit defined by the Smart CI Action'
        type: string
        required: false
        default: '{"NPU":{"test":true},"TF_FE":{"test":true},"JAX_FE":{"test":true},"PyTorch_FE":{"test":true}}'
      changed-components:
        description: 'Components that have changed in the commit defined by the Smart CI Action'
        type: string
        required: false
        default: '{}'
      npu-platforms:
        description: 'JSON list of NPU platforms, each runs on its own runner. In infer mode the runner must have that NPU. e.g. ["3720","4000","5010","5020","6010"]'
        type: string
        required: false
        default: '["3720","4000","5010","5020","6010"]'
      model-scope:
        description: 'Scope of models for testing (pytest marker)'
        type: string
        required: false
        default: 'precommit'

permissions: read-all

env:
  PYTHON_VERSION: '3.11'
  HF_HUB_CACHE_WIN: "C:\\mount\\caches\\huggingface"
  HF_TOKEN_PATH_WIN: "C:\\mount\\secrets\\huggingface\\token-secondary"
  # To debug NPU compiler, set OV_NPU_LOG_LEVEL=LOG_INFO or higher
  # OV_NPU_LOG_LEVEL: 'LOG_INFO'

jobs:
  NPU_Models_Tests:
    name: ${{ matrix.npu-platform }}
    # inference and the framework reference run come on top of compilation
    timeout-minutes: ${{ inputs.mode == 'infer' && 90 || 40 }}
    strategy:
      # one runner per NPU platform; keep going even if one platform fails.
      fail-fast: false
      matrix:
        npu-platform: ${{ fromJSON(inputs.npu-platforms) }}
    defaults:
      run:
        shell: pwsh
    runs-on: ${{ fromJSON(inputs.runner) }}
    env:
      INSTALL_DIR: "${{ github.workspace }}\\install"
      INSTALL_TEST_DIR: "${{ github.workspace }}\\install\\tests"
      INSTALL_WHEELS_DIR: "${{ github.workspace }}\\install\\wheels"
      TEST_DEVICE: 'NPU'
      NPU_PLATFORM: ${{ matrix.npu-platform }}
      NPU_TEST_MODE: ${{ inputs.mode }}
      MODEL_SCOPE: ${{ inputs.model-scope }}
      # Force UTF-8 stdio so third-party progress bars (e.g. easyocr's block
      # glyph) don't crash on the cp1252 Windows console.
      PYTHONUTF8: '1'
    steps:
      - name: Download OpenVINO artifacts (tests)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openvino_tests
          path: ${{ env.INSTALL_DIR }}
          merge-multiple: true

      - name: Download OpenVINO artifacts (wheels)
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: openvino_wheels
          path: ${{ env.INSTALL_WHEELS_DIR }}
          merge-multiple: true

      - name: Setup Variables
        run: |
          # AKS runners mount the shared HF cache and token; NPU hosts fall back to the
          # default per-user HF cache, which outlives the per-job work dir cleanup.
          if (Test-Path "${{ env.HF_HUB_CACHE_WIN }}") {
            Add-Content -Path $env:GITHUB_ENV -Value "HF_HUB_CACHE=${{ env.HF_HUB_CACHE_WIN }}"
            Add-Content -Path $env:GITHUB_ENV -Value "HUGGINGFACE_HUB_CACHE=${{ env.HF_HUB_CACHE_WIN }}"
          }
          if (Test-Path "${{ env.HF_TOKEN_PATH_WIN }}") {
            Add-Content -Path $env:GITHUB_ENV -Value "HF_TOKEN_PATH=${{ env.HF_TOKEN_PATH_WIN }}"
          } else {
            Write-Host "::warning::No HF token at ${{ env.HF_TOKEN_PATH_WIN }}, downloading anonymously (rate limited)"
          }

      - name: Extract OpenVINO tests package
        run: Expand-Archive openvino_tests.zip -DestinationPath . -Verbose
        working-directory: ${{ env.INSTALL_DIR }}

      - name: Fetch setup_python and install wheels actions
        uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b # cherry_pick_retries
        timeout-minutes: 15
        with:
          sparse-checkout: |
            .github/actions/setup_python/action.yml
            .github/actions/install_ov_wheels/action.yml
          sparse-checkout-cone-mode: false
          path: 'openvino'

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        uses: ./openvino/.github/actions/setup_python
        with:
          version: ${{ env.PYTHON_VERSION }}
          set-pip-install-path: 'false'
          self-hosted-runner: ${{ contains(inputs.runner, 'aks') }}
          use-pip-proxy: ${{ contains(inputs.runner, 'aks') }}

      - name: Trust the Intel proxy root CA
        run: |
          $proxyCa = 'C:\certs\IntelProxyRootCA.crt'
          if (-not (Test-Path $proxyCa)) { exit 0 }
          $bundle = Join-Path $env:RUNNER_TEMP 'ca-bundle.pem'
          $publicCa = python3 -c "import pip._vendor.certifi as c; print(c.where())"
          Get-Content $publicCa, $proxyCa | Set-Content -Encoding ascii $bundle
          foreach ($var in 'SSL_CERT_FILE', 'REQUESTS_CA_BUNDLE', 'CURL_CA_BUNDLE', 'PIP_CERT') {
            Add-Content -Path $env:GITHUB_ENV -Value "$var=$bundle"
          }

      - name: Install OpenVINO Python wheels
        uses: ./openvino/.github/actions/install_ov_wheels
        with:
          wheels-dir-path: ${{ env.INSTALL_WHEELS_DIR }}
          wheels-to-install: 'openvino'

      - name: Install certifi and set SSL_CERT_FILE for model downloading
        if: ${{ env.SSL_CERT_FILE == '' }}
        run: python3 -m pip install certifi && echo SSL_CERT_FILE=$(python3 -m certifi) >> $env:GITHUB_ENV

      - name: Check NPU device
        if: ${{ inputs.mode == 'infer' }}
        run: |
          @'
          import os
          import openvino as ov
          core = ov.Core()
          assert "NPU" in core.available_devices, f"no NPU among {core.available_devices}"
          arch = core.get_property("NPU", "DEVICE_ARCHITECTURE")
          print(core.get_property("NPU", "FULL_DEVICE_NAME"), arch)
          assert os.environ["NPU_PLATFORM"] in arch, f"runner labels promise NPU {os.environ['NPU_PLATFORM']}, device is {arch}"
          '@ | python3 -

      # --- TensorFlow ---------------------------------------------------------
      - name: Install TF Models tests requirements
        if: fromJSON(inputs.affected-components).NPU.test || fromJSON(inputs.changed-components).TF_FE
        run: python3 -m pip install -r ${{ env.INSTALL_TEST_DIR }}\requirements_tensorflow

      - name: TensorFlow Models Tests - NPU ${{ inputs.mode }} (convert_model)
        if: fromJSON(inputs.affected-components).NPU.test || fromJSON(inputs.changed-components).TF_FE
        shell: cmd
        run: |
          set PYTHONPATH=${{ env.INSTALL_TEST_DIR }}\model_hub_tests;%PYTHONPATH%
          python3 -m pytest ${{ env.INSTALL_TEST_DIR }}\model_hub_tests\tensorflow\test_tf_convert_model.py -m "%MODEL_SCOPE%" ^
            --html=${{ env.INSTALL_TEST_DIR }}\TEST-tf_fe_npu_convert_model_%NPU_PLATFORM%_%MODEL_SCOPE%.html --self-contained-html -v -s

      - name: TensorFlow Models Tests - NPU ${{ inputs.mode }} (read_model)
        if: ${{ !cancelled() && (fromJSON(inputs.affected-components).NPU.test || fromJSON(inputs.changed-components).TF_FE) }}
        shell: cmd
        run: |
          set PYTHONPATH=${{ env.INSTALL_TEST_DIR }}\model_hub_tests;%PYTHONPATH%
          python3 -m pytest ${{ env.INSTALL_TEST_DIR }}\model_hub_tests\tensorflow\test_tf_read_model.py -m "%MODEL_SCOPE%" ^
            --html=${{ env.INSTALL_TEST_DIR }}\TEST-tf_fe_npu_read_model_%NPU_PLATFORM%_%MODEL_SCOPE%.html --self-contained-html -v -s

      # --- JAX ----------------------------------------------------------------
      - name: Install JAX Models tests requirements
        if: ${{ !cancelled() && (fromJSON(inputs.affected-components).NPU.test || fromJSON(inputs.changed-components).JAX_FE) }}
        run: python3 -m pip install -r ${{ env.INSTALL_TEST_DIR }}\requirements_jax

      - name: JAX/Flax Models Tests - NPU ${{ inputs.mode }}
        if: ${{ !cancelled() && (fromJSON(inputs.affected-components).NPU.test || fromJSON(inputs.changed-components).JAX_FE) }}
        shell: cmd
        run: |
          set PYTHONPATH=${{ env.INSTALL_TEST_DIR }}\model_hub_tests;%PYTHONPATH%
          python3 -m pytest ${{ env.INSTALL_TEST_DIR }}\model_hub_tests\jax\test_hf_transformers.py -m "%MODEL_SCOPE%" ^
            --html=${{ env.INSTALL_TEST_DIR }}\TEST-jax_npu_model_%NPU_PLATFORM%_%MODEL_SCOPE%.html --self-contained-html -v -s

      # --- PyTorch (runs after TF/JAX within the same leg) --------------------
      - name: Install PyTorch tests requirements
        if: ${{ !cancelled() && (fromJSON(inputs.affected-components).NPU.test || fromJSON(inputs.changed-components).PyTorch_FE) }}
        run: |
          python3 -m pip install -r ${{ env.INSTALL_TEST_DIR }}\requirements_pytorch `
            -r ${{ env.INSTALL_TEST_DIR }}\model_hub_tests\pytorch\envs\npu_models.txt

      - name: PyTorch Models Tests - NPU ${{ inputs.mode }}
        if: ${{ !cancelled() && (fromJSON(inputs.affected-components).NPU.test || fromJSON(inputs.changed-components).PyTorch_FE) }}
        shell: cmd
        env:
          OP_REPORT_FILE: "${{ env.INSTALL_TEST_DIR }}\\TEST-pt_npu_unsupported_ops_${{ matrix.npu-platform }}.log"
        run: |
          set PYTHONPATH=${{ env.INSTALL_TEST_DIR }}\model_hub_tests;%PYTHONPATH%
          python3 -m pytest ${{ env.INSTALL_TEST_DIR }}\model_hub_tests\pytorch\test_npu_models.py -m "%MODEL_SCOPE%" ^
            --html=${{ env.INSTALL_TEST_DIR }}\TEST-pt_npu_models_%NPU_PLATFORM%_%MODEL_SCOPE%.html --self-contained-html -v -s

      - name: Upload Test Results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: test-results-npu-models-${{ matrix.npu-platform }}-${{ inputs.mode }}-${{ inputs.model-scope }}
          path: |
            ${{ env.INSTALL_TEST_DIR }}\TEST*.html
            ${{ env.INSTALL_TEST_DIR }}\TEST-pt_npu_unsupported_ops_*.log
          if-no-files-found: 'error'
