name: "CI Failure Doctor — Post-Commit"
on:
  # bots: # Bots processed as bot check in pre-activation job
  # - github-merge-queue # Bots processed as bot check in pre-activation job
  workflow_dispatch:
    inputs:
      aw_context:
        default: ""
        description: "Agent caller context (Reserved for Agentic Workflows)."
        required: false
        type: string
      link:
        description: Link to a workflow to investigate (for manual testing across repositories)
        required: false
      run_id:
        description: Workflow run ID to investigate (for manual testing)
        required: false
  workflow_run:
    # zizmor: ignore[dangerous-triggers] - workflow_run trigger is secured with role and fork validation
    branches:
      - master
    types:
      - completed
    workflows:
      - Linux (Ubuntu 22.04, Python 3.11)
      - Linux (Ubuntu 24.04, Python 3.12)
      - Android
      - Linux ARM64 (Ubuntu 22.04, Python 3.11)
      - Linux (Ubuntu 22.04, ARM64 cross-compilation, Python 3.11)
      - Linux Static CC (Ubuntu 22.04, Python 3.11, Clang)
      - Linux RISC-V (Ubuntu 22.04, Python 3.10)
      - Windows (VS 2022, Python 3.11, Release)
      - Windows (VS 2022, Python 3.11, Debug)
      - Windows Conditional Compilation (VS 2022, Python 3.11)
      - Webassembly
      - Manylinux 2_28
      - Clang-tidy static analysis (Ubuntu 24.04, Python 3.12, Clang-18, Clang-tidy-18)

# Jobs receive only their explicitly declared permissions.
permissions: {}

concurrency:
  group: gh-aw-${{ github.workflow }}

run-name: "CI Failure Doctor — Post-Commit"

env:
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.GH_AW_DEFAULT_OTLP_ENDPOINT || vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}
  OTEL_EXPORTER_OTLP_PROTOCOL: ${{ vars.OTEL_EXPORTER_OTLP_PROTOCOL }}
  OTEL_SERVICE_NAME: gh-aw.ci-doctor-post-commit
  OTEL_RESOURCE_ATTRIBUTES: 'gh-aw.workflow.name=CI%20Failure%20Doctor%20%E2%80%94%20Post-Commit,gh-aw.repository=${{ github.repository }},gh-aw.run.id=${{ github.run_id }},github.run_id=${{ github.run_id }},gh-aw.engine.id=copilot'
  OTEL_EXPORTER_OTLP_HEADERS: ${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}
  GH_AW_OTLP_LOGS_ENABLED: ${{ vars.GH_AW_OTLP_LOGS_ENABLED }}
  GH_AW_OTLP_LOGS_MAX_BYTES: ${{ vars.GH_AW_OTLP_LOGS_MAX_BYTES }}
  GH_AW_OTLP_ENDPOINTS: '[{"url":"${{ secrets.GH_AW_DEFAULT_OTLP_ENDPOINT || vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}","headers":"${{ secrets.GH_AW_DEFAULT_OTLP_HEADERS }}"}]'
  GH_AW_OTLP_IF_MISSING: ignore

