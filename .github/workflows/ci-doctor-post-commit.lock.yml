ired\":true,\"type\":\"string\"},\"pipeline_url\":{\"default\":null,\"description\":\"URL of the failed GitHub Actions workflow run.\",\"required\":true,\"type\":\"string\"},\"pr_number\":{\"default\":\"not_found\",\"description\":\"Pull request number if the failure is associated with a PR (e.g. a merge-queue PR). Omit otherwise.\",\"required\":false,\"type\":\"string\"},\"pr_url\":{\"default\":\"not_found\",\"description\":\"Pull request URL if the failure is associated with a PR (e.g. a merge-queue PR). Omit otherwise.\",\"required\":false,\"type\":\"string\"},\"source\":{\"default\":null,\"description\":\"Which CI Doctor produced this notification: 'merge_queue' for the Merge Queue investigator or 'post_commit' for the Post-Commit investigator. Controls the badge shown in the Teams card ([MQ] / [PC]) and the uploaded statistics artifact name.\",\"required\":true,\"type\":\"string\"},\"statistics\":{\"default\":null,\"description\":\"Markdown-formatted statistics summary of this CI Doctor's pattern database, uploaded as the statistics workflow artifact (NOT rendered in the Teams card). Must include a table (or list) of every known failure pattern with: pattern signature/title, total reproduction count, first-seen timestamp (UTC, ISO 8601), and last-seen timestamp (UTC, ISO 8601). Sort patterns by reproduction count descending. Compute from files under the doctor's own store, `/tmp/gh-aw/repo-memory/default/<slug>/investigations/` and `/tmp/gh-aw/repo-memory/default/<slug>/patterns/` (`<slug>` = `mq` or `post-commit`). Keep concise (top 20 patterns max).\",\"required\":true,\"type\":\"string\"},\"statistics_json\":{\"default\":null,\"description\":\"Full statistics database serialized as a compact JSON string. Must be a JSON object of the form {\\\"generated_at\\\": <ISO8601 UTC>, \\\"total_patterns\\\": <int>, \\\"total_investigations\\\": <int>, \\\"patterns\\\": [{\\\"signature\\\": <str>, \\\"title\\\": <str>, \\\"category\\\": <str>, \\\"count\\\": <int>, \\\