name: Windows (VS 2022, Python 3.11, Release)
on:
  workflow_dispatch:
    inputs:
      target-branch:
        description: 'Target branch for the build; taken from event context by default'
        type: string
        required: false
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  merge_group:
  push:
    branches:
      - master
      - 'releases/**'
concurrency:
  # github.ref is not unique in post-commit
  group: ${{ github.event_name == 'push' && github.run_id || github.ref }}-windows
  cancel-in-progress: true

env:
  TARGET_BRANCH: ${{ inputs.target-branch || github.base_ref || github.event.merge_group.base_ref || github.ref }}
  PYTHON_VERSION: '3.11'

permissions: read-all

jobs:
  Smart_CI:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false || github.run_attempt > 1
    outputs:
      affected_components: "${{ steps.smart_ci.outputs.affected_components }}"
      changed_components: "${{ steps.smart_ci.outputs.changed_components }}"
      skip_workflow: "${{ steps.smart_ci.outputs.skip_workflow }}"
      target_branch: ${{ steps.set_target_branch.outputs.target_branch }}
    steps:
      - name: checkout action
        uses: ababushk/checkout@dd591a6a2ac25618db4eda86e7e0d938f88cf01b # cherry_pick_retries
        timeout-minutes: 15
        with:
          sparse-checkout: .github/actions/smart-ci

      - name: Get affected components
        id: smart_ci
        uses: ./.github/actions/smart-ci
        with:
          repository: ${{ github.repository }}
          pr: ${{ github.event.number }}
          commit_sha: ${{ github.sha }}
          ref_name: ${{ github.ref_name }}
          component_pattern: "category: (.*)"
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          skip_when_only_listed_labels_set: 'docs'
          skip_when_only_listed_files_changed: '*.md,*.rst,*.png,*.jpg,*.svg,*/layer_tests_summary/*,*/conformance/*'

      - name: Get target branch
        id: set_target_branch
        run: |
          echo "target_branch=${TARGET_BRANCH#refs/heads/}" >> $GITHUB_OUTPUT

  Build:
    needs: [ Smart_CI ]
    if: ${{ !needs.smart_ci.outputs.skip_workflow }}
    uses: ./.github/workflows/job_build_windows.yml
    with:
      runner: 'aks-win-16-cores-32gb-build'
      cmake-build-parallel-level: '15'
      affected-components: ${{ needs.smart_ci.outputs.affected_components }}
      build-type: 'Release'
      target-branch: ${{ needs.smart_ci.outputs.target_branch }}
      build-additional-python-wheels: true
      build-samples: true
      cmake-options: >-
            -G 'Ninja Multi-Config'
            -DENABLE_PYTHON=ON
            -DENABLE_WHEEL=OFF
            -DENABLE_TESTS=ON
            -DENABLE_OV_GGUF_FRONTEND=ON
            -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
            -DENABLE_STRICT_DEPENDENCIES=OFF
            -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
            -DFETCHCONTENT_BASE_DIR="C:\fcc\ninja_multi_config"

  GPU_Functional_Tests_PTL:
    name: GPU functional tests PTL (shard ${{ matrix.shard }})
    needs: [ Build, Smart_CI ]
    if: "!needs.smart_ci.outputs.skip_workflow"
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    timeout-minutes: 530
    defaults:
      run:
        shell: powershell
    runs-on: [ self-hosted, Windows, ptl ]
    env:
      INSTALL_DIR: "${{ github.workspace }}\\install"
      INSTALL_TEST_DIR: "${{ github.workspace }}\\install\\tests"
      SSL_CERT_FILE: 'C:\certs\IntelProxyRootCA.crt'
      CURL_CA_BUNDLE: 'C:\certs\IntelProxyRootCA.crt'
      REQUESTS_CA_BUNDLE: 'C:\certs\IntelProxyRootCA.crt'
      NODE_EXTRA_CA_CERTS: 'C:\certs\IntelProxyRootCA.crt'
      GTEST_TOTAL_SHARDS: '4'
      GTEST_SHARD_INDEX: ${{ matrix.shard }}
      NEO_CACHE_PERSISTENT: '1'
      NEO_CACHE_MAX_SIZE: 16106127360 # 15GB
      NEO_CACHE_STATS: '1'
    steps:
      - name: Download OpenVINO package
        uses: akashchi/download-artifact@d59a9c15fec3fdb7c9adf09464124d00f9c11415 # main
        with:
          name: openvino_package
          path: ${{ env.INSTALL_DIR }}

      - name: Download OpenVINO tests package
        uses: akashchi/download-artifact@d59a9c15fec3fdb7c9adf09464124d00f9c11415 # main
        with:
          name: openvino_tests
          path: ${{ env.INSTALL_TEST_DIR }}

      - name: Extract OpenVINO packages
        run: |
          Expand-Archive "${{ env.INSTALL_DIR }}\\openvino_package.zip" -DestinationPath "${{ env.INSTALL_DIR }}" -Force
          Expand-Archive "${{ env.INSTALL_TEST_DIR }}\\openvino_tests.zip" -DestinationPath "${{ env.INSTALL_DIR }}" -Force

      - name: Check NEO cache dir size
        run: |
          $dir = $env:NEO_CACHE_DIR
          if (-not $dir) { $dir = Join-Path $env:LOCALAPPDATA 'NEO\neo_compiler_cache' }
          Write-Host "NEO cache dir: $dir"
          if (Test-Path $dir) {
            $size = (Get-ChildItem $dir -Recurse -File -Force -ErrorAction SilentlyContinue | Measure-Object -Property Length -Sum).Sum
            if (-not $size) { $size = 0 }
            Write-Host ("NEO cache dir size: {0} bytes ({1:N2} MB)" -f $size, ($size / 1MB))
          } else {
            Write-Host "NEO cache dir does not exist"
          }
          # Remove stale stats file so that only stats from the tests run are reported; keep its path for the print step
          $statsFile = Join-Path $dir 'stats'
          "NEO_STATS_FILE=$statsFile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          if (Test-Path $statsFile) {
            Write-Host "Removing NEO stats file: $statsFile"
            Remove-Item $statsFile -Force
          } else {
            Write-Host "NEO stats file not found: $statsFile"
          }

      - name: Run GPU functional smoke tests
        run: |
          . "${{ env.INSTALL_DIR }}\\setupvars.ps1"
          & "${{ env.INSTALL_TEST_DIR }}\\ov_gpu_func_tests.exe" "--gtest_filter=*smoke*" "--gtest_output=xml:${{ env.INSTALL_TEST_DIR }}\\TEST-gpu-functional-${{ matrix.shard }}.xml"
        timeout-minutes: 180

      - name: Print NEO STATS file content
        if: always()
        run: |
          $f = $env:NEO_STATS_FILE
          if (-not $f) {
            $dir = $env:NEO_CACHE_DIR
            if (-not $dir) { $dir = Join-Path $env:LOCALAPPDATA 'NEO\neo_compiler_cache' }
            $f = Join-Path $dir 'stats'
          }
          $dir = Split-Path $f -Parent
          Write-Host "NEO stats file: $f"
          if (-not (Test-Path $f)) {
            Write-Host "File not found: $f"
            if (Test-Path $dir) {
              Get-ChildItem $dir | Select-Object -First 50 Name, Length | Format-Table | Out-String | Write-Host
            }
            exit 0
          }
          $bytes = [System.IO.File]::ReadAllBytes($f)
          Write-Host "=== $f ($($bytes.Length) bytes) ==="
          $count = [int][math]::Floor($bytes.Length / 8)
          $values = for ($i = 0; $i -lt $count; $i++) { [BitConverter]::ToUInt64($bytes, $i * 8) }
          for ($i = 0; $i -lt $count; $i += 2) {
            $end = [math]::Min($i + 1, $count - 1)
            Write-Host (($values[$i..$end] | ForEach-Object { '{0,20}' -f $_ }) -join ' ')
          }
          if ($bytes.Length % 8) {
            Write-Host "Trailing $($bytes.Length % 8) byte(s) ignored"
          }

      - name: Upload GPU functional test results
        uses: ababushk/upload-artifact@ebc7d74ace101c08868aed05dba2aaf274b9a2c7 # main
        if: always()
        with:
          name: test-results-functional-gpu-${{ matrix.shard }}
          path: ${{ env.INSTALL_TEST_DIR }}/TEST-gpu-functional-${{ matrix.shard }}.xml
          if-no-files-found: 'ignore'

  Overall_Status:
    name: ci/gha_overall_status_windows
    needs: [ Smart_CI, Build, GPU_Functional_Tests_PTL ]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check status of all jobs
        if: >-
          ${{
            contains(needs.*.result, 'failure') ||
            contains(needs.*.result, 'cancelled')
          }}
        run: exit 1
