name: 'Compile cache statistics'
description: 'Reset (zero-stats) or collect sccache/ccache --show-stats metrics as human-readable logs and JSON, optionally uploading JSON as a workflow artifact.'
inputs:
  tool:
    description: 'Compile cache utility used for the build (sccache or ccache). Must match CMAKE_*_COMPILER_LAUNCHER.'
    required: true
  mode:
    description: 'collect (default) prints stats and uploads JSON; zero-stats clears counters before a cmake --build step.'
    required: false
    default: 'collect'
  build-label:
    description: 'Logical name of the cmake --build step (included in JSON and used for the default JSON filename).'
    required: false
    default: ''
  summary-title:
    description: 'Heading for the workflow job summary table. Defaults to GITHUB_JOB and build-label when set.'
    required: false
    default: ''
  artifact-name:
    description: 'Name of the uploaded artifact containing the JSON report (collect mode only).'
    required: false
    default: 'compile-cache-stats'
  json-path:
    description: 'Filesystem path for the JSON report. Defaults to $RUNNER_TEMP/compile-cache-stats[-<build-label>].json.'
    required: false
    default: ''
  upload-artifact:
    description: 'Whether to upload the JSON report as a workflow artifact (collect mode only).'
    required: false
    default: 'true'
outputs:
  tool:
    description: 'Compile cache utility used (sccache or ccache).'
    value: ${{ steps.collect.outputs.tool || steps.collect_windows.outputs.tool }}
  stats-json:
    description: 'Full statistics report as a JSON object (collect mode only).'
    value: ${{ steps.collect.outputs.stats-json || steps.collect_windows.outputs.stats-json }}
  stats-json-path:
    description: 'Filesystem path where the JSON report was written (collect mode only).'
    value: ${{ steps.collect.outputs.stats-json-path || steps.collect_windows.outputs.stats-json-path }}
runs:
  using: 'composite'
  steps:
    - name: Reset compile cache statistics
      if: ${{ inputs.mode == 'zero-stats' && runner.os != 'Windows' }}
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/collect_compile_cache_stats.py" --zero-stats --tool "$COMPILE_CACHE_TOOL"
      env:
        COMPILE_CACHE_TOOL: ${{ inputs.tool }}

    - name: Reset compile cache statistics
      if: ${{ inputs.mode == 'zero-stats' && runner.os == 'Windows' }}
      shell: pwsh
      run: python3 "$env:GITHUB_ACTION_PATH/collect_compile_cache_stats.py" --zero-stats --tool "$env:COMPILE_CACHE_TOOL"
      env:
        COMPILE_CACHE_TOOL: ${{ inputs.tool }}

    - name: Collect compile cache statistics
      if: ${{ inputs.mode == 'collect' && runner.os != 'Windows' }}
      id: collect
      shell: bash
      run: python3 "$GITHUB_ACTION_PATH/collect_compile_cache_stats.py" --tool "$COMPILE_CACHE_TOOL"
      env:
        COMPILE_CACHE_TOOL: ${{ inputs.tool }}
        COMPILE_CACHE_BUILD_LABEL: ${{ inputs.build-label }}
        COMPILE_CACHE_SUMMARY_TITLE: ${{ inputs.summary-title }}
        COMPILE_CACHE_STATS_JSON_PATH: ${{ inputs.json-path != '' && inputs.json-path || (inputs.build-label != '' && format('{0}/compile-cache-stats-{1}.json', runner.temp, inputs.build-label) || format('{0}/compile-cache-stats.json', runner.temp)) }}

    - name: Collect compile cache statistics
      if: ${{ inputs.mode == 'collect' && runner.os == 'Windows' }}
      id: collect_windows
      shell: pwsh
      run: python3 "$env:GITHUB_ACTION_PATH/collect_compile_cache_stats.py" --tool "$env:COMPILE_CACHE_TOOL"
      env:
        COMPILE_CACHE_TOOL: ${{ inputs.tool }}
        COMPILE_CACHE_BUILD_LABEL: ${{ inputs.build-label }}
        COMPILE_CACHE_SUMMARY_TITLE: ${{ inputs.summary-title }}
        COMPILE_CACHE_STATS_JSON_PATH: ${{ inputs.json-path != '' && inputs.json-path || (inputs.build-label != '' && format('{0}/compile-cache-stats-{1}.json', runner.temp, inputs.build-label) || format('{0}/compile-cache-stats.json', runner.temp)) }}

    - name: Upload compile cache statistics
      if: ${{ inputs.mode == 'collect' && inputs.upload-artifact == 'true' }}
      uses: ababushk/upload-artifact@ebc7d74ace101c08868aed05dba2aaf274b9a2c7 # main
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ steps.collect.outputs.stats-json-path || steps.collect_windows.outputs.stats-json-path }}
        if-no-files-found: error
