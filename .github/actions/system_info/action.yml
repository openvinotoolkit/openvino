name: 'System Information'
description: 'Information about the system'
runs:
  using: "composite"
  steps:
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        # Install pre-requisites for Fedora
        if [[ -e /etc/fedora-release ]]; then
          yum update -y -q && yum install -y -q procps
        fi

        echo "System: ${{ runner.os }}"
        echo "System Architecture: ${{ runner.arch }}"
        echo "CPU Info: "; lscpu
        echo "RAM Info: "; free -h --si
        echo "DISK Info: "; df -hl
        echo "CMAKE build parallel jobs (nproc): $(nproc)"
        echo "CMAKE build parallel jobs (NUMBER_OF_PROCESSORS): ${NUMBER_OF_PROCESSORS:-<unset>}"

    - if: runner.os == 'macOS'
      shell: bash
      run: |
        echo "System: ${{ runner.os }}"
        echo "System Architecture: ${{ runner.arch }}"
        echo "CPU and RAM Info: "; system_profiler SPHardwareDataType
        echo "DISK Info: "; df -h
        echo "CMAKE build parallel jobs (nproc): $(sysctl -n hw.ncpu 2>/dev/null || nproc 2>/dev/null || echo '<nproc not available>')"
        echo "CMAKE build parallel jobs (NUMBER_OF_PROCESSORS): ${NUMBER_OF_PROCESSORS:-<unset>}"

    - if: runner.os == 'Windows'
      shell: pwsh
      run: |
        echo "System: ${{ runner.os }}"
        echo "System Architecture: ${{ runner.arch }}"
        echo "CPU Info: "; Get-CimInstance –ClassName Win32_Processor | Select-Object -Property Name, NumberOfCores, NumberOfLogicalProcessors
        echo "RAM info: $(systeminfo | Select-String 'Total Physical Memory:')"
        $nprocOut = try { (nproc 2>&1 | Out-String).Trim() } catch { '<nproc not available>' }
        Write-Host "CMAKE build parallel jobs (nproc): $nprocOut"
        Write-Host "CMAKE build parallel jobs (NUMBER_OF_PROCESSORS): $Env:NUMBER_OF_PROCESSORS"
