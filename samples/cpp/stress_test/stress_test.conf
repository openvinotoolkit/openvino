# stress_test.conf
#
# Environment variables applied by stress_test before ov::Core is created.
# Lines starting with '#' and blank lines are ignored.
# Format: KEY=VALUE  (no spaces around '=')
#
# Uncomment and adjust the entries relevant to your platform and debug level.

# OpenVINO NPU plugin log level
# 0=NONE  1=FATAL  2=ERROR  3=WARNING  4=INFO  5=DEBUG  6=TRACE
# OV_NPU_LOG_LEVEL=4

# OpenVINO core log level
# Accepted values: NO  ERR  WARNING  INFO  DEBUG  TRACE
# LOG_LEVEL=WARNING

# Intel NPU Level Zero driver logging
# ZE_INTEL_NPU_LOGLEVEL controls verbosity; bitmask ZE_INTEL_NPU_LOGMASK
# selects which subsystems emit messages.
#
# Verbosity levels:
#   0=NONE  1=FATAL  2=ERROR  3=WARNING  4=INFO  5=VERBOSE  6=TRACE
# ZE_INTEL_NPU_LOGLEVEL=5
#
# Log mask bits (hex) - 0xFFFFFFFF enables everything:
# ZE_INTEL_NPU_LOGMASK=0xFFFFFFFF

# Level Zero validation / tracing (useful for L0 error investigation)
# ZE_ENABLE_VALIDATION_LAYER=1
# ZEL_TRACER_DIRECTORY=/tmp/ze_trace
