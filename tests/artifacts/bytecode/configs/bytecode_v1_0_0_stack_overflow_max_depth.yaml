version: [1, 0, 0]
output: bytecode_v1_0_0_stack_overflow_max_depth.bin

type_section:
  - id: i64
    kind: integer
    width: 64
    is_signed: true
  - id: fn_overflow_recursive
    kind: function
    params: [i64]
    results: [i64]
  - id: fn_main_overflow
    kind: function
    params: []
    results: [i64]

function_section:
  # Recursive function that always recurses (no base case reachable)
  # This will exceed the maxCallDepth limit of 1000
  - name: overflow_recursive
    type: fn_overflow_recursive
    # Register mapping:
    #   Scratch (G=3): 0=func_idx, 1=result
    #   Params  (P=1): 3=counter
    instructions:
      - op: set_imm
        args: [0, 0]
      - op: call
        func_idx_reg: 0
        dst_registers: [1]
        arg_registers: [3]
      - op: retv
        args: [1]

  # Entry point: initiates recursion that will overflow
  # Attempts depth ~1001 to exceed maxCallDepth=1000
  - name: main_overflow
    type: fn_main_overflow
    # Register mapping: 0=counter, 1=func_idx, 2=result
    instructions:
      - op: set_imm
        args: [0, 1001]
      - op: set_imm
        args: [1, 0]
      - op: call
        func_idx_reg: 1
        dst_registers: [2]
        arg_registers: [0]
      - op: retv
        args: [2]
