version: [1, 0, 0]
output: bytecode_v1_0_0_invalid_unknown_section_type.bin

type_section:
  - id: fn_type
    kind: function
    params: []
    results: []

function_section:
  - name: main
    type: fn_type
    instructions:
      - op: ret
        args: []

# An opaque section whose type byte (0x7F) is not defined in the current SectionType enum
unknown_sections:
  - section_type: 0x7F
    data: [0x01, 0x02, 0x03, 0x04, 0x05, 0x06, 0x07, 0x08]
